 "why": "新增", "t": "向后跳跃，躲避多种飞行过程中的攻击和技能弹道，并向魅惑魔女的攻击距离+%bonus_attack_range%范围内最远的%attack_targets%个敌方单位发动一次附有推进的攻击。", "b": 2}, {"id": "329cd937b761bf8b6db7", "n": "撼地者·沟壑", "m": "stun", "mz": "眩晕", "c": "基础", "d": "有", "why": "旧记录", "t": "用威武的图腾猛击地面，沿直线裂开地面，制造一条无法通过的岩脊，对沿途的敌方单位造成眩晕和伤害。\n小兵将会等待沟壑消失，不会去尝试绕开它。\n沟壑不会被林肯法球抵挡。", "b": 2}, {"id": "6d8f629d8eab30f5b0a9", "n": "复仇之魂·魔法箭", "m": "stun", "mz": "眩晕", "c": "基础", "d": "有", "why": "旧记录", "t": "向一个敌方单位射出魔法箭，眩晕并造成伤害。", "b": 2}, {"id": "1ed53f9fd2a48ae55b59", "n": "灵匣", "m": "mana_gain", "mz": "自身回蓝/吸蓝", "c": "装备", "d": "有", "why": "旧记录", "t": "被动：法术强化\n 下个对敌人施放的单体技能会单独对目标造成150点额外伤害，并且减缓30%移动速度，持续3秒。\n+6 全属性\n+5.5 生命恢复\n+2.25 魔法恢复", "b": 2}, {"id": "bf376b03c814b1b6ca82", "n": "狙击手·震荡手雷", "m": "disarm", "mz": "缴械", "c": "魔晶", "d": "有", "why": "旧记录", "t": "降低冷却时间，提升伤害并允许技能也能击退狙击手。\n向目标区域扔出一枚手雷，对敌人造成伤害并将他们和狙击手一同击退。受到作用的敌人被击退后还会被缴械和减速。", "b": 2}, {"id": "192c53314a38ae418833", "n": "石鳞剑士·甲盾冲击", "m": "self_mobility", "mz": "自身位移", "c": "基础", "d": "有", "why": "新增", "t": "石鳞剑士跃入空中，再落向当前位置的前方地面造成冲击，对范围内所有敌人造成伤害。甲盾冲击只要击中任意敌方英雄，他就能在短时间内获得一定数值的全伤害护盾。\n\n地雷滚滚过程中使用甲盾冲击将会保持前进，并且可以使地雷滚滚跨过地形障碍。", "b": 2}, {"id": "b55016a9757808e28dcc", "n": "邪影芳灵·诅咒王冠", "m": "stun", "mz": "眩晕", "c": "基础", "d": "有", "why": "旧记录", "t": "邪影芳灵授予敌人一顶被诅咒的古老仙灵王冠。经过一定延迟后，目标和周围的所有敌人都会被眩晕。", "b": 2}, {"id": "49729d50ad35b98b1e89", "n": "巨牙海民·酒友", "m": "self_mobility", "mz": "自身位移", "c": "魔晶", "d": "有", "why": "新增", "t": "巨牙海民伸出手来触碰友方单位，拉近彼此。触碰后巨牙海民和他的友军获得移动速度和护甲加成。\n如果巨牙海民和目标友军相距在%min_distance%距离以内，就不会拉动他们。\n在雪球期间无法使用。", "b": 2}, {"id": "e78befd04fee7f132e02", "n": "邪恶镰刀", "m": "silence", "mz": "沉默", "c": "装备", "d": "有", "why": "旧记录", "t": "主动：妖术\n将一个单位变成无害的小动物，持续2.8秒。目标的基础移速变为140，并且被沉默、锁闭和缴械。\n幻象会被立刻消灭。\n目标的基础移速将降至140，但是若拥有极限移动速度的状态就不会受影响。\n+30 智力\n+8.5 魔法恢复", "b": 2}, {"id": "4a08123c4b5f6ae484bd", "n": "卓尔游侠·冰川", "m": "ground_zone", "mz": "场地魔法", "c": "魔晶", "d": "有", "why": "新增", "t": "卓尔游侠在她脚下创造一片冰山，击退附近的敌人。站在山上的单位会获得飞行视野，而卓尔游侠和她的远程友军会获得攻击距离加成。卓尔游侠站在山上时攻击下方目标时获得额外伤害。山的前面会阻挡视野，并且除了卓尔游侠外无法穿行。施放时不会打断数箭齐发。", "b": 2}, {"id": "10e57e6080381de2af25", "n": "混沌骑士·混沌之军", "m": "applies_basic_dispel", "mz": "施加弱驱散", "c": "基础", "d": "有", "why": "旧记录", "t": "从其他维度召唤若干个混沌骑士的幻象。幻象继承%outgoing_damage_tooltip%%%攻击力，但是承受%incoming_damage_tooltip%%%伤害。\n驱散类型：弱驱散\n能够移除混沌骑士的大部分负面状态。\n混沌骑士在施放时有%invuln_duration%秒的无敌时间，可以躲避眩晕和伤害技能。", "b": 2}, {"id": "62a3fca3cd2af91f5b4f", "n": "压制之刃", "m": "tree_destroy", "mz": "砍树", "c": "装备", "d": "有", "why": "旧记录", "t": "主动：砍伐\n 砍伐一根指定树木。\n\n被动：压制\n对非英雄单位进行物理攻击会造成额外伤害，近战英雄为8点，远程英雄为4点。\n多个压制之刃效果不会叠加。", "b": 2}, {"id": "f4be4cc44edef8a74530", "n": "暗影护符", "m": "invisibility", "mz": "隐身", "c": "装备", "d": "有", "why": "旧记录", "t": "主动：渐隐\n使自身或友方英雄目标获得隐身效果，持续3.5秒。隐身期间的移动速度减缓35%。\n需要3.5秒中的1.25秒才能使英雄完全进入隐身状态。\n渐隐时间：1.25", "b": 2}, {"id": "803b485ed24afe52a7f8", "n": "水晶室女·冰晶克隆", "m": "disarm", "mz": "缴械", "c": "魔晶", "d": "有", "why": "新增", "t": "向一个方向滑行，在原地制造一个自身的冰晶克隆，并且躲避多种飞行过程中的攻击和技能弹道。如果克隆受到了足量伤害，或者超过一定时间都会碎裂，对附近%frostbite_radius%范围内敌人施加冰封禁制。克隆体也可以被水晶室女自身的技能摧毁。", "b": 2}, {"id": "33a5eb3dfc49232dd36c", "n": "斯拉克·黑暗契约", "m": "applies_strong_dispel", "mz": "施加强驱散", "c": "基础", "d": "有", "why": "旧记录", "t": "短暂延迟后，斯拉克牺牲部分生命力，清除大部分负面状态并对自己和周围敌方单位造成伤害。斯拉克自身只受到造成伤害的%self_damage_pct%%%。\n\n驱散类型：强驱散\n经过%delay%秒施法延迟后，每隔%pulse_interval%秒释放1道伤害波造成伤害，总共%total_pulses%道。\n每道伤害波还会移除斯拉克身上的负面效果。\n不能使用此技能自杀。\n如果斯拉克死亡，伤害波将停止释放。", "b": 2}, {"id": "9ff64357a3c31aeb8dcc", "n": "沙王·沙尘暴", "m": "projectile_dodge", "mz": "躲避弹道", "c": "基础", "d": "有", "why": "旧记录", "t": "沙王制造一起可怕的沙尘暴，对敌方单位造成伤害，同时沙王身处其中时获得隐身效果。沙王离开该区域后效果结束。\n沙尘暴可以用来躲避攻击和技能弹道。\n沙王在沙尘暴中攻击或使用技能会暂时显形。%fade_delay%秒后将再次隐形。", "b": 2}, {"id": "7069d109ff7a19930d52", "n": "破晓辰星·天光现世", "m": "self_mobility", "mz": "自身位移", "c": "基础", "d": "有", "why": "新增", "t": "持续施法 - 破晓辰星在地图上任意友方英雄%max_offset_distance%距离内的一个地点创造一个脉冲效果，并制造持续%daytime_duration%秒的白天。每次脉冲都会对敌人造成伤害，并治疗友军。经过一段短暂时间后，她飞向目标地点，落地时造成额外伤害并眩晕敌人。开始持续施法后，破晓辰星无法中止此技能。\n脉冲间隔为%pulse_interval%秒。\n总飞行时间为%abilitychanneltime%秒持续施法时间 + %airtime_duration%秒飞行时间。\n施放时立刻召回战锤。", "b": 2}, {"id": "d550c0b2a0b1c42426df", "n": "赏金猎人·暗影情谊", "m": "stun", "mz": "眩晕", "c": "魔晶", "d": "有", "why": "新增", "t": "对友军目标施加暗影步及其所有加成效果。友方单位的渐隐时间是%fade_time%秒。施放时不会使赏金猎人脱离隐身状态。", "b": 2}, {"id": "c5d49aa0c3fa359aa62f", "n": "法师克星", "m": "healing", "mz": "治疗/回复", "c": "装备", "d": "有", "why": "新增", "t": "被动：法师克星\n攻击敌人时施加一个负面效果，造成每秒35点物理伤害，并且使目标造成的技能伤害降低40%，持续3秒。\n+18% 魔法抗性\n+5.5 生命恢复\n+2.5 魔法恢复\n+12 攻击力", "b": 2}, {"id": "b6f5e7e73602fc7f7b3c", "n": "玛尔斯·神之谴戒", "m": "slow", "mz": "减速", "c": "基础", "d": "有", "why": "没再提到", "t": "玛尔斯举起他的战盾粉碎前方的敌人，将他们击退并且基于自身攻击力造成致命一击伤害。攻击英雄时攻击伤害提升。具有克敌机先效果。\n神之谴戒的攻击也有几率触发攻击特效。", "b": 1}, {"id": "e5e727107d0f39d441e2", "n": "赏金猎人·投掷飞镖", "m": "economy", "mz": "经济经验", "c": "A杖", "d": "有", "why": "新增", "t": "提升施法距离并且击中时施加忍术。\n向一个敌方单位掷出一枚致命的飞镖，对目标造成伤害，并且减缓目标的移动速度。只要目标周围%bounce_aoe%范围内存在被追踪术标记的单位，飞镖就能向其弹射。", "b": 2}, {"id": "2f3f3cfc51418b9f383b", "n": "沉默术士·全领域静默", "m": "silence", "mz": "沉默", "c": "基础", "d": "有", "why": "旧记录", "t": "沉默术士停止一切声音，阻止地图上所有敌方英雄和单位施法。\n沉默效果对隐身和减益免疫单位有效，但是期间获得减益免疫状态将移除该效果。\n来自阿哈利姆神杖升级全领域静默的多个奥术诅咒不会叠加。", "b": 2}, {"id": "d324f2d0293961d61d15", "n": "孽主·恶魔之扉", "m": "ground_zone", "mz": "场地魔法", "c": "A杖", "d": "有", "why": "新增", "t": "在传送门两端各召唤一个怨念深渊。减少冷却时间。\n打开2个传送门，一个在孽主身旁，另一个在目标地点。英雄可以对一个传送门持续施法%warp_channel_duration%秒，传送至另一端。传送门之间的距离必须超过%minimum_distance%。\n双击会在己方基地的泉水前打开另一个传送门。", "b": 2}, {"id": "43bcbc05e9e31355dc33", "n": "幻影长矛手·神行百变", "m": "tree_destroy", "mz": "砍树", "c": "基础", "d": "有", "why": "新增", "t": "幻影长矛手暂时从战场上消失。经过%delay%秒，幻影长矛手和附近的所有幻象都会出现在目标地点的随机位置，并产生两个新的幻象。施放技能后延长所有幻象的持续时间。新加的两个幻象拥有不同的特性：一个承受正常百分比的伤害，不具有攻击力，另一个额外承受%illusion_2_damage_in_pct%%%伤害，继承的攻击力相比本体减少%illusion_2_damage_out_pct%%%。\n\n驱散类型：弱驱散\n这个技能可以躲避攻击和技能弹道，并且驱散负面效果。\n重新现身的单位附近的树木将会被摧毁。\n幻影长矛手和他的队友可以分辨出哪个幻象承受100%伤害。", "b": 2}, {"id": "1a7905436f586af7083e", "n": "剧毒术士·瘟疫守卫", "m": "slow", "mz": "减速", "c": "基础", "d": "有", "why": "新增", "t": "召唤一个瘟疫守卫来攻击敌方单位和建筑。守卫对魔法免疫。守卫拥有毒刺攻击，效果与毒刺技能的当前等级相同，造成50%的原技能伤害。", "b": 2}, {"id": "cec205a9aa3133d9ccf7", "n": "钢背兽·钢毛后背", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "新增", "t": "如果伤害来自钢背兽的侧面或者背后，他所受的伤害将会降低。钢背兽每次从背后受到一定量伤害会自动释放一次当前等级的刺针扫射。\n钢背兽的背面是以背部中心点为原点，向左向右各呈70度角的扇形区域。\n钢背兽的侧面是以背部中心点为原点，向左向右各呈110度角的扇形区域，背面的扇形区域不算在内。\n这个技能造成的伤害被视为反弹伤害。反弹伤害不提供任何吸血，而且无法反弹。", "b": 2}, {"id": "fe64797a8d1b314a71d3", "n": "噬魂鬼·感染", "m": "spell_reflect", "mz": "反弹指向技能", "c": "基础", "d": "没有", "why": "旧记录", "t": "噬魂鬼进入目标单位的身体，无法被察觉，而且自身在体内时每秒恢复最大生命值的一定百分比。接着可以从宿主体内现身，对周围所有敌方单位造成伤害。如果被感染单位是敌方非英雄单位或中立生物，噬魂鬼可以控制其进行移动和攻击，而且该生物会持续失去最大生命值的一部分。无法对敌方英雄生效。\n\n驱散类型：弱驱散\n噬魂鬼在感染一个单位期间能够从周围死亡的单位身上获得经验。\n被感染控制的单位会获得感染的移动速度加成。\n不会触发法术反弹。\n感染可以对远古生物使用。", "b": 2}, {"id": "086c856a8cd21f85a5f4", "n": "朗戈·动人之舐", "m": "applies_basic_dispel", "mz": "施加弱驱散", "c": "基础", "d": "有", "why": "旧记录", "t": "朗戈用他的舌头舔舐目标单位，把它拉回一小段距离，施加弱驱散，如果是敌人还会造成伤害。\n\n击杀目标或驱散目标的效果后都会使朗戈暂时获得生命恢复。\n\n驱散类型：弱驱散\n可以舔舐神符，将其牵引。", "b": 2}, {"id": "627804bad77f4cad2082", "n": "独行德鲁伊·熊灵伙伴", "m": "economy", "mz": "经济经验", "c": "基础", "d": "没有", "why": "旧记录", "t": "召唤一只可以装备物品的熊灵伙伴。若熊灵与独行德鲁伊的距离超过%bear_attack_leash_range%，则不能攻击。如果熊灵死亡，独行德鲁伊会受到自身最大生命值的%backlash_damage%%%作为反冲伤害。\n熊灵拥有粉碎击、回归、缠绕之爪、野蛮咆哮和灵魂链接技能。\n熊灵受到的大多数技能效果与英雄相同。\n熊灵的基础属性为0，基础护甲为0并拥有%base_magic_resistance%%%基础魔法抗性。熊灵装备的物品或享受的加成效果具有的属性对熊灵的加成效果与全才英雄类似。\n熊灵无法获得经验。熊灵会跟随独行德鲁伊一起升级。\n熊灵拥有自己的阿哈利姆神杖和魔晶升级效果。\n熊灵会获得独行德鲁伊身上中立物品的复制品。这件复制品拥有独立的冷却时间。", "b": 2}, {"id": "3455246d02270fc1beb6", "n": "行家阵列", "m": "attack_modifier", "mz": "攻击特效", "c": "装备", "d": "有", "why": "新增", "t": "被动：分裂射击\n远程攻击有30%的概率向非原攻击目标的前方%secondary_target_angle%度角内、攻击距离+150距离内的最多2个附近敌人发射额外弹道。额外弹道造成20 + 75%普通攻击伤害，并且不会触发击中效果。主攻击造成20 + 100%普通攻击伤害。\n+15 敏捷\n+20 攻击力", "b": 2}, {"id": "cfa335c53c1c40b271cd", "n": "兽王·召唤刀背兽", "m": "attack_modifier", "mz": "攻击特效", "c": "基础", "d": "有", "why": "新增", "t": "兽王召唤一头豪猪前来助阵。豪猪拥有被动的毒素攻击，可以减缓攻击和移动速度。", "b": 2}, {"id": "972b0757d1efe5180b70", "n": "大地之灵·残岩魔咒", "m": "invulnerable_untargetable", "mz": "无敌/不可选取", "c": "A杖", "d": "有", "why": "新增", "t": "大地之灵对一名英雄施法，使其暂时获得残岩的属性。经过短时间后残岩就会碎裂，释放出英雄，并对周围单位造成伤害。可以对残岩施放。对残岩施放时冷却时间为5秒。对友方英雄施放时施法距离更远。\n如果大地之灵自身受到残岩魔咒的效果，也可以成为巨石冲击的目标。", "b": 2}, {"id": "0c6d07060220930b3277", "n": "影魔·魂之挽歌", "m": "lifesteal", "mz": "吸血", "c": "A杖", "d": "有", "why": "新增", "t": "降低冷却时间，并且魂之挽歌可以回归影魔。影魔会回复与回归伤害值相等的生命。\n影魔将捕获的灵魂中最多%max_soul_release%个进行聚集，以多道魔能的形式释放。若距离影魔过近将受到数道魔能的伤害。每道魔能对敌方单位造成伤害的同时，还将造成恐惧和减速效果，并且降低魔法抗性，持续%requiem_slow_duration%秒，最高可达%requiem_slow_duration_max%秒。通过支配死灵收集的每个灵魂会为魂之挽歌创造一道魔能。死亡时会自动释放魂之挽歌，不占用主动大招的冷却时间。\n影魔收集的灵魂中，每%requiem_soul_conversion%个会产生一道伤害波。\n死亡时释放的魂之挽歌不会施加恐惧和减速效果。", "b": 2}, {"id": "156f9a29fc600aa45ab4", "n": "戴泽·暗影波", "m": "healing", "mz": "治疗/回复", "c": "A杖", "d": "有", "why": "没再提到", "t": "暗影波现在也可对敌人施放，在友军和敌人之间都可以弹跳。弹跳至敌人时，他们会受到伤害，并且治疗附近友军，数值为%scepter_heal_pct%%%平常治疗和伤害量。戴泽还会对暗影波弹跳到的每个敌人发动一次攻击。\n放出一道能量弧，可以瞬间跳跃至目标附近的队友，治疗的同时还将对附近的敌方单位造成伤害。施放暗影波时戴泽必定会享受到治疗效果。\n优先治疗友方英雄\n如果敌军附近有多个我方单位，那么他将受到多重暗影波的伤害。", "b": 1}, {"id": "f6494eede995a37bfa76", "n": "狂战斧", "m": "pierces_debuff_immunity", "mz": "穿透减益免疫", "c": "装备", "d": "有", "why": "新增", "t": "主动：砍伐\n砍伐一根指定树木。\n\n被动：压制\n对非英雄单位进行物理攻击会造成额外伤害，近战英雄为10点，远程英雄为5点。\n\n被动：分裂\n普通攻击时对目标周围最远650距离的锥形区域内敌人造成60%物理伤害。对非英雄单位造成40%物理伤害。（仅近战有效）\n分裂伤害无视减益免疫。\n如果存在多个分裂效果，每个分裂的伤害都会单独计算。\n+50 攻击力\n+7.5 生命恢复\n+2.75 魔法恢复", "b": 2}, {"id": "f6a5447e4c86b032a126", "n": "宙斯·雷神之怒", "m": "true_sight", "mz": "真视", "c": "基础", "d": "有", "why": "旧记录", "t": "用闪电打击所有敌方英雄，对他们造成伤害，无论他们身在何处。在打击前提供每个英雄的真实视域。", "b": 2}, {"id": "e67b97bf753ecfe4e342", "n": "邪影芳灵·荆棘迷宫", "m": "ground_zone", "mz": "场地魔法", "c": "基础", "d": "有", "why": "新增", "t": "%initial_creation_delay%秒后邪影芳灵在目标区域创造出%placement_range%范围的迷宫，迷宫拥有%placement_count%棵荆棘。进入荆棘的敌人将被缠绕，并且持续受到伤害。迷宫持续%placement_duration%秒。\n缠绕无法打断持续施法。", "b": 2}, {"id": "02f5a41487247ea835ee", "n": "炼金术士·狂暴药剂", "m": "applies_basic_dispel", "mz": "施加弱驱散", "c": "魔晶", "d": "有", "why": "旧记录", "t": "炼金术士向友军目标扔出一瓶药剂，施加弱驱散效果，并提供攻击速度、移动速度和生命恢复。驱散类型：弱驱散", "b": 2}, {"id": "803561128c0d0b1a375b", "n": "昆卡·潮汐波", "m": "displace_other", "mz": "位移他人", "c": "魔晶", "d": "有", "why": "新增", "t": "释放一道在昆卡身后出现的潮汐波。造成点伤害，并将敌人沿着波浪拖拽距离。敌人被拖拽时无法攻击。", "b": 2}, {"id": "ad5b3c57d48193bcdf76", "n": "宙斯·霹雳之手", "m": "attack_modifier", "mz": "攻击特效", "c": "魔晶", "d": "有", "why": "新增", "t": "宙斯获得攻击速度加成，并且他的攻击会产生弧形闪电，造成一定百分比的伤害。可以关闭，使攻击不附带该效果。", "b": 2}, {"id": "d3f71a4f8e5ab74e84b2", "n": "恐怖利刃·倒影", "m": "spell_reflect", "mz": "反弹指向技能", "c": "基础", "d": "没有", "why": "旧记录", "t": "恐怖利刃映出目标区域内所有敌方英雄的黑暗倒影对其进行反制，目标在短时间内将被自身倒影攻击，移动速度和攻击速度都会降低。倒影为无敌状态。\n无法以倒影的幻象为目标，并且幻象为无敌，减速效果被移除后幻象将被摧毁。\n倒影只会攻击该技能指定的目标。", "b": 2}, {"id": "c4bfbf4553bd4e552c01", "n": "琼英碧灵·越界", "m": "projectile_dodge", "mz": "躲避弹道", "c": "基础", "d": "有", "why": "旧记录", "t": "琼英碧灵变身，成为虚无状态，获得基础攻击力加成和相位移动状态。被动使总是可以攻击虚无状态下的目标，并且她在虚无状态下也能攻击。在她或目标处于虚无时，她的所有攻击伤害均为魔法伤害，她的物理吸血被视为技能吸血。驱散类型：弱驱散\n琼英碧灵在变身期间可以躲避弹道。\n琼英碧灵在变身后无法攻击建筑。", "b": 2}, {"id": "e7ba7e35655e00f9bbc5", "n": "凯·翔影之钗", "m": "damage_block", "mz": "护盾/伤害吸收/减伤", "c": "基础", "d": "有", "why": "新增", "t": "装备双钗时凯的攻击有几率对敌人造成致命一击。凯可以主动开启技能，使自身被缴械，面朝方向被锁定，招架来自目标方向的攻击和攻击效果，持续%parry_duration%秒。如果有敌方英雄的攻击被招架，该英雄会被眩晕%parry_stun_duration%秒并获得印记，拥有印记的目标被凯攻击时必定会造成致命一击，并且被眩晕。子技能可以用于提前取消招架状态。", "b": 2}, {"id": "aad526436c9614045bc9", "n": "主宰·无敌斩", "m": "applies_basic_dispel", "mz": "施加弱驱散", "c": "基础", "d": "有", "why": "旧记录", "t": "主宰挥剑跃向敌方目标单位，随后再以更短的攻击频率斩击该单位和附近的其它敌方单位。主宰在无敌斩期间无敌。\n\n驱散类型：弱驱散\n无敌斩期间可以使用物品。", "b": 2}, {"id": "82d470d670b9c3ead539", "n": "玛西·怒拳破", "m": "attack_modifier", "mz": "攻击特效", "c": "基础", "d": "有", "why": "新增", "t": "玛西释放潜藏的力量，获得狂怒的猛攻效果，使自身可以发动快速的打击，并且降低打击目标的移动和攻击速度，持续%pulse_debuff_duration%秒。每次狂怒连技的最后一击都会创造一个脉冲效果，对目标周围的敌人造成伤害。在狂怒连技的间隔，玛西无法攻击，持续%time_between_flurries%秒。\n\n玛西施放怒拳破时移动速度提升%bonus_movespeed%%%。\n每次狂怒连技开始后，每次攻击都必须在1秒内完成，否则连技将会终止。\n移除攻击速度限制。", "b": 2}, {"id": "6c75ba44940d24ad0302", "n": "修补匠·折跃耀光", "m": "displace_other", "mz": "位移他人", "c": "魔晶", "d": "有", "why": "新增", "t": "向一个敌人扔出一枚光弹，造成伤害，将其向远离修补匠的方向传送并且缠绕，同时降低施法和攻击距离，持续%debuff_duration%秒。目标距离修补匠越近，传送距离越大。\n最大传送距离为%warp_distance_pct_tooltip%%%折跃耀光施法距离，在最大施法距离时降至0。", "b": 2}, {"id": "b2a2145da7366c2bce56", "n": "钢背兽·钢毛后背", "m": "disarm", "mz": "缴械", "c": "A杖", "d": "没有", "why": "旧记录", "t": "钢毛后背增加主动效果。钢背兽将背部转向目标方向，%activation_delay%秒后以%activation_spray_interval%秒间隔朝背部前方的锥形范围强行连续喷出%activation_num_quill_sprays%次刺针扫射。钢背兽在这段时间内面朝方向被锁定，被缴械，并且移动速度减缓%activation_movement_speed_pct%%%。\n如果伤害来自钢背兽的侧面或者背后，他所受的伤害将会降低。钢背兽每次从背后受到一定量伤害会自动释放一次当前等级的刺针扫射。\n钢背兽的背面是以背部中心点为原点，向左向右各呈70度角的扇形区域。\n钢背兽的侧面是以背部中心点为原点，向左向右各呈110度角的扇形区域，背面的扇形区域不算在内。\n这个技能造成的伤害被视为反弹伤害。反弹伤害不提供任何吸血，而且无法反弹。", "b": 2}, {"id": "645687b549784b90ce72", "n": "凯·翔影之钗", "m": "attack_modifier", "mz": "攻击特效", "c": "基础", "d": "有", "why": "新增", "t": "装备双钗时凯的攻击有几率对敌人造成致命一击。凯可以主动开启技能，使自身被缴械，面朝方向被锁定，招架来自目标方向的攻击和攻击效果，持续%parry_duration%秒。如果有敌方英雄的攻击被招架，该英雄会被眩晕%parry_stun_duration%秒并获得印记，拥有印记的目标被凯攻击时必定会造成致命一击，并且被眩晕。子技能可以用于提前取消招架状态。", "b": 2}, {"id": "03333a4dcfe73073cec3", "n": "蝙蝠骑士·闷烧树脂", "m": "attack_modifier", "mz": "攻击特效", "c": "基础", "d": "有", "why": "新增", "t": "蝙蝠骑士的攻击会施加一个负面效果，每%tick_rate%秒造成%tick_attack_damage_pct%%%攻击伤害，持续%total_ticks%秒。", "b": 2}, {"id": "a256c9f0fb660b1103f2", "n": "纷争面纱", "m": "spell_amp", "mz": "法术放大", "c": "装备", "d": "有", "why": "没再提到", "t": "主动：法术虚弱\n发出一波弱化冲击，使900范围内敌方英雄受到的技能伤害增加10%。\n\n可以在持续施法期间施放。\n\n持续时间：16秒。\n法术虚弱不与血精石的法术虚弱光环叠加。\n+175 生命值\n+10 智力\n+18% 技能吸血", "b": 1}, {"id": "90e05842b5b0145d0963", "n": "米波·洗劫", "m": "lifesteal", "mz": "吸血", "c": "基础", "d": "有", "why": "新增", "t": "每次攻击都会窃取敌人的生命值，并治疗所有其他米波相同数值生命。对非英雄单位的效果减少至60%。\n治疗数值会被生命回复增强效果提升。", "b": 2}, {"id": "29a2d0a39d92e3699bf0", "n": "艾欧·降临", "m": "displace_other", "mz": "位移他人", "c": "基础", "d": "有", "why": "新增", "t": "将艾欧和与其连接的友军传送到地图上任何位置。持续时间结束后艾欧和相连的友军会被传送回原位。双击将传送回己方的泉水。\n敌人在施法延迟期间会在大地图和小地图上目标区域都收到视觉特效提示。\n如果艾欧在施法延迟期间被控制，降临将会取消。\n如果羁绊连接了友方英雄，该英雄将和你一起被传送。你可以随时断开连接，防止英雄和你一同传送。\n只有英雄、类英雄单位和幻象可以降临。", "b": 2}, {"id": "aa913774828bcb1ddb25", "n": "沉默术士·默默受苦", "m": "damage_block", "mz": "护盾/伤害吸收/减伤", "c": "基础", "d": "有", "why": "新增", "t": "沉默术士对被沉默的目标造成更多伤害，受到来自他们的伤害减少。只要敌方英雄在沉默术士附近%permanent_int_steal_range%范围内阵亡或者死亡时带有沉默术士的负面效果，沉默术士都会永久窃取其%permanent_int_steal_amount%点智力。如果敌方英雄阵亡时被沉默，将额外窃取%silenced_bonus_int_steal_amount%点智力。", "b": 2}, {"id": "293b19dd30eaa2de1a94", "n": "主宰·迅风斩", "m": "aoe_damage", "mz": "范围伤害", "c": "A杖", "d": "有", "why": "新增", "t": "发动一次短时间的无敌斩，持续%duration%秒。", "b": 2}, {"id": "1b3f0db97b9985fa1d31", "n": "育母蜘蛛·织网", "m": "charges", "mz": "充能", "c": "基础", "d": "有", "why": "没再提到", "t": "编织出一张蜘蛛网，育母蜘蛛在蛛网里被动提升移动速度和转身速率，并且获得无视地形移动的能力。织网现在可向其他蛛网触及的区域全地图施放。蛛网永久存在，不过可以手动摧毁。当其数量超过上限，最早的蛛网将会消失。\n也会作用于小蜘蛛。", "b": 1}, {"id": "8a44fe54dc347db0c0e8", "n": "森海飞霞·爆栗出击", "m": "attack_modifier", "mz": "攻击特效", "c": "基础", "d": "有", "why": "新增", "t": "森海飞霞向目标单位发射一颗橡栗，可以弹射至附近敌人，减缓他们的移动速度，并造成攻击伤害的一定百分比和额外伤害。\n可以对地面施放，在目标地点种出一棵树，而橡栗会弹射至附近目标。设为多样施法（右键点击技能栏图标）后会强制沿用该行为。\n同一个目标可以被击中超过一次。\n弹射会搜寻525范围内战争迷雾中的单位，但无视隐身单位。\n种下的树持续20秒。", "b": 2}, {"id": "ca83787a37288dcc1dfd", "n": "军团指挥官·决斗", "m": "applies_strong_dispel", "mz": "施加强驱散", "c": "A杖", "d": "有", "why": "新增", "t": "如果军团指挥官在决斗中获胜，会在她周围自动触发强攻。\n军团指挥官强制与目标敌方英雄进行决斗，持续短暂的数秒。决斗开始后双方英雄不能使用任何物品，而目标敌方英雄不能使用技能。如果有英雄在决斗期间死亡，赢得决斗的英雄将永久获得攻击力加成。\n如果双方距离超过2000，决斗也会结束。", "b": 2}, {"id": "87f5fe9da9a579951edb", "n": "小小·抓树", "m": "cleave", "mz": "分裂溅射", "c": "基础", "d": "有", "why": "旧记录", "t": "抓起一棵树，使小小在有限次数的攻击里获得攻击距离加成、攻击力加成和溅射攻击。可以将树木扔出，对远距离的敌人造成攻击伤害。\n树木扔出后技能进入冷却。", "b": 2}, {"id": "53387b6a768800341c8e", "n": "沙王·地震", "m": "aoe_damage", "mz": "范围伤害", "c": "A杖", "d": "有", "why": "没再提到", "t": "地震的脉冲开始时每%spine_tick_rate%秒会在随机地点产生%scepter_explosions_per_pulse%片尾刺的攻击区域，每片区域为地震当前范围的%scepter_explosion_radius_pct%%%，对击中的敌人造成%spine_damage_pct%%%尾刺伤害。魔晶的地震波会产生%shard_explosions_per_pulse%次攻击。\n经过%abilitycastpoint%秒施法前摇后，沙王向地中发送扰动，引起大地剧烈震动。所有范围内的敌人会受到伤害并被减速。每次后续震波都会提高伤害传播半径。\n地震波将以沙王为中心，而不是他施放技能的地点。", "b": 1}, {"id": "f5a13c378ba75ba6983c", "n": "原力法杖", "m": "self_mobility", "mz": "自身位移", "c": "装备", "d": "有", "why": "新增", "t": "主动：原力\n将任何目标单位向其面对方向推进600距离。\n快速点击两次可以对自身施放原力。\n原力法杖不会打断目标的动作。\n对时间结界，决斗或黑洞内的单位无效。\n原力法杖对敌人施放时施法距离为850。\n+10 智力\n+175 生命值", "b": 2}, {"id": "9074e55eb854b9dad996", "n": "护腕", "m": "healing", "mz": "治疗/回复", "c": "装备", "d": "有", "why": "新增", "t": "+5 力量\n+2 敏捷\n+2 智力\n+0.75 生命恢复\n+50 生命值", "b": 2}, {"id": "d27519ad0e39f598f062", "n": "巫毒面具", "m": "lifesteal", "mz": "吸血", "c": "装备", "d": "有", "why": "新增", "t": "被动：技能吸血\n佩戴者每次对敌人造成技能伤害都将根据造成伤害的一定百分比回复生命值。\n纯粹伤害或反弹伤害不会进行治疗。\n+15% 技能吸血", "b": 2}, {"id": "41e2b6fbe9a2fd109f10", "n": "邪影芳灵·暗影之境", "m": "attack_modifier", "mz": "攻击特效", "c": "基础", "d": "有", "why": "新增", "t": "邪影芳灵遁入暗影之境，无法成为攻击或技能的目标。她的下次攻击具有%attack_range_bonus%额外攻击距离，并且造成额外魔法伤害，暗影之境技能也会随之结束。在暗影中时间越长，伤害越高。在暗影之境内的时间超过%max_damage_duration%秒将达到最高伤害。\n施法时能躲避弹道。\n获得相位移动状态。\n需要视野的技能无法作用于暗影之境中的邪影芳灵。", "b": 2}, {"id": "d72543cf7736974441f1", "n": "风之杖", "m": "self_mobility", "mz": "自身位移", "c": "装备", "d": "有", "why": "新增", "t": "主动：龙卷风\n使目标单位被卷入龙卷风中，持续2.5秒，并处于无敌状态。可以对自身、敌方单位或友方单位使用龙卷风。对自身使用后，自身能使龙卷风以300的移速进行移动。\n\n敌方单位落地后将受到50点魔法伤害。\n驱散类型：弱驱散\n龙卷风可以驱散部分正面和负面状态。\n对自身施放时，龙卷风可以任意移动，移动速度为360。\n龙卷风持续时间不受状态抗性影响。\n+30 移动速度\n+3 魔法恢复\n+35 智力", "b": 2}, {"id": "57b48360f9a182a5550b", "n": "侦察·岗哨守卫", "m": "true_sight", "mz": "真视", "c": "装备", "d": "有", "why": "新增", "t": "使用：放置\n放置当前可用的守卫。双击守卫切换当前可用的守卫。\n按住Ctrl键可以将一个守卫分给友方英雄。\n侦察视野范围：1600\n侦察持续时间（分钟）：6\n岗哨守卫持续时间（分钟）：8\n岗哨守卫真实视域范围：1050", "b": 2}, {"id": "39f76e6f54ca150a7780", "n": "树精卫士·自然卷握", "m": "ground_zone", "mz": "场地魔法", "c": "基础", "d": "有", "why": "新增", "t": "朝目标地点制造藤蔓。藤蔓对穿过的敌人造成减速和伤害。对非英雄单位造成的伤害减少%creep_penalty%%%。", "b": 2}, {"id": "550bafe1de790de752e2", "n": "食人魔魔法师·引燃", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "新增", "t": "使目标和另一个随机单位浸透在挥发性化学物质中，导致其瞬间被火焰吞噬。目标处在极度痛苦之中，受到伤害并且移动缓慢。\n多重施法将使此技能有几率对%ignite_multicast_aoe%范围内的随机敌方单位进行多次施放。\n引燃现在击中已受到作用的单位后会增加持续时间。", "b": 2}, {"id": "5495aa6d1d3e8f2417d6", "n": "哈斯卡·牺牲", "m": "pierces_debuff_immunity", "mz": "穿透减益免疫", "c": "基础", "d": "有", "why": "新增", "t": "哈斯卡牺牲自己的生命来摧毁敌人的生命，他跃向一个目标，造成目标当前生命值一定百分比的伤害，并且降低目标的移动和攻击速度。哈斯卡在跳跃过程中为减益免疫，并且魔法抗性提升%immunity_resist%%%。\n\n驱散类型：弱驱散\n如果哈斯卡在跳跃时受到控制技能，或目标在0.015秒内移动1400码以上，跳跃就会停止。\n减速效果无视减益免疫。\n牺牲无法被躲避。", "b": 2}, {"id": "4cbe8676501b672fe5f3", "n": "米波·洗劫", "m": "attack_modifier", "mz": "攻击特效", "c": "基础", "d": "有", "why": "新增", "t": "每次攻击都会窃取敌人的生命值，并治疗所有其他米波相同数值生命。对非英雄单位的效果减少至60%。\n治疗数值会被生命回复增强效果提升。", "b": 2}, {"id": "6e3f36008eeb3bf9f6e5", "n": "谜团·事件视界", "m": "aura", "mz": "光环", "c": "基础", "d": "有", "why": "新增", "t": "%radius%范围内的单位远离谜团时会受到移速惩罚。", "b": 2}, {"id": "2859c69655465c4132e3", "n": "琼英碧灵·弹无虚发", "m": "fear", "mz": "恐惧", "c": "基础", "d": "有", "why": "改名", "t": "琼英碧灵向一个敌方单位或一棵树发射一颗幽灵子弹。子弹击中时会对敌人造成伤害和短暂减速，然后沿矢量目标的方向弹去。跳弹将会对穿过的所有单位造成伤害，击中英雄后停下。被跳弹击中的英雄会被恐惧。\n被恐惧的敌人为相位状态，无法被减速。\n跳弹的行进距离为弹无虚发施法距离的%ricochet_distance_multiplier%倍。\n可以弹离减益免疫目标。", "b": 1}, {"id": "1444c4c105033ad5e9fc", "n": "天涯墨客·墨涌", "m": "aura", "mz": "光环", "c": "基础", "d": "有", "why": "新增", "t": "天涯墨客将一个友方单位笼罩在一片墨汁中，目标的移动速度得到提升。友方单位附近的敌人会持续被墨须伤害。%buff_duration%秒后将根据墨须对英雄造成伤害的时间对区域内单位造成伤害和眩晕。", "b": 2}, {"id": "4fd18b7cf7d057c0cdc9", "n": "裂魂人·巨力重击", "m": "bash", "mz": "重击", "c": "基础", "d": "有", "why": "没再提到", "t": "攻击时有一定概率眩晕并击退敌方单位。重击的伤害值为移动速度的一定百分比。\n不与碎颅锤叠加。\n破坏会使攻击触发巨力重击失效。暗影冲刺或幽冥一击还是会施加巨力重击。", "b": 1}, {"id": "9427f1c2cd8b7ed51190", "n": "发条技师·发射钩爪", "m": "self_mobility", "mz": "自身位移", "c": "基础", "d": "有", "why": "新增", "t": "向目标位置高速射出钩爪，如果命中一个单位，发条技师会将自己牵引到目标身边，对目标附近%stun_radius%范围内所有敌人造成眩晕和伤害。对牵引时冲撞到的单位也造成伤害和眩晕。\n发射钩爪可以抓住友方单位并将发条技师牵引过去，但是不会造成伤害和眩晕。", "b": 2}, {"id": "9fc5cfcd8db333dfd289", "n": "暗影萨满·禽戏", "m": "applies_strong_dispel", "mz": "施加强驱散", "c": "基础", "d": "有", "why": "旧记录", "t": "受到致死伤害时，暗影萨满会获得强驱散效果，并且以1点生命的小鸡继续存活。受到的伤害将降为零，持续较短时间，并且额外产生若干只小鸡，迷惑敌人。冷却时间会在暗影萨满复活时重置。\n\n驱散类型：强驱散\n无法阻止斧王的淘汰之刃和瘟疫法师的死神镰刀的致死伤害。\n受到的伤害减免效果会阻止生命移除类效果杀死暗影萨满。", "b": 2}, {"id": "b08dfb936a6ccf71036d", "n": "帕克·相位转移", "m": "attack_modifier", "mz": "攻击特效", "c": "魔晶", "d": "有", "why": "新增", "t": "帕克的攻击造成额外魔法伤害。帕克每次施放相位转移时对攻击距离内所有敌人发动一次攻击。\n持续施法 - 帕克暂时将自己转移到另一个位面，从而免疫伤害。\n帕克在相位转移状态下依然具有碰撞体积。\n进行任何动作都会中止相位转移。\n帕克在相位转移状态下无敌。", "b": 2}, {"id": "f578c72e2125e497b824", "n": "虚无之灵·残阴", "m": "true_sight", "mz": "真视", "c": "魔晶", "d": "有", "why": "旧记录", "t": "额外产生一道观察路径，会围绕残阴旋转。残阴现在会提供真实视域，不再对非英雄单位触发，而是每秒在两道路径上造成%creep_damage_pct%%%伤害。不会使守卫显形。\n虚无之灵向目标地点派出一个残像。残像观察着一片区域，面朝矢量的方向。当有目标进入其视线，残像会拉扯，并造成伤害。", "b": 2}, {"id": "5626836aefbfdff5200e", "n": "斯拉克·能量转移", "m": "stat_steal", "mz": "偷属性", "c": "基础", "d": "有", "why": "旧记录", "t": "斯拉克的攻击会偷走敌方英雄的生命能量，每次吸取他们的%stat_loss%点全属性并转化成自身额外%agi_gain%点敏捷值。只要敌方英雄带着该效果在斯拉克300范围内阵亡，他将永久窃取%stat_loss%点敏捷。\n属性值最少为1点。\n斯拉克或受到作用的单位死亡后，阵亡单位因能量转移变化的属性值将回归正常。但是两方的属性值相互独立，并无关联。\n斯拉克无需完成击杀就能永久窃取敏捷，只要敌方英雄身上拥有能量转移状态时在斯拉克的窃取范围内阵亡即可。\n破坏会使技能无法获得临时的叠加效果。依然可以获得永久的叠加效果。\n破坏不会使现有叠加效果提供的加成失效。", "b": 2}, {"id": "d23200278757d4be352c", "n": "暗影恶魔·威胁", "m": "incoming_damage_amp", "mz": "伤害加深", "c": "基础", "d": "有", "why": "新增", "t": "暗影恶魔的攻击会对敌人施加一个可叠加的负面状态，使他们受到的伤害增加，持续%duration%秒。\n破坏会使技能无法施加新的叠加效果。\n破坏不会使现有叠加效果提供的状态失效。", "b": 2}, {"id": "054b3f554a201e1f2d2f", "n": "帕吉·腐烂", "m": "aura", "mz": "光环", "c": "基础", "d": "有", "why": "新增", "t": "能够造成持续伤害并减缓敌人移动速度的毒性云雾——同时对敌军和自身造成伤害。\n使用腐烂不会打断持续施法。\n腐烂能伤害隐身单位。\n即使帕吉在开启腐烂后被沉默，腐烂也不会关闭。\n腐烂的对己伤害不致死。", "b": 2}, {"id": "62df2ee4cccc81e33ae2", "n": "炼金术士·化学狂暴", "m": "cooldown_reduction", "mz": "减冷却", "c": "基础", "d": "没有", "why": "旧记录", "t": "炼金术士诱发他的食人魔同伴进入化学狂暴，降低攻击间隔，提高移动速度和生命恢复。\n\n驱散类型：弱驱散\n拥有%transformation_time%秒的变身时间，可以用来躲避攻击和技能弹道以及眩晕技能。", "b": 2}, {"id": "7e7e2e3d79d3f566de1c", "n": "虚无之灵·太虚之径", "m": "self_mobility", "mz": "自身位移", "c": "基础", "d": "有", "why": "新增", "t": "虚无之灵撕裂现实进入精神位面，再出现在目标地点，对沿途的所有敌人造成伤害。此次攻击将施加一个太虚印记，造成%pop_damage_delay%秒减速，然后引爆。\n太虚之径的攻击不会分裂。", "b": 2}, {"id": "8078c1bfe16e2d7d815e", "n": "石鳞剑士·甲盾冲击", "m": "aoe_damage", "mz": "范围伤害", "c": "A杖", "d": "有", "why": "没再提到", "t": "甲盾冲击将围绕英雄每90度施放一个刺击2次的虚张声势，造成%scepter_damage_outgoing_tooltip%%%伤害。\n石鳞剑士跃入空中，再落向当前位置的前方地面造成冲击，对范围内所有敌人造成伤害。甲盾冲击只要击中任意敌方英雄，他就能在短时间内获得一定数值的全伤害护盾。\n\n地雷滚滚过程中使用甲盾冲击将会保持前进，并且可以使地雷滚滚跨过地形障碍。", "b": 1}, {"id": "3c38f4dde9038aa2b485", "n": "淬毒之珠", "m": "attack_modifier", "mz": "攻击特效", "c": "装备", "d": "有", "why": "新增", "t": "被动：毒性攻击\n使目标中毒，造成每秒12点魔法伤害。持续3秒。\n不与后续升级物品叠加。", "b": 2}, {"id": "a8a93c65bdf23db55bd1", "n": "剧毒术士·瘟疫守卫", "m": "attack_modifier", "mz": "攻击特效", "c": "基础", "d": "有", "why": "新增", "t": "召唤一个瘟疫守卫来攻击敌方单位和建筑。守卫对魔法免疫。守卫拥有毒刺攻击，效果与毒刺技能的当前等级相同，造成50%的原技能伤害。", "b": 2}, {"id": "86cfe25d49a00f2b47dd", "n": "米拉娜·天界箭袋", "m": "charges", "mz": "充能", "c": "魔晶", "d": "有", "why": "没再提到", "t": "跳跃的加成状态生效时获得%quiver_restore%点临时能量。\n有可用能量时，米拉娜的下次攻击会造成额外魔法伤害。", "b": 1}, {"id": "305e8c1608b5616d3b0b", "n": "石鳞剑士·幸运一击", "m": "attack_modifier", "mz": "攻击特效", "c": "基础", "d": "有", "why": "新增", "t": "石鳞剑士孤注一掷，让命运决定敌人的下场。石鳞剑士的攻击或技能拥有一定几率大幅降低攻击速度，同时削弱护甲。", "b": 2}, {"id": "2c3b247c671c2e38df3e", "n": "干扰者·静态风暴", "m": "ground_zone", "mz": "场地魔法", "c": "基础", "d": "有", "why": "新增", "t": "创造一场静态风暴，在持续时间内伤害并沉默区域内的所有敌方单位。伤害刚开始时很低，但会在持续时间内逐渐增加。", "b": 2}, {"id": "304f2945352e454123fe", "n": "米波·掘地", "m": "healing", "mz": "治疗/回复", "c": "魔晶", "d": "有", "why": "新增", "t": "挖掘进入地下，对自身施加驱散效果，无敌且不能作为目标，持续%duration%秒。持续时间内回复最大生命值的%hp_restore%%%。被缠绕时无法施放。驱散类型：弱驱散", "b": 2}, {"id": "fcd59177fdcc346263fc", "n": "雷神之锤", "m": "attack_modifier", "mz": "攻击特效", "c": "装备", "d": "有", "why": "新增", "t": "主动：静电冲击\n对目标单位施加一个静电护盾，持续12秒。护盾有20%几率对附近攻击护盾的目标及其周围%static_strikes%个敌方单位释放闪电冲击，造成225点魔法伤害。\n\n被动：连环闪电\n攻击有25%几率释放一道连环闪电，在650范围内12个目标之间跳跃，每次造成180点魔法伤害。触发闪电时无视闪避。\n静电冲击的触发间隔大于1秒。\n静电冲击的闪电伤害范围以拥有甲盾的英雄为圆心。静电冲击只会对900范围以内的目标发出闪电冲击。\n静电冲击不会弹跳至处于隐身状态下或战争迷雾内的英雄。\n+25 攻击力\n+90 攻击速度", "b": 2}, {"id": "86723f25978f65630804", "n": "祈求者·强袭飓风", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "没再提到", "t": "释放出一道快速移动的飓风，将路径上的敌方单位卷起，使其在空中无助地漂浮一段时间，然后落地受死。最大距离取决于雷元素等级。滞空时间取决于冰元素等级。落地伤害取决于雷元素的等级。\n\n驱散类型：弱驱散\n被强袭飓风吹起时单位处于无敌状态，落地时受到伤害。", "b": 1}, {"id": "f81ff8a79169e44d8c8e", "n": "幻影刺客·刀阵旋风", "m": "applies_break", "mz": "施加破坏", "c": "A杖", "d": "有", "why": "旧记录", "t": "幻影刺客对附近范围内敌人放出尖利的刀刃，击中时造成每名受害者最大生命值一定百分比的伤害并施加破坏效果。", "b": 2}, {"id": "9fc7b82684b6a5e25a56", "n": "祈求者·阳炎冲击", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "没再提到", "t": "向目标区域释放毁灭性的阳炎之光能量，一旦能量着陆，将对区域内的敌人进行灼烧。伤害取决于火元素等级，区域内敌人将平摊所有伤害。\n施放后立即获得目标区域的视野。\n祈求者使用阳炎冲击击杀英雄后，即使不在经验范围内也能获得经验。", "b": 1}, {"id": "43921d07cca729a01438", "n": "先锋盾", "m": "healing", "mz": "治疗/回复", "c": "装备", "d": "有", "why": "新增", "t": "被动：伤害格挡\n 拥有60%几率格挡伤害，近战英雄可格挡50点伤害，远程英雄可格挡25点。\n多种伤害格挡物品的效果互不叠加。\n+250 生命值\n+4.5 生命恢复", "b": 2}, {"id": "7f99850bfae137d42771", "n": "净魂之刃", "m": "attack_modifier", "mz": "攻击特效", "c": "装备", "d": "有", "why": "新增", "t": "主动：阻止\n 以敌方单位为目标，减缓其移动速度，持续4秒。\n\n被动：破法\n每次攻击将燃烧目标40点魔法，而且每燃烧一点魔法都会造成1点物理伤害。\n\n幻象不会燃烧魔法。\n不会与其他净魂之刃叠加。\n+15 敏捷\n+10 智力", "b": 2}, {"id": "87eeb60d7c51154dadc9", "n": "吸血面具", "m": "lifesteal", "mz": "吸血", "c": "装备", "d": "有", "why": "新增", "t": "被动：吸血\n攻击者每次攻击都将根据造成伤害的一定百分比回复生命值。\n+18% 吸血", "b": 2}, {"id": "33dfcc6d1c8f518c0b32", "n": "暗夜魔王·虚空", "m": "aoe_damage", "mz": "范围伤害", "c": "魔晶", "d": "有", "why": "新增", "t": "虚空现在影响目标范围内所有单位。\n制造一个伤害性的虚空，对一个敌方单位造成减速及伤害。夜晚时虚空可以造成短暂眩晕，打断持续施法，并且效果的持续时间更长。\n虚空在白天不会对敌人造成眩晕。", "b": 2}, {"id": "1ce82451889546f30057", "n": "黑暗贤者·复制之墙", "m": "ground_zone", "mz": "场地魔法", "c": "基础", "d": "有", "why": "新增", "t": "制造一堵扭曲的光墙，对穿过的敌方英雄造成伤害和减速，并复制一个其自身的幻象，幻象由黑暗贤者控制，持续到光墙消失，或者被敌人消灭。\n幻象不会产生幻象。\n每堵光墙同一时间产生的为一名英雄产生的幻象只有一个。", "b": 2}, {"id": "a236cbfbb553e8fb121e", "n": "死亡先知·驱使恶灵", "m": "lifesteal", "mz": "吸血", "c": "A杖", "d": "有", "why": "新增", "t": "敌人受到死亡先知的技能作用，或被死亡先知攻击时，会有一只恶灵飞出攻击敌人，造成高于平常的伤害，再返回使自身回复生命。\n释放恶灵偷走敌方单位和建筑的生命。恶灵需要回到她身上才能再次攻击。持续时间结束后，死亡先知根据造成的伤害量，获得一定比例的治疗。对建筑造成50%%伤害。持续%abilityduration%秒。\n作用范围代表死亡先知周围的恶灵寻找目标的范围。\n伤害格挡类技能不能减少恶灵伤害。", "b": 2}, {"id": "97391fb78e6af710f179", "n": "娜迦海妖·海妖之歌", "m": "invulnerable_untargetable", "mz": "无敌/不可选取", "c": "基础", "d": "有", "why": "新增", "t": "娜迦海妖周围的所有敌人受到魔法影响陷入停滞状态，既无法行动也不会受到攻击。再次使用海妖之歌可以提前停止效果。\n海妖之歌作用下的单位处于无敌状态，不会受到任何伤害。\n海妖之歌的作用范围以娜迦海妖为中心，如果她远离了作用单位，他们将会醒来。", "b": 2}, {"id": "7595f9858e58ed908428", "n": "死亡先知·地穴虫群", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "新增", "t": "召唤一群食腐虫在死亡先知面前的敌人中肆虐。\n最远能伤害1110距离外的单位。\n不会触发法术抵抗或法术反弹。", "b": 2}, {"id": "c9afc68854b04c78f1a7", "n": "上古巨神·回音重踏", "m": "sleep", "mz": "睡眠", "c": "基础", "d": "有", "why": "旧记录", "t": "持续施法 - 上古巨神与他的灵体游魂一起践踏地面，对敌方单位造成伤害并使他们在原地昏迷。上古巨神造成物理伤害，灵体游魂造成魔法伤害。\n若同时处于灵体游魂和上古巨神的回音重踏作用范围内将受到两次伤害。", "b": 1}, {"id": "60a63bdf13c8f166406f", "n": "娜迦海妖·诱捕", "m": "applies_break", "mz": "施加破坏", "c": "A杖", "d": "有", "why": "旧记录", "t": "提升施法距离和弹道速度。诱捕可以对减益免疫单位施放并且生效。诱捕会施加破坏效果。\n打断目标的动作并将其困在原地，使其无法移动或闪烁。可以对海妖之歌作用下的单位施放。", "b": 2}, {"id": "8c536b7d15c39aa14505", "n": "谜团·黑洞", "m": "ground_zone", "mz": "场地魔法", "c": "基础", "d": "有", "why": "新增", "t": "持续施法 - 召唤一个强引力漩涡吸住敌方单位。被黑洞影响的单位不能移动、攻击或施法。", "b": 2}, {"id": "9e206d5654ca1442e316", "n": "半人马战行者·马到成功", "m": "aoe_damage", "mz": "范围伤害", "c": "A杖", "d": "有", "why": "新增", "t": "半人马战行者套上一辆便车。开启后半人马战行者获得当前等级奔袭冲撞的加成效果，而且可以对友方目标施放便车。", "b": 2}, {"id": "ef1b89ff7ebeb6aeb4b9", "n": "狼人·饿狼撕咬", "m": "healing", "mz": "治疗/回复", "c": "A杖", "d": "有", "why": "没再提到", "t": "狼人撕咬友方英雄或类英雄单位，使其获得变身效果。自身和目标都获得%lifesteal_percent%%%吸血效果，并且双方距离只要不超过%lifesteal_range%就能共用吸血效果。\n饿狼撕咬的冷却时间与变身的当前等级相同。", "b": 1}, {"id": "9ee4ead1d6cad55fa91b", "n": "水晶室女·冰封禁制", "m": "disarm", "mz": "缴械", "c": "基础", "d": "有", "why": "新增", "t": "操控冰霜包围一个敌方单位，禁止移动和攻击，并持续造成伤害。对非远古的普通单位施放将造成%creep_multiplier%倍伤害。\n冰封禁制为捆缚效果。", "b": 2}, {"id": "e6fa69ddf7afc43a3a63", "n": "绝刃", "m": "healing", "mz": "治疗/回复", "c": "装备", "d": "有", "why": "新增", "t": "被动：法术强化\n下个对敌人施放的单体技能会单独对目标造成250点额外伤害，禁用其被动技能，并且减缓30%移动速度，持续4秒。\n减速的负面效果可以被驱散。\n破坏的负面效果不能被驱散。\n+450 生命值\n+450 魔法值\n+8 全属性\n+7 生命恢复\n+3 魔法恢复", "b": 2}, {"id": "0c1802f9981d39e81466", "n": "冥魂大帝·本命一击", "m": "attack_modifier", "mz": "攻击特效", "c": "魔晶", "d": "有", "why": "新增", "t": "本命一击会诅咒目标，使其在%curse_delay%秒延迟后再次受到%curse_damage_pct%%%原攻击伤害的纯粹伤害。吸血灵魂的吸血效果对诅咒伤害有效。\n冥魂大帝被动地在攻击时造成额外伤害，本技能具有冷却时间。", "b": 2}, {"id": "ee54bf9e88d749aa4bc4", "n": "蝙蝠骑士·火焰飞行", "m": "ground_zone", "mz": "场地魔法", "c": "基础", "d": "有", "why": "新增", "t": "蝙蝠骑士飞向天空，从空中留下一道燃烧的尾迹。飞行时，燃烧尾迹会破坏树木，对经过的敌人造成伤害。在火焰飞行持续时间的最后会达到最高移动速度加成。\n火焰飞行期间蝙蝠骑士可以飞越任何单位，树木和不可通行的地形。\n如果蝙蝠骑士在持续时间结束时正好在不可通行的地形上方，那么他将会卡住。\n蝙蝠骑士死亡后火焰效果将继续存在。", "b": 2}, {"id": "921d5f5e4c7184b3e7e0", "n": "齐天大圣·猴子猴孙", "m": "attack_modifier", "mz": "攻击特效", "c": "A杖", "d": "有", "why": "新增", "t": "每隔一段时间在齐天大圣附近产生一个猴子猴孙。隐身或上树时不会产生。只有齐天大圣在附近时猴子猴孙才会攻击建筑。猴子猴孙现在独立获得如意棒法的效果。\n齐天大圣变出圆形的猴子猴孙阵列，猴子猴孙从他的位置散开。若齐天大圣离开范围，猴子猴孙将会消失。猴子猴孙继承齐天大圣的攻击力，攻击频率为固定的%attack_speed%秒，并且只会以敌方英雄为目标。在技能持续时间内齐天大圣获得护甲加成。齐天大圣可以在猴子猴孙期间变成其中一个猴子猴孙，短时间内取代其位置，无法和其他猴子猴孙相区分，并且在原地留下一个猴子猴孙。\n猴子猴孙不会获得如意棒法的加成效果。\n猴子猴孙不会继承碎颅锤和深渊之刃的效果。", "b": 2}, {"id": "e24b307ca69de7ab9a8e", "n": "散夜对剑", "m": "slow_resistance", "mz": "减速抗性", "c": "装备", "d": "有", "why": "新增", "t": "不会与其他夜叉、散夜对剑以及幻影斧提供的移动速度加成叠加。\n+16 力量\n+16 敏捷\n+16% 状态抗性\n+20 攻击速度\n+12% 移动速度\n+16% 恢复增强\n+30% 减速抗性", "b": 2}, {"id": "6cb38bedb4b318176f2c", "n": "维萨吉·陵卫斗篷", "m": "healing", "mz": "治疗/回复", "c": "魔晶", "d": "有", "why": "新增", "t": "获得主动效果，维萨吉可以化作石像形态，对身边375范围内的敌人造成0.8/1.0/1.2秒眩晕，同时造成60/100/140点伤害，获得6秒无敌状态。最多恢复%shard_hp_restoration_pct%%%生命值。\n维萨吉产生数层屏障来保护他，降低受到的伤害。每当他受到来自玩家的伤害，就会失去一层屏障，失去的屏障需要一定时间才能恢复。维萨吉的佣兽在%radius%范围内也会受到斗篷的保护，承伤降低的数值取决于维萨吉拥有的层数。\n每次维萨吉受到来自其他玩家的伤害超过最小伤害时，保护层就会移除一层。\n佣兽在维萨吉周围%radius%范围内将获得当前陵卫斗篷的承伤降低效果。\n破坏会使技能无法获得新的叠加效果。\n破坏不会使现有叠加效果提供的加成失效。", "b": 2}, {"id": "722901445a0319758702", "n": "娜迦海妖·激流", "m": "attack_modifier", "mz": "攻击特效", "c": "基础", "d": "有", "why": "新增", "t": "娜迦海妖和她的幻象每经过%hits%次攻击后就会对敌人造成额外伤害，并降低他们的护甲，持续%duration%秒。\n使用激流不会打断持续施法。", "b": 2}, {"id": "75a5f8cb7ce04d3a5bf6", "n": "裂魂人·巨力重击", "m": "bash", "mz": "重击", "c": "A杖", "d": "有", "why": "没再提到", "t": "击退效果提升。如果击退的敌人又撞到了一个敌人，这个敌人也会被重击（非英雄单位只受到%cascading_bashes_creep_penalty%%%伤害），并且原目标再次受到%cascading_bashes_damage_multiplier%%%的巨力重击伤害。\n攻击时有一定概率眩晕并击退敌方单位。重击的伤害值为移动速度的一定百分比。\n不与碎颅锤叠加。\n破坏会使攻击触发巨力重击失效。暗影冲刺或幽冥一击还是会施加巨力重击。", "b": 1}, {"id": "a320e94c2ed7275caf0c", "n": "斯嘉蒂之眼", "m": "attack_modifier", "mz": "攻击特效", "c": "装备", "d": "有", "why": "新增", "t": "被动：霜冻攻击\n攻击对敌方远程目标会减缓-50%移动速度，对敌方近战目标会减缓-25%移动速度。攻击还会降低敌人-25%攻击速度和%restoration_reduction%%生命回复。持续3秒。\n+35 全属性", "b": 2}, {"id": "d325f79fb7294e9952cc", "n": "末日使者·末日", "m": "applies_break", "mz": "施加破坏", "c": "A杖", "d": "有", "why": "旧记录", "t": "末日对敌人施加破坏效果。末日作用下目标%scepter_aura_radius%范围内友军也会受到末日的作用。可以对自身施放末日，使末日作用于末日使者周围的敌人。\n对敌人施加末日诅咒，对其进行驱散，并且使其无法施放技能或获得任何治疗效果，同时造成持续伤害。\n\n驱散类型：弱驱散", "b": 2}, {"id": "d5a1c8dd68b34fa92f67", "n": "钢背兽·钢毛后背", "m": "damage_block", "mz": "护盾/伤害吸收/减伤", "c": "基础", "d": "有", "why": "新增", "t": "如果伤害来自钢背兽的侧面或者背后，他所受的伤害将会降低。钢背兽每次从背后受到一定量伤害会自动释放一次当前等级的刺针扫射。\n钢背兽的背面是以背部中心点为原点，向左向右各呈70度角的扇形区域。\n钢背兽的侧面是以背部中心点为原点，向左向右各呈110度角的扇形区域，背面的扇形区域不算在内。\n这个技能造成的伤害被视为反弹伤害。反弹伤害不提供任何吸血，而且无法反弹。", "b": 2}, {"id": "d0e99dc07f3ca1d7e660", "n": "殁境神蚀者·星体禁锢", "m": "cyclone_banish", "mz": "吹风/放逐", "c": "基础", "d": "有", "why": "新增", "t": "窃取目标最大魔法值的一定百分比，将其禁锢在星体中。被隐藏的英雄处于无敌和无法行动状态。禁锢结束时，对目标造成伤害。\n被禁锢的单位依然能受到神智之蚀的作用。\n最大魔法值窃取效果不会提升殁境神蚀者的当前魔法值，也不会直接减少目标的当前魔法值。", "b": 2}, {"id": "ce5b99207704ca1301d2", "n": "雷神之锤", "m": "damage_return", "mz": "反伤", "c": "装备", "d": "有", "why": "新增", "t": "主动：静电冲击\n对目标单位施加一个静电护盾，持续12秒。护盾有20%几率对附近攻击护盾的目标及其周围%static_strikes%个敌方单位释放闪电冲击，造成225点魔法伤害。\n\n被动：连环闪电\n攻击有25%几率释放一道连环闪电，在650范围内12个目标之间跳跃，每次造成180点魔法伤害。触发闪电时无视闪避。\n静电冲击的触发间隔大于1秒。\n静电冲击的闪电伤害范围以拥有甲盾的英雄为圆心。静电冲击只会对900范围以内的目标发出闪电冲击。\n静电冲击不会弹跳至处于隐身状态下或战争迷雾内的英雄。\n+25 攻击力\n+90 攻击速度", "b": 2}, {"id": "aee3255cd3e0ef4d93cc", "n": "帕吉·肢解", "m": "lifesteal", "mz": "吸血", "c": "基础", "d": "有", "why": "新增", "t": "持续施法 - 帕吉撕咬一个敌方单位，使其失去行动能力并受到持续伤害。伤害量为基础伤害加上帕吉力量值的一定百分比，帕吉将回复与伤害量相等的生命。帕吉会将该单位以每秒%pull_units_per_second%的速度向自身牵引，最多牵引%pull_distance_limit%距离。\n即使肢解的目标在受到作用的过程中隐身，还是不会脱离肢解的作用。", "b": 2}, {"id": "69704b9f1b59b3d93119", "n": "龙骑士·龙炎火球", "m": "ground_zone", "mz": "场地魔法", "c": "魔晶", "d": "有", "why": "新增", "t": "点燃一片区域，对其中的敌人持续造成伤害，伤害效果还会粘滞。近战形态下施放距离较近。", "b": 2}, {"id": "435f801a0aecbdcfb0fe", "n": "天涯墨客·缚魂", "m": "leash", "mz": "束缚", "c": "基础", "d": "有", "why": "改名", "t": "将一名敌方英雄与束缚作用范围内最接近的队友相连，阻止他们远离彼此。任何指向性技能击中任一英雄时，这两名敌方英雄都会受到作用。若连接在效果截止前断裂，初始目标将再次与其距离内最接近的队友相连。\n如果与另一个单位一起被束缚，作用下单位均被束缚，而且无法使用闪烁类技能。\n被束缚的单位都将提供视野。", "b": 1}, {"id": "8f125b0335516450f3ca", "n": "百戏大王·聚光灯", "m": "ground_zone", "mz": "场地魔法", "c": "魔晶", "d": "有", "why": "新增", "t": "百戏大王用%spotlight_count%束聚光灯照亮一片区域。灯光下的敌人有几率丢失攻击，隐身状态下也会显形。被光束击中的幻象会逐渐消散，每秒失去一定百分比的最大生命值。这些效果在灯束离开后会粘滞%linger_duration%秒。", "b": 2}, {"id": "d08bf981f2f7d116b2b4", "n": "孽主·衰退光环", "m": "attack_damage_reduction", "mz": "减攻击力", "c": "基础", "d": "有", "why": "旧记录", "t": "周围所有敌方单位遭到了削弱，损失部分基础攻击力。如果敌方英雄在光环范围内死亡，孽主将获得临时的额外攻击力加成。\n破坏会使攻击力降低光环失效，并且孽主无法获得新的额外攻击力。", "b": 2}, {"id": "fc63a8d7ee73e6f1731a", "n": "石鳞剑士·甲盾冲击", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "没再提到", "t": "石鳞剑士跃入空中，再落向当前位置的前方地面造成冲击，对范围内所有敌人造成伤害。甲盾冲击只要击中任意敌方英雄，他就能在短时间内获得一定数值的全伤害护盾。\n\n地雷滚滚过程中使用甲盾冲击将会保持前进，并且可以使地雷滚滚跨过地形障碍。", "b": 1}, {"id": "472803efe9a0c71f7f10", "n": "寒冬飞龙·严寒烧灼", "m": "terrain_walk", "mz": "无视地形", "c": "基础", "d": "有", "why": "新增", "t": "寒冬飞龙乘着一股极地寒风扶摇而上，移动将无视地形，每次攻击都将呼出逼人的寒气。高飞时，她的攻击距离更远，攻击弹道速度也更快，被攻击的敌人在寒意作用下，移动速度会被减缓，同时每秒损失%percent_damage%%%当前生命值。\n本技能无法作用于肉山。\n寒冬飞龙的攻击前摇降低至%attack_point%秒。\n严寒烧灼的持续伤害和减速可以被驱散。", "b": 2}, {"id": "aedb9382de54eb88ba8b", "n": "卓尔游侠·冰川", "m": "terrain", "mz": "创造地形", "c": "魔晶", "d": "有", "why": "新增", "t": "卓尔游侠在她脚下创造一片冰山，击退附近的敌人。站在山上的单位会获得飞行视野，而卓尔游侠和她的远程友军会获得攻击距离加成。卓尔游侠站在山上时攻击下方目标时获得额外伤害。山的前面会阻挡视野，并且除了卓尔游侠外无法穿行。施放时不会打断数箭齐发。", "b": 1}, {"id": "e8da16676c30548cf103", "n": "狼人·召狼", "m": "attack_slow", "mz": "减攻速", "c": "基础", "d": "有", "why": "新增", "t": "召唤%wolf_count%头精灵狼为狼人战斗。3级精灵狼获得永久隐身，4级精灵狼获得致残技能，20%几率使目标残废，造成每秒8点伤害，并失去60攻击速度，持续4秒。\n使用此技能后原来的狼群将会死亡。", "b": 2}, {"id": "c36fd2e7aff9438e6dc7", "n": "卓尔游侠·数箭齐发", "m": "pierces_debuff_immunity", "mz": "穿透减益免疫", "c": "基础", "d": "有", "why": "新增", "t": "持续施法 - 卓尔游侠在最多%abilitychanneltime%秒内不断地射出阵阵箭矢，对卓尔游侠攻击距离 + %arrow_range_base%的距离内击中的敌人造成额外伤害，并施加霜冻之箭效果。卓尔游侠在施放数箭齐发时可以缓慢移动和使用物品。\n箭矢的基础伤害无视减益免疫。\n霜冻之箭的额外伤害和减速效果不无视减益免疫。", "b": 2}, {"id": "8eecfae33e0d34bdc750", "n": "斯拉克·深海护罩", "m": "ground_zone", "mz": "场地魔法", "c": "魔晶", "d": "有", "why": "新增", "t": "在目标地点创造一团云雾。作用范围内所有友军为隐藏状态，受到暗影之舞的作用。", "b": 2}, {"id": "b8696e58da507b89f45a", "n": "杰奇洛·烈焰焚身", "m": "ground_zone", "mz": "场地魔法", "c": "基础", "d": "有", "why": "新增", "t": "杰奇洛释放出烈焰风暴，烈焰风暴作用范围很宽，并持续数秒。烈焰风暴每秒都会对作用范围内的敌人造成伤害。\n被烈焰焚身击中后离开区域还将额外受到%linger_duration%秒伤害效果。", "b": 2}, {"id": "dcfb76a87eda5fc0d6fe", "n": "沉默术士·全领域静默", "m": "slow", "mz": "减速", "c": "A杖", "d": "有", "why": "新增", "t": "全领域静默在全领域静默的持续时间内对英雄施加奥术诅咒。\n沉默术士停止一切声音，阻止地图上所有敌方英雄和单位施法。\n沉默效果对隐身和减益免疫单位有效，但是期间获得减益免疫状态将移除该效果。\n来自阿哈利姆神杖升级全领域静默的多个奥术诅咒不会叠加。", "b": 2}, {"id": "4e47923d44bff7b1f415", "n": "幻影长矛手·并列", "m": "illusions", "mz": "幻象", "c": "魔晶", "d": "有", "why": "没再提到", "t": "并列增加主动技能。使幻影长矛手进入隐身，最多持续%invis_duration%秒，同时产生一个复制幻象来迷惑敌人。隐身期间自身移动速度提升%invis_movespeed%%%。\n幻影长矛手的攻击有一定几率使自己的存在破碎，产生自身的幻象。幻象也有几率进一步破碎，再产生幻象。幻影长矛手产生的幻象持续%illusion_duration%秒，幻象产生的幻象则持续%illusion_from_illusion_duration%秒。", "b": 1}, {"id": "825c79333744914f8377", "n": "寒冬飞龙·极寒之拥", "m": "damage_block", "mz": "护盾/伤害吸收/减伤", "c": "基础", "d": "有", "why": "新增", "t": "将队友封入一个冰茧中，使其被冻在原地并恢复生命值，恢复数值为基础数值加上最大生命值的一定比例。冰茧将阻隔一切物理伤害。", "b": 2}, {"id": "17da38788959275b300f", "n": "编织者·缩地", "m": "aoe_damage", "mz": "范围伤害", "c": "魔晶", "d": "有", "why": "没再提到", "t": "缩地在造成伤害的敌人身上留下一个标记，持续%geminate_attack_mark_duration%秒。编织者脱离缩地状态%shukuchi_attack_delay%秒后，附近%shukuchi_attack_mark_radius%范围内拥有印记的敌人都会被连击的第二次攻击击中。\n编织者进入隐身身，达到移动速度上限，在穿过敌方单位时还将造成伤害。\n每次施放的技能只能对相同单位造成一次伤害。", "b": 1}, {"id": "a8457088eb492a11f0c8", "n": "兽王·召唤刀背兽", "m": "summons", "mz": "召唤物", "c": "基础", "d": "有", "why": "新增", "t": "兽王召唤一头豪猪前来助阵。豪猪拥有被动的毒素攻击，可以减缓攻击和移动速度。", "b": 2}, {"id": "7c546f3817e446b38a70", "n": "雷泽·风暴涌动", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "没再提到", "t": "被攻击时拥有几率、每次受到指向性技能时都会释放一道叉状闪电，击中目标和附近其他敌人，优先打击与目标类型相同的单位，造成伤害并减缓移动速度。\n这个技能造成的伤害被视为反弹伤害。反弹伤害不提供任何吸血，而且无法反弹。", "b": 1}, {"id": "1159ff1c1ed0427607a0", "n": "凯·翔影之钗", "m": "bash", "mz": "重击", "c": "基础", "d": "有", "why": "新增", "t": "装备双钗时凯的攻击有几率对敌人造成致命一击。凯可以主动开启技能，使自身被缴械，面朝方向被锁定，招架来自目标方向的攻击和攻击效果，持续%parry_duration%秒。如果有敌方英雄的攻击被招架，该英雄会被眩晕%parry_stun_duration%秒并获得印记，拥有印记的目标被凯攻击时必定会造成致命一击，并且被眩晕。子技能可以用于提前取消招架状态。", "b": 2}, {"id": "74d32233b1c3e95aecc8", "n": "哈斯卡·狂战士之血", "m": "healing", "mz": "治疗/回复", "c": "基础", "d": "有", "why": "没再提到", "t": "哈斯卡的伤痛赐予他力量，根据他损失的生命值将获得攻击速度、魔法抗性和生命恢复加成。生命恢复为力量的一定百分比。\n加成效果为线性增加，满血时没有加成，%hp_threshold_max%%%生命时达到最大加成。", "b": 1}, {"id": "b0a4627e5c2a0b438378", "n": "天穹守望者·磁场", "m": "ground_zone", "mz": "场地魔法", "c": "基础", "d": "有", "why": "新增", "t": "天穹守望者制造一个充满磁能的圆形扭曲力场。磁场提供攻击速度加成，并且其中的友方单位可以闪避来自磁场外的攻击。磁场可以牵引神符，并且自动激活其中的神符。", "b": 2}, {"id": "d85c04896ece384f0c0e", "n": "娜迦海妖·诱捕", "m": "pierces_debuff_immunity", "mz": "穿透减益免疫", "c": "A杖", "d": "有", "why": "新增", "t": "提升施法距离和弹道速度。诱捕可以对减益免疫单位施放并且生效。诱捕会施加破坏效果。\n打断目标的动作并将其困在原地，使其无法移动或闪烁。可以对海妖之歌作用下的单位施放。", "b": 2}, {"id": "529557c6d9a2bc86595e", "n": "谜团·事件视界", "m": "slow", "mz": "减速", "c": "基础", "d": "有", "why": "新增", "t": "%radius%范围内的单位远离谜团时会受到移速惩罚。", "b": 2}, {"id": "1c866937a6c6f42771d1", "n": "噬魂鬼·感染", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "没再提到", "t": "噬魂鬼进入目标单位的身体，无法被察觉，而且自身在体内时每秒恢复最大生命值的一定百分比。接着可以从宿主体内现身，对周围所有敌方单位造成伤害。如果被感染单位是敌方非英雄单位或中立生物，噬魂鬼可以控制其进行移动和攻击，而且该生物会持续失去最大生命值的一部分。无法对敌方英雄生效。\n\n驱散类型：弱驱散\n噬魂鬼在感染一个单位期间能够从周围死亡的单位身上获得经验。\n被感染控制的单位会获得感染的移动速度加成。\n不会触发法术反弹。\n感染可以对远古生物使用。", "b": 1}, {"id": "e02cdd2f329520dcbf3c", "n": "拉比克·技能窃取", "m": "spell_steal", "mz": "偷技能", "c": "基础", "d": "有", "why": "没再提到", "t": "拉比克钻研一个敌方英雄的魔法精华之痕，学习这个英雄最后释放的技能的秘密。拉比克将可以使用这个技能，维持几分钟或直到他死亡。\n无法窃取物品类技能。\n拉比克若拥有阿哈利姆魔晶，则窃取的技能会是魔晶升级版本。\n不会触发法术反弹。", "b": 1}, {"id": "4df70d261e212e3c8d40", "n": "死亡先知·吸魂巫术", "m": "fear", "mz": "恐惧", "c": "魔晶", "d": "有", "why": "改名", "t": "吸魂巫术的能量点数提升%shard_bonus_charges%点，敌人连续%shard_consecutive_siphon_duration%秒受到吸魂巫术作用后会被恐惧%shard_fear_duration%秒。\n创造一个灵魂连接，将死亡先知与一个敌方单位相连。每秒吸取生命值。\n多个连接不能同时作用于一个目标。", "b": 1}, {"id": "9c978b383b8f4e94862b", "n": "帕吉·肉钩", "m": "displace_other", "mz": "位移他人", "c": "基础", "d": "有", "why": "没再提到", "t": "向一个单位或方向射出血腥的肉钩。勾住第一个遭遇的单位，并将它拖到帕吉身边，如果是非远古单位会被秒杀，其他敌方单位则是受到伤害。\n钩中敌人后将打断持续施法类技能。\n肉钩能击中隐身单位。\n肉钩可以穿过树木、地形、建筑、远古生物和肉山。\n肉钩可以拖拽友方单位，不过他们不会受到伤害。\n肉钩可以将神符拖拽至帕吉身旁，并返还肉钩的魔法消耗。", "b": 1}, {"id": "711bb020b5797820cf77", "n": "拉比克·隔空取物", "m": "displace_other", "mz": "位移他人", "c": "基础", "d": "有", "why": "没再提到", "t": "拉比克利用他的隔空取物能力，将敌人短暂抬到空中，然后猛投向地面。被投下的单位会砸晕落地点附近的敌人。\n目标滞空时，拉比克可以使用次级技能将目标扔往目标方向。\n单位落地后，自身不会受到范围眩晕效果。", "b": 1}, {"id": "1009d78e31d3161c471e", "n": "术士·剧变", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "没再提到", "t": "持续施法 - 随施法时间增强的减速气流，还会造成伤害。持续最多%abilitychanneltime%秒。在魔法结束或目标离开生效区域后，敌人仍会被减速%duration%秒。\n减速效果的增加是根据持续施法的时长，而不是敌人在区内停留的持续时间。", "b": 1}, {"id": "326852734859220aa2d7", "n": "凤凰·超新星", "m": "respawn", "mz": "重生", "c": "基础", "d": "有", "why": "没再提到", "t": "凤凰十分乐意终结自己现在的生命来换取重生。将自己变为一颗燃烧的恒星，灼烧附近一大片区域内的敌人。恒星受到敌方英雄一定次数的攻击后将会被摧毁。经过%abilityduration%秒后恒星将会爆炸，眩晕周围所有敌人。而凤凰的生命和魔法值都会回到满状态，并且所有技能的冷却时间都会刷新。\n\n驱散类型：强驱散", "b": 1}, {"id": "0d948529bd5e3f3778c8", "n": "暗夜魔王·黑暗飞升", "m": "grant_vision", "mz": "提供视野", "c": "基础", "d": "有", "why": "新增", "t": "暗夜魔王遮住太阳，让夜晚立刻降临，使他的力量可以得到最大程度的发挥。在此期间暗夜魔王获得飞行能力和攻击力加成。拥有顺畅视野。", "b": 2}, {"id": "5ab4c5a4307a29813e48", "n": "戴泽·暗影波", "m": "healing", "mz": "治疗/回复", "c": "基础", "d": "有", "why": "没再提到", "t": "放出一道能量弧，可以瞬间跳跃至目标附近的队友，治疗的同时还将对附近的敌方单位造成伤害。施放暗影波时戴泽必定会享受到治疗效果。\n优先治疗友方英雄\n如果敌军附近有多个我方单位，那么他将受到多重暗影波的伤害。", "b": 1}, {"id": "80990c90f579b86d85ce", "n": "帕克·梦境缠绕", "m": "aoe_damage", "mz": "范围伤害", "c": "A杖", "d": "有", "why": "没再提到", "t": "梦境缠绕作用下的所有敌人都会被帕克攻击，攻击频率基于帕克攻击频率的%attack_rate_pct%%%。即使目标挣脱梦境，被眩晕时攻击也会继续。\n创造一个变化无常的的魔法梦境来困住敌方英雄，对他们造成伤害和束缚。如果被困住的敌方英雄试图挣脱缠绕走出梦境，将因为梦境破碎而受到眩晕和额外伤害。", "b": 1}, {"id": "75fdd950b6a6e1fefada", "n": "雷神之锤", "m": "pierce_evasion", "mz": "克敌机先", "c": "装备", "d": "有", "why": "新增", "t": "主动：静电冲击\n对目标单位施加一个静电护盾，持续12秒。护盾有20%几率对附近攻击护盾的目标及其周围%static_strikes%个敌方单位释放闪电冲击，造成225点魔法伤害。\n\n被动：连环闪电\n攻击有25%几率释放一道连环闪电，在650范围内12个目标之间跳跃，每次造成18     const v=verdicts.get(r.id);
    if(batch&&r.b!==1)return false;
    if(w&&r.why!==w)return false;
    if(m&&r.mz!==m)return false;
    if(s==="none"&&v)return false;
    if(s&&s!=="none"&&(!v||v.verdict!==s))return false;
    return true;
  });
}
function save(id,verdict,note){
  verdicts.set(id,{verdict,note});stats();
  if(!db){$("save").textContent="未连接，这次没有保存";return}
  pending++;$("save").textContent="保存中…";
  writing=writing.then(()=>db.doc("verdicts/"+id).set({verdict,note:note||"",at:new Date().toISOString()}))
    .then(()=>{pending--;if(!pending)$("save").textContent="已保存"})
    .catch(()=>{pending--;$("save").textContent="保存失败，刷新后再点一次"});
}
function card(r){
  const v=verdicts.get(r.id);
  const el=document.createElement("article");el.className="row";el.dataset.id=r.id;if(v)el.dataset.v=v.verdict;
  const claim=document.createElement("p");claim.className="claim";
  const say=document.createElement("span");say.className=r.d==="有"?"has":"not";say.textContent=r.d;
  claim.append(r.n+" ",say," "+r.mz);
  const meta=document.createElement("div");meta.className="meta";
  for(const t of [r.c,WHY_HELP[r.why]]){const s=document.createElement("span");s.textContent=t;meta.appendChild(s)}
  const text=document.createElement("p");text.className="text";text.textContent=r.t;
  const dfn=document.createElement("p");dfn.className="dfn";dfn.textContent=r.mz+"："+(DATA.defs[r.m]||"");
  const acts=document.createElement("div");acts.className="acts";
  const why=document.createElement("input");why.className="why";why.id="why-"+r.id;why.placeholder="为什么（选填）";why.setAttribute("aria-label","原因");why.value=v?v.note||"":"";why.hidden=!v||v.verdict==="ok";
  for(const [k,label] of [["ok","对"],["wrong","错"],["unsure","不确定"]]){
    const b=document.createElement("button");b.type="button";b.className="v";b.dataset.k=k;b.textContent=label;b.setAttribute("aria-pressed",v&&v.verdict===k?"true":"false");
    b.addEventListener("click",()=>{
      save(r.id,k,k==="ok"?"":why.value);
      el.dataset.v=k;acts.querySelectorAll(".v").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));
      why.hidden=k==="ok";if(k!=="ok")why.focus();
    });
    acts.appendChild(b);
  }
  why.addEventListener("change",()=>{const cur=verdicts.get(r.id);if(cur)save(r.id,cur.verdict,why.value)});
  acts.appendChild(why);
  el.append(claim,meta,text,dfn,acts);
  return el;
}
function render(){
  const list=filtered(),host=$("list");host.replaceChildren();
  if(!list.length){const e=document.createElement("p");e.className="empty";e.textContent="这个筛选下没有未看的了。";host.appendChild(e)}
  list.slice(0,shown).forEach(r=>host.appendChild(card(r)));
  $("more").hidden=list.length<=shown;
  const m=$("fmech").value,d=rows.find(r=>r.mz===m);
  $("def").hidden=!d;if(d)$("def").textContent=d.mz+"："+(DATA.defs[d.m]||"");
  stats();
}
for(const id of ["fbatch","fwhy","fmech","fstate"])$(id).addEventListener("change",()=>{shown=30;render()});
$("more").addEventListener("click",()=>{shown+=30;render()});
render();
(async()=>{
  const timer=setTimeout(()=>{if(!db)$("save").textContent="连不上保存服务，刷新试试"},10000);
  try{
    db=await claude.use("db");
    if(!db){clearTimeout(timer);$("save").textContent="这个视图不能保存，请登录后打开";return}
    let first=true;
    db.collection("verdicts").limit(1000).onSnapshot((snap)=>{
      clearTimeout(timer);
      snap.docs.forEach(d=>{const x=d.data();verdicts.set(d.id,{verdict:x.verdict,note:x.note||""})});
      if(!pending)$("save").textContent="已连接，自动保存";
      if(first){first=false;render()}else stats();
    },()=>{$("save").textContent="同步中断，刷新后继续"});
  }catch(e){clearTimeout(timer);$("save").textContent="连不上保存服务，刷新试试"}
})();
</script>
