id": "6edc90a0e0b8e5f3a970", "n": "祈求者·寒冰之墙", "m": "root", "mz": "缠绕", "c": "A杖", "d": "有", "why": "旧记录", "t": "寒冰之墙变成浮冰，以矢量为目标。经过短暂延迟后，浮冰出现再产生一道%wall_width%宽度的寒冰之墙。在浮冰内停留超过%root_delay%秒的敌方英雄会基于冰的等级被缠绕并受到魔法伤害。\n在祈求者前方创造一堵寒冰之墙，持续时间取决于冰元素的等级。冰霜之墙放射出的寒冰之气将对敌方单位造成减速和伤害，减速效果取决于冰元素的等级，每秒伤害取决于火元素的等级。", "b": 1}, {"id": "2ac9ca0236bbe19bab2b", "n": "百戏大王·奇观轮", "m": "slow", "mz": "减速", "c": "基础", "d": "有", "why": "旧记录", "t": "百戏大王推出奇观轮向目标地点滚去，击退沿途的敌人。到达目的地后，范围内的敌人会持续受到伤害，并且被减速%aura_slow%%%。敌方英雄面对转轮超过%face_duration%秒会被迷住，朝其走去。首个敌人着迷后会触发转轮爆炸的倒计时。如果没有触发倒计时，在%trap_duration%秒后转轮会自动爆炸。", "b": 2}, {"id": "da37c37f428e0f3117dc", "n": "破晓辰星·辰星破晓", "m": "grant_vision", "mz": "提供视野", "c": "基础", "d": "有", "why": "旧记录", "t": "只要太阳出来，破晓辰星就会获得基础攻击力加成和额外视野，加成效果会在整个白天内逐渐降低。如果是破晓辰星制造的白天，在整个白天时间内加成效果始终是最大值。", "b": 2}, {"id": "e41335f1acbbee27efc9", "n": "黑暗贤者·复制之墙", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "旧记录", "t": "制造一堵扭曲的光墙，对穿过的敌方英雄造成伤害和减速，并复制一个其自身的幻象，幻象由黑暗贤者控制，持续到光墙消失，或者被敌人消灭。\n幻象不会产生幻象。\n每堵光墙同一时间产生的为一名英雄产生的幻象只有一个。", "b": 2}, {"id": "93588d62c88ba4e9bd28", "n": "戴泽·暗影波", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "没再提到", "t": "放出一道能量弧，可以瞬间跳跃至目标附近的队友，治疗的同时还将对附近的敌方单位造成伤害。施放暗影波时戴泽必定会享受到治疗效果。\n优先治疗友方英雄\n如果敌军附近有多个我方单位，那么他将受到多重暗影波的伤害。", "b": 1}, {"id": "1cfcfd75dc2f11dba49d", "n": "灵匣", "m": "healing", "mz": "治疗/回复", "c": "装备", "d": "有", "why": "新增", "t": "被动：法术强化\n 下个对敌人施放的单体技能会单独对目标造成150点额外伤害，并且减缓30%移动速度，持续3秒。\n+6 全属性\n+5.5 生命恢复\n+2.25 魔法恢复", "b": 2}, {"id": "f946e51a457e25b4f6fb", "n": "森海飞霞·猎手旋镖", "m": "slow", "mz": "减速", "c": "魔晶", "d": "有", "why": "旧记录", "t": "掷出一把沿弧线飞行的回旋镖。击中后会飞回至森海飞霞。回旋镖对沿途击中的敌人都会造成伤害，并且施加一个负面效果，使受到作用的敌人被减速，承受的技能伤害增加。", "b": 2}, {"id": "236cf468dc79314096f1", "n": "水晶室女·冰晶克隆", "m": "aoe_damage", "mz": "范围伤害", "c": "魔晶", "d": "有", "why": "旧记录", "t": "向一个方向滑行，在原地制造一个自身的冰晶克隆，并且躲避多种飞行过程中的攻击和技能弹道。如果克隆受到了足量伤害，或者超过一定时间都会碎裂，对附近%frostbite_radius%范围内敌人施加冰封禁制。克隆体也可以被水晶室女自身的技能摧毁。", "b": 2}, {"id": "064c2df4794e53606548", "n": "噬魂鬼·狂暴", "m": "debuff_immunity", "mz": "减益免疫/技能免疫", "c": "基础", "d": "有", "why": "旧记录", "t": "进入狂暴状态，变成减益免疫，提升魔法抗性和移动速度。\n\n驱散类型：弱驱散", "b": 2}, {"id": "23a53150c71e67a36b54", "n": "巨牙海民·海象神拳！", "m": "critical", "mz": "暴击", "c": "基础", "d": "有", "why": "旧记录", "t": "巨牙海民为他强力的海象神拳做好准备，下一次攻击将会造成额外伤害并暴击，同时将目标打到半空中。\n海象神拳！拥有克敌机先效果。", "b": 2}, {"id": "5a568556350656bf59ea", "n": "力丸·绝杀秘技", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "旧记录", "t": "持续施法 - 力丸转移出现实位面，每隔一段时间从背后随机攻击附近的%interval_targets%个随机敌方单位。期间他的攻击伤害为固定值。", "b": 2}, {"id": "602ac0bb6b2f04f94822", "n": "否决坠饰", "m": "applies_basic_dispel", "mz": "施加弱驱散", "c": "装备", "d": "有", "why": "旧记录", "t": "主动：否决\n驱散目标身上的效果，并且施加负面效果，持续4秒。期间持续驱散和减速目标。\n\n驱散类型：弱驱散\n可以对无敌单位施放。\n+75 攻击力\n+10 护甲\n移动速度减缓：10%", "b": 2}, {"id": "9f44e615b03354cf8818", "n": "寒冬飞龙·碎裂冲击", "m": "slow", "mz": "减速", "c": "基础", "d": "有", "why": "旧记录", "t": "向一个单位发射一团易碎的冰球。冰球一击中目标就会碎裂，而目标单位将不会受到任何效果，但是附近%split_radius%基础范围内敌人都将因碎片的冲击受到伤害，并且移动速度减缓%movespeed_slow_tooltip%%%。\n主弹道的移动速度为%projectile_speed%。\n主弹道无法被躲避，而且不能以寒冬飞龙自身为目标。", "b": 2}, {"id": "e0564b0fa14e058f8a6d", "n": "破晓辰星·星破天惊", "m": "slow", "mz": "减速", "c": "魔晶", "d": "没有", "why": "旧记录", "t": "破晓辰星在星破天惊期间获得减益免疫，%immunity_resist%%%魔法抗性加成和自由移动状态。破晓辰星会被减速%shard_movement_penalty%%%，移速最低为%movement_speed%。\n破晓辰星将她的战锤旋转3次，对敌人造成攻击伤害以及额外伤害。最后一次打击时，她将战锤击向地面，对她前方的敌人造成眩晕和伤害。\n破晓辰星在技能持续时间内以%movement_speed%的移动速度行进，并且最后一击后需要%self_stun_duration%秒才能复原。\n连击期间无法施放上界重锤或天光现世。\n此技能不继承分裂效果。\n可以对自身施放来向前移动。\n前两次挥击会减少敌人%swipe_slow%%%移动速度，持续%sweep_stun_duration%秒。", "b": 2}, {"id": "2bc5543522fedce86df7", "n": "赏金猎人·忍术", "m": "economy", "mz": "经济经验", "c": "基础", "d": "有", "why": "旧记录", "t": "赏金猎人准备好他的下次攻击，造成额外伤害并窃取若干不可靠金钱。", "b": 2}, {"id": "db54913c31ee5e1dbb54", "n": "宙斯·弧形闪电", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "旧记录", "t": "释放一道会跳跃穿越附近敌人的闪电，并造成伤害。", "b": 2}, {"id": "af4e0503d8f6dd777c0d", "n": "恐怖利刃·暗黑团结", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "没有", "why": "旧记录", "t": "恐怖之刃控制的附近幻象拥有额外攻击伤害。\n倒影的幻象也会受到作用。", "b": 2}, {"id": "3d9a79f3f166a79aec0b", "n": "莱恩·下地狱再上来", "m": "spell_amp", "mz": "法术放大", "c": "基础", "d": "有", "why": "旧记录", "t": "击杀英雄或助攻会向莱恩提供%debuff_amp%%%负面效果持续时间，持续到该英雄复活。而莱恩复活时，他就会获得持续%duration%秒的%spell_amp%%%技能增强，直到他完成击杀或得到助攻。", "b": 2}, {"id": "969b1658ffd92912d610", "n": "炼金术士·化学狂暴", "m": "heal_reduction", "mz": "治疗削减", "c": "基础", "d": "没有", "why": "旧记录", "t": "炼金术士诱发他的食人魔同伴进入化学狂暴，降低攻击间隔，提高移动速度和生命恢复。\n\n驱散类型：弱驱散\n拥有%transformation_time%秒的变身时间，可以用来躲避攻击和技能弹道以及眩晕技能。", "b": 2}, {"id": "7209932b6ce2553164b4", "n": "昆卡·潮汐使者", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "旧记录", "t": "昆卡的传奇之剑使他的下一次攻击附加额外的攻击力并在前方造成大范围的分裂攻击伤害。", "b": 2}, {"id": "bea98af86cd7e0acd1a1", "n": "敌法师·法力损毁", "m": "attack_modifier", "mz": "攻击特效", "c": "基础", "d": "有", "why": "新增", "t": "每次攻击损毁目标魔法值，并造成相当于损毁魔法值一定百分比的伤害。\n幻象继承法力损毁的燃烧魔法为%illusion_percentage%%%。", "b": 2}, {"id": "5a0a26b2604031d87dc9", "n": "炼金术士·化学狂暴", "m": "healing", "mz": "治疗/回复", "c": "基础", "d": "有", "why": "旧记录", "t": "炼金术士诱发他的食人魔同伴进入化学狂暴，降低攻击间隔，提高移动速度和生命恢复。\n\n驱散类型：弱驱散\n拥有%transformation_time%秒的变身时间，可以用来躲避攻击和技能弹道以及眩晕技能。", "b": 2}, {"id": "1f9dbb3b130cc0b487a0", "n": "亚巴顿·无光之盾", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "没再提到", "t": "召唤黑暗能量环绕友方单位，驱散他们并创造一个全伤害护盾，护盾在消失前能吸收一定量的伤害。护盾消失或被摧毁后将会爆炸，对附近区域的单位造成伤害，伤害值为护盾的最大吸收量。\n\n驱散类型：强驱散\n不论护盾因持续时间结束或吸收足够伤害后被摧毁都将造成最大伤害。\n爆炸将不会对战争迷雾内单位造成伤害。", "b": 1}, {"id": "622e9f3c5e2aefd6abff", "n": "虚空假面·时间膨胀", "m": "slow", "mz": "减速", "c": "基础", "d": "有", "why": "旧记录", "t": "虚空假面将附近所有敌人困在一个时间膨胀场中，技能的冷却都会减慢。施加时每个受困的敌人都会获得一层时间膨胀的叠加效果，每有一个技能处于冷却就再获得一层。每层叠加效果造成每秒伤害，并降低移动速度和攻击速度降低。持续时间在时间结界作用下会暂停。\n不会影响物品的冷却时间。\n效果期间叠加层数还会改变。施放技能后如果技能进入冷却就会提供一层叠加效果。如果技能冷却在时间膨胀期间完成，效果会被移除。", "b": 2}, {"id": "822df48beccea4002c58", "n": "斯温·风暴之拳", "m": "self_mobility", "mz": "自身位移", "c": "A杖", "d": "有", "why": "新增", "t": "提升施法距离，并且对目标施加弱驱散效果。可以影响无敌目标。设为多样施法（右键点击技能栏图标）后，额外造成%scepter_bonus_damage%点伤害并且斯温会跟随风暴之拳行进。\n斯温用他充满魔力的手套对目标周围内所有敌人造成伤害和眩晕。", "b": 2}, {"id": "7db343899c55e82b12cc", "n": "统御头盔", "m": "summons", "mz": "召唤物", "c": "装备", "d": "有", "why": "旧记录", "t": "主动：支配\n控制一个中立单位，其移动速度变为380。被支配单位的最大生命值将不会少于1900点。另外还将使该单位+70点基础攻击力，+12点/秒生命恢复，+4点/秒魔法恢复，+7点护甲并且目标的部分技能等级提升1级。\n\n被支配单位的最大生命值大于1900点时将保留原来的最大生命值。施法者会获得被支配单位的原击杀金钱和经验。被支配单位的击杀奖励为固定250金，并且不会被秒杀非英雄单位的技能直接击杀。\n\n被支配单位受到来自敌方英雄或肉山的伤害后3秒内无法使用支配技能。\n也可以支配敌方线上小兵和召唤单位。\n出售会导致支配的单位死亡。\n+21 全属性\n+7 护甲\n+7 生命恢复", "b": 2}, {"id": "b1a6182bbe1a62ceee76", "n": "末日使者·阎刃", "m": "stun", "mz": "眩晕", "c": "基础", "d": "有", "why": "旧记录", "t": "末日挥舞他的炽烈之剑，将敌人点燃。造成%ministun_duration%秒眩晕，并施加一个燃烧效果，持续%burn_duration%秒，每秒造成伤害，数值为基础伤害+目标最大生命值的一定百分比。\n可以打断持续施法类技能。", "b": 2}, {"id": "672b88ad94e45948d458", "n": "斧王·战斗饥渴", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "没有", "why": "旧记录", "t": "激怒一个敌方单位，使他受到持续伤害，直到他杀死一个单位或者持续时间结束。敌人只要背朝斧王还将被减速。\n摧毁建筑也能移除该状态效果。", "b": 2}, {"id": "f45ad3319488a4abb809", "n": "卓尔游侠·冰川", "m": "channel_interrupt", "mz": "打断持续施法", "c": "魔晶", "d": "没有", "why": "旧记录", "t": "卓尔游侠在她脚下创造一片冰山，击退附近的敌人。站在山上的单位会获得飞行视野，而卓尔游侠和她的远程友军会获得攻击距离加成。卓尔游侠站在山上时攻击下方目标时获得额外伤害。山的前面会阻挡视野，并且除了卓尔游侠外无法穿行。施放时不会打断数箭齐发。", "b": 2}, {"id": "48999b36c724ab2bb92f", "n": "谜团·黑洞", "m": "displace_other", "mz": "位移他人", "c": "A杖", "d": "有", "why": "没再提到", "t": "黑洞额外造成等同于单位%scepter_pct_damage%%%最大生命值的每秒伤害，并且产生一个%scepter_radius%范围，没有打断效果的牵引效果。牵引速度为%scepter_drag_speed%。\n持续施法 - 召唤一个强引力漩涡吸住敌方单位。被黑洞影响的单位不能移动、攻击或施法。", "b": 1}, {"id": "2dfc57575035697ae792", "n": "邪影芳灵·暗影之境", "m": "magic_resist_reduction", "mz": "减魔抗/魔法易伤", "c": "基础", "d": "没有", "why": "旧记录", "t": "邪影芳灵遁入暗影之境，无法成为攻击或技能的目标。她的下次攻击具有%attack_range_bonus%额外攻击距离，并且造成额外魔法伤害，暗影之境技能也会随之结束。在暗影中时间越长，伤害越高。在暗影之境内的时间超过%max_damage_duration%秒将达到最高伤害。\n施法时能躲避弹道。\n获得相位移动状态。\n需要视野的技能无法作用于暗影之境中的邪影芳灵。", "b": 2}, {"id": "7244c38da0866ea322ed", "n": "裂魂人·巨力重击", "m": "stun", "mz": "眩晕", "c": "基础", "d": "有", "why": "旧记录", "t": "攻击时有一定概率眩晕并击退敌方单位。重击的伤害值为移动速度的一定百分比。\n不与碎颅锤叠加。\n破坏会使攻击触发巨力重击失效。暗影冲刺或幽冥一击还是会施加巨力重击。", "b": 2}, {"id": "4b1109490aa5d2e91ee7", "n": "灰烬之灵·残焰", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "旧记录", "t": "可以放出一个残焰，向目标地点冲去，速度为灰烬之灵移动速度的%speed_multiplier%%%。使用“激活残焰”技能后，灰烬之灵向所有残焰像冲去，将其摧毁并造成范围伤害，并移动至最近的残焰像。灰烬之灵最后会到达离目标地点最近的残焰像。\n学习后马上拥有3个残焰（上限数量）。", "b": 2}, {"id": "319104ce880233b9a74c", "n": "亚巴顿·魔霭诅咒", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "没有", "why": "旧记录", "t": "亚巴顿打击一个敌人，使其受到寒心诅咒的作用，被减速，并且持续受到伤害，同时所有攻击目标的单位将提升攻击速度。对建筑的持续伤害减少%tower_dps_pct%%%。", "b": 2}, {"id": "e2b34f9f825694de3f42", "n": "酒仙·壮胆酒", "m": "slow", "mz": "减速", "c": "基础", "d": "没有", "why": "旧记录", "t": "当酒仙的生命值低于%min_health_threshold%%%，他就会获得状态抗性加成，而且他的移动速度每%speed_toggle_time%秒都会在加速和减速之间改变。血量越低，效果越强，从0开始到%max_health_threshold%%%生命值时达到最大数值。", "b": 2}, {"id": "a51366eb8cb6bb8e78fe", "n": "谜团·黑洞", "m": "stun", "mz": "眩晕", "c": "基础", "d": "有", "why": "新增", "t": "持续施法 - 召唤一个强引力漩涡吸住敌方单位。被黑洞影响的单位不能移动、攻击或施法。", "b": 2}, {"id": "c7f8cc5b888423577241", "n": "美杜莎·罗网箭阵", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "旧记录", "t": "美杜莎沿着一条直线射出%volley_count%组箭矢，每组的作用范围递增。齐射的箭矢击中的敌人会受到初始爆发伤害，然后被缠绕且无法转身，并对敌人可见，同时受到每秒伤害。", "b": 2}, {"id": "76f7206db3ea126d2f0d", "n": "瘟疫法师·死亡搜寻", "m": "aoe_damage", "mz": "范围伤害", "c": "魔晶", "d": "有", "why": "新增", "t": "瘟疫法师变成一个大死亡脉冲，向目标单位的地点移动。到达该地点后，死亡脉冲会扩散至附近敌人和友军。\n不会触发法术反弹。", "b": 2}, {"id": "e8dd0bb262f85640e62a", "n": "伐木机·活性护甲", "m": "damage_block", "mz": "护盾/伤害吸收/减伤", "c": "A杖", "d": "有", "why": "旧记录", "t": "活性护甲可以主动施放，获得最大叠加次数和%initial_shield%点生命的护盾。护盾的恢复速度为每秒%shield_per_sec% + 伐木机%radius%范围内每名敌方英雄都会增加%shield_per_sec_per_enemy%，最高为%max_shield%。%duration%秒后伐木机会对%explosion_radius%范围内每个英雄造成伤害，数值为%base_explosion% + 护盾剩余生命，而且失去全部护盾。\n伐木机每受到一次物理攻击，他的生命恢复和护甲值都会提升。英雄攻击提供%stacks_per_hero_attack%倍提升。\n破坏会使技能无法获得新的叠加效果。\n破坏不会使现有叠加效果提供的加成失效。", "b": 2}, {"id": "17f0da49c90af6c78470", "n": "天穹守望者·闪光幽魂", "m": "slow", "mz": "减速", "c": "基础", "d": "有", "why": "旧记录", "t": "召唤一个缓慢实体化的闪光怨灵萦绕在目标区域，直到有敌人进入范围。一旦有敌方单位进入范围，怨灵将贴近敌人自我熔化，造成魔法伤害并使目标减速。\n闪光幽魂无法被躲避。", "b": 2}, {"id": "f757a8e3236285a62850", "n": "不朽尸王·墓碑", "m": "attack_modifier", "mz": "攻击特效", "c": "基础", "d": "有", "why": "新增", "t": "在目标位置召唤一座墓碑。墓碑会不断在其附近的每个敌方单位身边产生僵尸攻击他们。僵尸拥有死亡渴望技能，使他们的攻击带有减速效果，并且若目标的生命值低于一定百分比，僵尸的攻击和移动速度会提升。\n墓碑免疫技能，但是可以被噬魂治疗。\n僵尸和墓碑均免疫技能。\n如果初始目标死亡或丢失视野，僵尸将会死亡。", "b": 2}, {"id": "ade7dda28a010617d43b", "n": "熊战士·超强力量", "m": "slow_resistance", "mz": "减速抗性", "c": "基础", "d": "有", "why": "旧记录", "t": "乌尔萨在战斗中运用他的技艺，提升了接下来几次攻击的攻击速度，同时还获得了减速抗性。\n攻击丢失还是会消耗超强力量的攻击次数。", "b": 2}, {"id": "7a418d412c8501b6e558", "n": "獸·突", "m": "self_mobility", "mz": "自身位移", "c": "基础", "d": "有", "why": "新增", "t": "獸积蓄力量再向选定方向冲去，将敌人和队友同时击退。敌方单位被撞时受到伤害，并且被眩晕。蓄力时间越长，獸冲的距离越远。\n\n可以随时使用停止指令来中止。", "b": 2}, {"id": "112b92954da85e641dab", "n": "马格纳斯·两极反转", "m": "stun", "mz": "眩晕", "c": "基础", "d": "有", "why": "旧记录", "t": "马格纳斯改变物质的属性，将附近的敌人拖拽至他的前方，并且以震击对他们造成伤害和眩晕。", "b": 2}, {"id": "a07482a65fd483dd708d", "n": "凯·天隼冲击", "m": "self_mobility", "mz": "自身位移", "c": "基础", "d": "有", "why": "新增", "t": "开启后凯可以向敌方目标冲去，发动的攻击会重复一次。在这个状态下，凯拥有相位移动状态和减速抗性。\n不会对建筑生效。", "b": 2}, {"id": "a31403c55af1bc123ffa", "n": "祈求者·阳炎冲击", "m": "grant_vision", "mz": "提供视野", "c": "基础", "d": "有", "why": "旧记录", "t": "向目标区域释放毁灭性的阳炎之光能量，一旦能量着陆，将对区域内的敌人进行灼烧。伤害取决于火元素等级，区域内敌人将平摊所有伤害。\n施放后立即获得目标区域的视野。\n祈求者使用阳炎冲击击杀英雄后，即使不在经验范围内也能获得经验。", "b": 2}, {"id": "b4c005e7304b5528589f", "n": "全能骑士·纯洁之锤", "m": "slow", "mz": "减速", "c": "基础", "d": "有", "why": "旧记录", "t": "全能骑士将神圣之力注入他的战锤，使他的攻击距离提升，会根据基础攻击力的一定百分比造成纯粹伤害，并且使目标短时间内被减速。全能骑士会在%heal_duration%秒内回复%heal_pct%%%造成的伤害。", "b": 2}, {"id": "a9c53cecb1b3d34f1ee2", "n": "森海飞霞·野地奇袭", "m": "reduce_vision", "mz": "减视野", "c": "基础", "d": "有", "why": "新增", "t": "扔出一张网，对区域内靠近树木的敌人造成眩晕。敌人会持续受到伤害并被拖拽到目标区域内最近的树上，并且眩晕期间视野降低至0。\n若树木被摧毁，被影响的单位将解除眩晕。\n野地奇袭不会击中隐身单位。", "b": 1}, {"id": "f94019cd16df7c81cbe2", "n": "沉默术士·奥术诅咒", "m": "silence", "mz": "沉默", "c": "基础", "d": "没有", "why": "旧记录", "t": "诅咒目标区域，造成伤害并使敌人持续受到伤害，并且移动速度被减缓。期间受到作用的英雄一旦施放魔法，持续时间就会延长。目标被沉默时不计入负面效果的持续时间。\n非英雄单位也会受到作用。", "b": 2}, {"id": "bbc3220c6c9f4284bc80", "n": "恐怖利刃·魂断", "m": "hp_removal" 70399e17", "n": "上古巨神·灵体游魂", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "新增", "t": "上古巨神放出他的灵体游魂，灵魂对任何经过的单位都会造成伤害。当它与巨神合体时，它每伤害过一个单位都会给予若干攻击力和移动速度加成。\n\n灵体游魂拥有回音重踏，回归和自然秩序三个技能。", "b": 2}, {"id": "eda9aa57612e5c7fc100", "n": "狼人·变身", "m": "slow_resistance", "mz": "减速抗性", "c": "基础", "d": "有", "why": "新增", "t": "狼人展现出他的凶狼形态，获得致命一击的能力，并且提升夜间视野。在变身期间，狼人达到超高移动速度，并且不能被减速。移动速度和致命一击也会施加给狼人控制下的所有单位。\n狼人的移动速度不会受到妖术的影响。", "b": 2}, {"id": "92adbe3c9eb4618d6aff", "n": "变体精灵·波浪形态", "m": "self_mobility", "mz": "自身位移", "c": "基础", "d": "有", "why": "新增", "t": "变体精灵化为波浪向前涌进，对路径上的敌人造成伤害。变体精灵在波浪形态中是无敌的。", "b": 2}, {"id": "1ca11a22d90d2758aff0", "n": "复仇之魂·移形换位", "m": "damage_block", "mz": "护盾/伤害吸收/减伤", "c": "基础", "d": "有", "why": "旧记录", "t": "与一个目标英雄瞬间交换位置，不论敌我。移形换位会打断目标的持续施法。敌方英雄被交换后受到伤害。复仇之魂和被交换的友方英雄都会获得等同于造成伤害的护盾。\n对减益免疫单位有效。\n技能施放后复仇之魂和目标附近的树木将会被摧毁。\n移形换位能够打断持续施法。", "b": 2}, {"id": "557ed772cdad7d88124f", "n": "拉席克·撕裂大地", "m": "stun", "mz": "眩晕", "c": "基础", "d": "有", "why": "旧记录", "t": "撕裂敌人脚下的大地。造成伤害和短暂的眩晕。\n撕裂大地将摧毁作用范围内的树木。\n技能经过%delay%秒延迟后生效。", "b": 2}, {"id": "4fd2ff80a0251b557236", "n": "天穹守望者·乱流", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "没有", "why": "旧记录", "t": "将不稳定的涡流能量灌注到落单敌人体内，造成持续伤害并减缓其移动速度。如目标周围有其他敌方单位 ，则不会造成伤害。", "b": 2}, {"id": "d7448146e84a44481f51", "n": "玛尔斯·热血竞技场", "m": "mana_gain", "mz": "自身回蓝/吸蓝", "c": "A杖", "d": "有", "why": "新增", "t": "冷却时间降低%bonus_AbilityCooldown%秒，持续时间提升。如果敌人在竞技场内阵亡，玛尔斯和竞技场内所有友军都会回复%arena_kill_buff_heal_pct%%%最大生命和魔法，并且获得%arena_kill_buff_damage_pct%%%攻击力加成，持续%arena_kill_buff_duration%秒。这个效果可以叠加。\n经过短暂的列队时间，玛尔斯召唤出环绕着战士的竞技场，战士们将阻挡敌人的攻击和动向。竞技场内的敌方英雄靠近边缘时将被战矛攻击，受到伤害并被击退。", "b": 2}, {"id": "38354199fc851d41089f", "n": "凤凰·烈火精灵", "m": "reveal", "mz": "显形", "c": "基础", "d": "没有", "why": "旧记录", "t": "召唤4只围绕凤凰飞行的烈火精灵。每一只烈火精灵都能被单独发射到指定区域。对敌人持续造成伤害并大幅降低他们的攻击速度。\n烈火精灵现在到达目标区域后将获得1秒的视野。", "b": 2}, {"id": "1b65bc672d041be604e3", "n": "自然先知·自然之怒", "m": "root", "mz": "缠绕", "c": "A杖", "d": "有", "why": "旧记录", "t": "缠绕所有击中的敌人。持续时间根据弹跳次序从%scepter_min_entangle_duration%秒开始增加，弹跳数达到上限时为%scepter_max_entangle_duration%秒。\n伤害性的能量在全地图跳跃，打击视野中的敌人，会先从距目标点最近的敌人开始打击。每击中一个敌人伤害都会增加，击中%max_targets%个目标后达到最高伤害。\n自然的愤怒只能伤害视野内的单位。\n可以通过点击小地图施放；初始目标将选择施放地点最近的有效单位。", "b": 2}, {"id": "028003e9afb1026cd94f", "n": "疯狂面具", "m": "armor_reduction", "mz": "减护甲", "c": "装备", "d": "没有", "why": "旧记录", "t": "主动：狂热\n攻击速度提升100，移动速度提升6%/12%（远程/近战），减速抗性提升15%/30%（远程/近战），但是护甲降低7点，并且被沉默。持续6秒。\n\n被动：吸血\n攻击者每次攻击都将根据造成伤害的一定百分比回复生命值。\n+20 攻击力\n+22% 吸血", "b": 2}, {"id": "e72b3fe5b532326496c1", "n": "军团指挥官·决斗", "m": "silence", "mz": "沉默", "c": "基础", "d": "有", "why": "新增", "t": "军团指挥官强制与目标敌方英雄进行决斗，持续短暂的数秒。决斗开始后双方英雄不能使用任何物品，而目标敌方英雄不能使用技能。如果有英雄在决斗期间死亡，赢得决斗的英雄将永久获得攻击力加成。\n如果双方距离超过2000，决斗也会结束。", "b": 2}, {"id": "368a6999a75f15a5e69e", "n": "赏金猎人·暗影步", "m": "attack_modifier", "mz": "攻击特效", "c": "基础", "d": "有", "why": "新增", "t": "赏金猎人进入隐身，获得移动速度加成，并能够穿越其它单位，直到他攻击或使用技能。破隐一击会短暂眩晕目标。\n开启后不会打断大多数持续施法技能。", "b": 2}, {"id": "70634c502e91cb79d11e", "n": "马格纳斯·巨角冲撞", "m": "displace_other", "mz": "位移他人", "c": "基础", "d": "有", "why": "新增", "t": "马格纳斯向前冲刺，用他巨大的犀角将敌人挑起。被击中的英雄将被拽至终点，然后受到伤害并且移动速度被减缓。根据行进的距离伤害也会提升。\n马格纳斯受到眩晕、妖术或放逐作用时，巨角冲撞都会被打断。", "b": 2}, {"id": "e941c7366892afd5896e", "n": "凤凰·凤凰冲击", "m": "slow", "mz": "减速", "c": "基础", "d": "有", "why": "旧记录", "t": "凤凰向目标方向进行圆弧状飞行，飞行距离固定，对沿途的敌人造成持续伤害并减缓其移动速度，然后返回初始位置。飞行过程中如果施放超新星将停止飞行。\n凤凰冲击的飞行时间为%dive_duration%秒，可以在飞行途中再次施放来终止飞行。", "b": 2}, {"id": "77e26d02503624f83a9b", "n": "谜团·黑洞", "m": "displace_other", "mz": "位移他人", "c": "基础", "d": "有", "why": "没再提到", "t": "持续施法 - 召唤一个强引力漩涡吸住敌方单位。被黑洞影响的单位不能移动、攻击或施法。", "b": 1}, {"id": "3be63af971cd7f283cd0", "n": "巫妖·阴邪凝视", "m": "mana_gain", "mz": "自身回蓝/吸蓝", "c": "基础", "d": "有", "why": "旧记录", "t": "持续施法 - 使一个敌方单位着魔，缓慢走到巫妖与其之间的一点，并吸取其当前魔法值的一定百分比。", "b": 2}, {"id": "0f5b76772ebaa06bafb1", "n": "杰奇洛·液态火", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "旧记录", "t": "杰奇洛的火焰燃烧效果范围内的敌人，并降低他们的攻击速度。和液态冰共用冷却时间。\n对单位和建筑都有效。", "b": 2}, {"id": "0a1d9e739b5428d0129b", "n": "幻影长矛手·神行百变", "m": "projectile_dodge", "mz": "躲避弹道", "c": "基础", "d": "有", "why": "旧记录", "t": "幻影长矛手暂时从战场上消失。经过%delay%秒，幻影长矛手和附近的所有幻象都会出现在目标地点的随机位置，并产生两个新的幻象。施放技能后延长所有幻象的持续时间。新加的两个幻象拥有不同的特性：一个承受正常百分比的伤害，不具有攻击力，另一个额外承受%illusion_2_damage_in_pct%%%伤害，继承的攻击力相比本体减少%illusion_2_damage_out_pct%%%。\n\n驱散类型：弱驱散\n这个技能可以躲避攻击和技能弹道，并且驱散负面效果。\n重新现身的单位附近的树木将会被摧毁。\n幻影长矛手和他的队友可以分辨出哪个幻象承受100%伤害。", "b": 2}, {"id": "0f3db6c724b33b77147c", "n": "殁境神蚀者·精华变迁", "m": "mana_gain", "mz": "自身回蓝/吸蓝", "c": "基础", "d": "有", "why": "旧记录", "t": "被动拥有一定几率在施放技能时回复最大魔法值的一定百分比。通过攻击特效的技能回复的魔法会减少。", "b": 2}, {"id": "251962ffb0fcb302cfae", "n": "斧王·狂战士之吼", "m": "taunt", "mz": "嘲讽", "c": "基础", "d": "有", "why": "改名", "t": "斧王嘲讽附近的敌方单位，强迫他们攻击自己，同时获得额外护甲。", "b": 1}, {"id": "a9ef42851d7930538846", "n": "哈斯卡·牺牲", "m": "applies_basic_dispel", "mz": "施加弱驱散", "c": "基础", "d": "有", "why": "旧记录", "t": "哈斯卡牺牲自己的生命来摧毁敌人的生命，他跃向一个目标，造成目标当前生命值一定百分比的伤害，并且降低目标的移动和攻击速度。哈斯卡在跳跃过程中为减益免疫，并且魔法抗性提升%immunity_resist%%%。\n\n驱散类型：弱驱散\n如果哈斯卡在跳跃时受到控制技能，或目标在0.015秒内移动1400码以上，跳跃就会停止。\n减速效果无视减益免疫。\n牺牲无法被躲避。", "b": 2}, {"id": "a3548ad076500c156f57", "n": "米波·地卜术", "m": "slow", "mz": "减速", "c": "基础", "d": "有", "why": "旧记录", "t": "米波会根据所在地形给予自身和克隆体可叠加的加成效果。每个米波都会给予其他米波自身的加成。如果%tree_radius%范围内有树木，他会获得%tree_regen%点/秒生命恢复。如果他站在土地上，他会获得%dirt_move_speed%%%移动速度加成。如果他在水中，他的攻击会减缓目标%water_move_slow%%%移速，持续%water_slow_duration%秒。\n土地包括所有水之外的地形。", "b": 2}, {"id": "fb0865004d4f4f502d27", "n": "发条技师·照明火箭", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "旧记录", "t": "向全地图范围内的指定区域发射照明弹。击中时对区域内敌人造成伤害和短暂减速。照明火箭提供%duration%秒击中区域的视野。", "b": 2}, {"id": "f58b3bd05e7df5b6c9ec", "n": "斯拉达·鱼人碎击", "m": "slow", "mz": "减速", "c": "基础", "d": "有", "why": "旧记录", "t": "猛击地面，留下一片水洼，对附近敌方单位造成伤害并眩晕。眩晕结束后还会受到减速。", "b": 2}, {"id": "efcb5478e03f597f41d2", "n": "影魔·魂之挽歌", "m": "fear", "mz": "恐惧", "c": "基础", "d": "有", "why": "改名", "t": "影魔将捕获的灵魂中最多%max_soul_release%个进行聚集，以多道魔能的形式释放。若距离影魔过近将受到数道魔能的伤害。每道魔能对敌方单位造成伤害的同时，还将造成恐惧和减速效果，并且降低魔法抗性，持续%requiem_slow_duration%秒，最高可达%requiem_slow_duration_max%秒。通过支配死灵收集的每个灵魂会为魂之挽歌创造一道魔能。死亡时会自动释放魂之挽歌，不占用主动大招的冷却时间。\n影魔收集的灵魂中，每%requiem_soul_conversion%个会产生一道伤害波。\n死亡时释放的魂之挽歌不会施加恐惧和减速效果。", "b": 1}, {"id": "ab5b209ac719e013b1ae", "n": "冥界亚龙·幽冥剧毒", "m": "attack_slow", "mz": "减攻速", "c": "基础", "d": "有", "why": "旧记录", "t": "蝮蛇向目标区域释放幽冥剧毒。范围内的单位持续受到伤害，在区域内停留的时间越长，受到的伤害也越高。同时他们的攻击速度会被降低。\n多个幽冥剧毒不会叠加。", "b": 2}, {"id": "8ca180de83222963106a", "n": "编织者·时光倒流", "m": "economy", "mz": "经济经验", "c": "基础", "d": "没有", "why": "旧记录", "t": "编织者回到五秒前的时间点，获得当时的生命值和魔法值。不影响冷却时间、金钱和经验。\n\n驱散类型：强驱散\n能够移除编织者身上大部分的负面状态。\n时光倒流可以躲避攻击和技能弹道。", "b": 2}, {"id": "7be6c64a06c50374ff9f", "n": "坚韧球", "m": "healing", "mz": "治疗/回复", "c": "装备", "d": "有", "why": "新增", "t": "+5.5 生命恢复\n+2.25 魔法恢复", "b": 2}, {"id": "8e4ff5bd78ad408998b6", "n": "圣堂刺客·灵能陷阱", "m": "silence", "mz": "沉默", "c": "A杖", "d": "有", "why": "旧记录", "t": "现在陷阱引爆后还会沉默受到作用的敌人。\n圣堂刺客放下一个隐形的神秘陷阱监视敌人的动向。引爆后将减缓%trap_radius%范围内敌人的移动速度，陷阱放置时间越久，引爆后减速效果越强，最低为%movement_speed_min%%%，放置%trap_max_charge_duration%秒后引爆将达到最大减速效果，为%movement_speed_max%%%，并且还能造成额外伤害。\n陷阱没有时间限制。\n他们拥有隐形效果，渐隐时间为%trap_fade_time%秒，还拥有技能免疫状态。他们可以承受2次远程英雄的攻击，1次近战英雄的攻击，或4次非英雄单位的攻击。\n陷阱的视野是250/250，不能阻止中立生物刷新。", "b": 2}, {"id": "8592dfaf0f2daf1eb252", "n": "白银之锋", "m": "slow", "mz": "减速", "c": "装备", "d": "有", "why": "新增", "t": "主动：疾影步\n进入隐身直到17秒持续时间结束、或者在此之前攻击或施法。隐身时，移动速度将提升20%，而且可以穿越单位。\n\n破隐一击将额外造成300点物理伤害，同时5秒内目标的被动技能无效，移动速度不会超过200。\n+70 攻击力\n+35 攻击速度", "b": 2}, {"id": "a8b3398d674f85d05059", "n": "术士·混乱之祭", "m": "summons", "mz": "召唤物", "c": "基础", "d": "有", "why": "旧记录", "t": "从深渊召唤一个地狱火，眩晕敌人%stun_duration%秒。地狱火持续%golem_duration%秒，能够减免部分技能的伤害，具有较高的减速抗性，拥有永久献祭和烈焰之拳技能。\n该技能将摧毁作用范围内的树木。", "b": 2}, {"id": "880322897d3d0ac21455", "n": "龙骑士·火焰气息", "m": "damage_block", "mz": "护盾/伤害吸收/减伤", "c": "基础", "d": "没有", "why": "旧记录", "t": "向龙骑士的前方喷射出一团火焰，烧灼碰到的敌人，并使其攻击力降低。\n不会触发法术抵抗或法术反弹。", "b": 2}, {"id": "56932cedea150bcd81cd", "n": "戴泽·剧毒之触", "m": "spell_block", "mz": "格挡指向技能", "c": "基础", "d": "没有", "why": "旧记录", "t": "施放一股锥形的毒素，可以打击多个敌方单位 2}, {"id": "339dfb41fd303041979f", "n": "混沌骑士·实相裂隙", "m": "displace_other", "mz": "位移他人", "c": "基础", "d": "有", "why": "新增", "t": "将混沌骑士及混沌骑士的幻象和目标单位传送到混沌骑士与目标连线上的一点。降低敌方单位的护甲，持续%duration%秒。\n目标单位将会强制面向混沌骑士，而且混沌骑士和幻象默认对目标发动攻击。", "b": 2}, {"id": "17f8cbaa898ff29e9d3c", "n": "龙骑士·古龙形态", "m": "debuff_immunity", "mz": "减益免疫/技能免疫", "c": "基础", "d": "没有", "why": "旧记录", "t": "龙骑士化身为古龙，提升了技能的施法距离，获得移动速度加成，和拥有各种特性的远程攻击。古龙每级都会进化。加成效果会累加。1级碧龙：攻击获得持续的腐蚀伤害，也能作用于建筑。2级赤龙：攻击获得溅射伤害。3级苍龙：攻击获得无视减益免疫的移动速度和攻击速度降低效果。", "b": 2}, {"id": "a79eb05563dea309b11a", "n": "幽鬼·折射", "m": "spell_reflect", "mz": "反弹指向技能", "c": "基础", "d": "没有", "why": "旧记录", "t": "幽灵会分散对她造成的部分伤害，将其反弹给附近的所有敌人。敌人离她越远，受到的伤害越低。\n幽鬼本身不承受被折射的伤害。\n幻象并不继承此技能。\n伤害在减免前折射，并且折射的伤害与原伤害类型相同。\n这个技能造成的伤害被视为反弹伤害。反弹伤害不提供任何吸血，而且无法反弹。", "b": 2}, {"id": "d4755604a5d963a4631f", "n": "幻影长矛手·并列", "m": "attack_modifier", "mz": "攻击特效", "c": "基础", "d": "有", "why": "新增", "t": "幻影长矛手的攻击有一定几率使自己的存在破碎，产生自身的幻象。幻象也有几率进一步破碎，再产生幻象。幻影长矛手产生的幻象持续%illusion_duration%秒，幻象产生的幻象则持续%illusion_from_illusion_duration%秒。", "b": 2}, {"id": "52bba999160653f7acc3", "n": "凤凰·超新星", "m": "applies_strong_dispel", "mz": "施加强驱散", "c": "基础", "d": "有", "why": "旧记录", "t": "凤凰十分乐意终结自己现在的生命来换取重生。将自己变为一颗燃烧的恒星，灼烧附近一大片区域内的敌人。恒星受到敌方英雄一定次数的攻击后将会被摧毁。经过%abilityduration%秒后恒星将会爆炸，眩晕周围所有敌人。而凤凰的生命和魔法值都会回到满状态，并且所有技能的冷却时间都会刷新。\n\n驱散类型：强驱散", "b": 2}, {"id": "639879832df6739d56a6", "n": "司夜刺客·复仇", "m": "attack_modifier", "mz": "攻击特效", "c": "基础", "d": "有", "why": "新增", "t": "司夜刺客进入隐身状态并获得移动速度加成。如果司夜刺客以攻击打破隐身，当次攻击将造成超高额外伤害，并对目标施加破坏效果。司夜刺客当次攻击具有%attack_range_bonus%额外攻击距离，并且攻击动作加快%attack_animation_bonus%%%。\n如果在隐身期间使用了技能，或者隐身时间结束，额外伤害的效果将会消失。\n会在造成额外伤害前施加破坏效果。", "b": 2}, {"id": "05abd37649855ddc82bd", "n": "美杜莎·魔法盾", "m": "armor_reduction", "mz": "减护甲", "c": "基础", "d": "没有", "why": "旧记录", "t": "创造一个魔法护盾，消耗美杜莎的魔法值以吸收%absorption_pct%%%的伤害。幻象的伤害吸收系数减少%illusion_percentage%%%。\n伤害的吸收先于任何伤害减免机制，所以提高物理护甲，物理格挡和魔法抗性都不能减少吸收相同伤害所需的魔法。", "b": 2}, {"id": "350ebdc6d7872a5954f2", "n": "拉席克·恶魔敕令", "m": "ground_zone", "mz": "场地魔法", "c": "基础", "d": "有", "why": "新增", "t": "使拉席克周围的区域充满魔法性爆炸，对敌方单位和建筑造成纯粹伤害。范围内的敌人越少，他们受到的伤害就越高。\n即使拉席克死亡，爆炸还是会在原地继续。", "b": 2}, {"id": "46d6be597712f52ef44f", "n": "回城卷轴", "m": "root", "mz": "缠绕", "c": "装备", "d": "没有", "why": "旧记录", "t": "使用：传送\n经过3秒持续施法后传送到指定的友方建筑。\n\n双击将直接传送至己方泉水。\n如果多名英雄在短时间内接连传送至相同地点，那么后续英雄的传送时间都会相应地有所延长。\n传送可以被缠绕类技能阻止或取消。", "b": 2}, {"id": "0290de4f95b152c0c7aa", "n": "齐天大圣·猴子猴孙", "m": "invisibility", "mz": "隐身", "c": "A杖", "d": "没有", "why": "旧记录", "t": "每隔一段时间在齐天大圣附近产生一个猴子猴孙。隐身或上树时不会产生。只有齐天大圣在附近时猴子猴孙才会攻击建筑。猴子猴孙现在独立获得如意棒法的效果。\n齐天大圣变出圆形的猴子猴孙阵列，猴子猴孙从他的位置散开。若齐天大圣离开范围，猴子猴孙将会消失。猴子猴孙继承齐天大圣的攻击力，攻击频率为固定的%attack_speed%秒，并且只会以敌方英雄为目标。在技能持续时间内齐天大圣获得护甲加成。齐天大圣可以在猴子猴孙期间变成其中一个猴子猴孙，短时间内取代其位置，无法和其他猴子猴孙相区分，并且在原地留下一个猴子猴孙。\n猴子猴孙不会获得如意棒法的加成效果。\n猴子猴孙不会继承碎颅锤和深渊之刃的效果。", "b": 2}, {"id": "954d1fce2229d13f2559", "n": "暗夜魔王·黑暗飞升", "m": "terrain_walk", "mz": "无视地形", "c": "基础", "d": "有", "why": "旧记录", "t": "暗夜魔王遮住太阳，让夜晚立刻降临，使他的力量可以得到最大程度的发挥。在此期间暗夜魔王获得飞行能力和攻击力加成。拥有顺畅视野。", "b": 2}, {"id": "8b7984865d5c9dadaf08", "n": "马格纳斯·巨角冲撞", "m": "slow", "mz": "减速", "c": "基础", "d": "有", "why": "旧记录", "t": "马格纳斯向前冲刺，用他巨大的犀角将敌人挑起。被击中的英雄将被拽至终点，然后受到伤害并且移动速度被减缓。根据行进的距离伤害也会提升。\n马格纳斯受到眩晕、妖术或放逐作用时，巨角冲撞都会被打断。", "b": 2}, {"id": "07bdfc28ef162b76ea00", "n": "魔棒", "m": "mana_gain", "mz": "自身回蓝/吸蓝", "c": "装备", "d": "有", "why": "旧记录", "t": "主动：充能\n立刻根据能量点数回复相应的生命和魔法，每点能量恢复15点生命和魔法。\n\n每当附近1200范围内有可见敌人施放技能都会自动充能（最多10点能量）。\n1200范围内的可见敌人使用技能后就会获得点数。\n部分英雄技能和物品技能的施放将不会增加点数。", "b": 2}, {"id": "1f274ab2ce75e6a893f8", "n": "哈斯卡·沸血之矛", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "没有", "why": "旧记录", "t": "哈斯卡将其长矛点燃，在普通攻击的同时对敌方单位造成持续伤害。多次攻击会造成持续伤害叠加。每次攻击都将牺牲哈斯卡部分生命值。\n沸血之矛在多次施放到目标身上效果可以叠加。没有叠加上限。\n哈斯卡不能使用此技能自杀。\n炙矛可热不会对肉山造成额外的最大生命值烧灼伤害。", "b": 2}, {"id": "c73bb4849a56382bf79a", "n": "帕吉·肉钩", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "没有", "why": "旧记录", "t": "向一个单位或方向射出血腥的肉钩。勾住第一个遭遇的单位，并将它拖到帕吉身边，如果是非远古单位会被秒杀，其他敌方单位则是受到伤害。\n钩中敌人后将打断持续施法类技能。\n肉钩能击中隐身单位。\n肉钩可以穿过树木、地形、建筑、远古生物和肉山。\n肉钩可以拖拽友方单位，不过他们不会受到伤害。\n肉钩可以将神符拖拽至帕吉身旁，并返还肉钩的魔法消耗。", "b": 2}, {"id": "302c331c1d2530339605", "n": "宽容之靴", "m": "slow_resistance", "mz": "减速抗性", "c": "装备", "d": "有", "why": "新增", "t": "主动：坚韧\n为周围友军提供+50攻速加成和+15%移动速度加成，持续6秒。而且最初1.5秒友军不受减速效果影响。\n\n作用范围：1200\n\n被动：迅捷光环\n为周围友军提供15移动速度和2.5点/秒生命恢复。\n\n作用范围：1200\n多个鞋类物品提供的移动速度加成不叠加。\n+8 力量\n+65 移动速度\n+18 生命恢复", "b": 2}, {"id": "da8c26a229a977041c99", "n": "绝刃", "m": "applies_break", "mz": "施加破坏", "c": "装备", "d": "有", "why": "新增", "t": "被动：法术强化\n下个对敌人施放的单体技能会单独对目标造成250点额外伤害，禁用其被动技能，并且减缓30%移动速度，持续4秒。\n减速的负面效果可以被驱散。\n破坏的负面效果不能被驱散。\n+450 生命值\n+450 魔法值\n+8 全属性\n+7 生命恢复\n+3 魔法恢复", "b": 1}, {"id": "1fa7258242058b0cba2c", "n": "赏金猎人·暗影情谊", "m": "attack_modifier", "mz": "攻击特效", "c": "魔晶", "d": "有", "why": "新增", "t": "对友军目标施加暗影步及其所有加成效果。友方单位的渐隐时间是%fade_time%秒。施放时不会使赏金猎人脱离隐身状态。", "b": 2}, {"id": "0786cfb763f5bf38b7af", "n": "石鳞剑士·天佑勇者", "m": "aura", "mz": "光环", "c": "基础", "d": "有", "why": "新增", "t": "附近敌人攻击石鳞剑士时，他们触发物品和技能的随机类攻击特效的几率有所降低。\n对英雄技能和物品有效。\n效果是特效发生的几率相对降低。", "b": 2}, {"id": "32a0690a5350435f70ef", "n": "水晶室女·冰封禁制", "m": "bind", "mz": "捆缚", "c": "基础", "d": "有", "why": "改名", "t": "操控冰霜包围一个敌方单位，禁止移动和攻击，并持续造成伤害。对非远古的普通单位施放将造成%creep_multiplier%倍伤害。\n冰封禁制为捆缚效果。", "b": 1}, {"id": "1d58806410a952f90f22", "n": "幻影长矛手·幻影冲锋", "m": "illusions", "mz": "幻象", "c": "A杖", "d": "有", "why": "旧记录", "t": "提升距离。每当幻影长矛手冲锋时穿过敌人，他就会制造并列幻象攻击他们。另外，每冲锋%illusion_spawn_travel_distance%距离还会在幻影长矛手身旁制造一个并列幻象，向目标冲去。\n对目标发动攻击后，幻影长矛手将快速向其冲去，获得移动速度和闪避提升。\n如果冲锋中途取消攻击指令，那么移动速度加成就会消失。\n冲锋过程中移动速度为%bonus_speed%。", "b": 2}, {"id": "5fd38d323127c57cb56f", "n": "祈求者·电磁脉冲", "m": "cyclone_banish", "mz": "吹风/放逐", "c": "基础", "d": "没有", "why": "旧记录", "t": "祈求者在指定位置召唤出一道强力的自爆电磁脉冲，%delay%秒后将自动爆炸。爆炸将覆盖一定区域，并根据雷元素的等级损毁敌方的魔法值。对敌方英雄造成损毁魔法值一定百分比的伤害。祈求者将获得%self_mana_restore_pct%%%损毁的魔法。\n对被吹起的单位（强袭飓风或Eul的神圣法杖）无效。", "b": 1}, {"id": "2b8bb11d8a66f66baaaf", "n": "黑暗贤者·真空", "m": "tree_destroy", "mz": "砍树", "c": "基础", "d": "有", "why": "新增", "t": "黑暗贤者在目标区域制造一个真空环境，将周围的敌方单位吸入，具有打断效果并造成伤害。\n此技能可以打断持续施法。\n牵引过程为%duration%秒，伤害在牵引后产生。\n真空中央附近的树木将会被摧毁。", "b": 1}, {"id": "8a307a7063267731e843", "n": "莉娜·腾焰斗篷", "m": "phased", "mz": "相位移动", "c": "A杖", "d": "有", "why": "新增", "t": "使莉娜获得顺畅的移动状态，并且提升技能伤害和魔法抗性。开启时获得炽魂的最高叠加层数。", "b": 2}, {"id": "e542e109783a7c4637d9", "n": "谜团·恶魔召唤", "m": "cleave", "mz": "分裂溅射", "c": "基础", "d": "没有", "why": "旧记录", "t": "以生命为代价召唤三个谜团自身的碎片。虚灵的生命值会有所增加，数值为谜团当前生命值的%current_health_pct%%%。这些虚灵都由谜团控制，在反复经过几次成功的攻击后，虚灵会再次分裂，并完全回复生命值。", "b": 2}, {"id": "c4cd81b14531ef70abe6", "n": "暗影萨满·禽戏", "m": "cooldown_reset", "mz": "刷新冷却", "c": "基础", "d": "有", "why": "新增", "t": "受到致死伤害时，暗影萨满会获得强驱散效果，并且以1点生命的小鸡继续存活。受到的伤害将降为零，持续较短时间，并且额外产生若干只小鸡，迷惑敌人。冷却时间会在暗影萨满复活时重置。\n\n驱散类型：强驱散\n无法阻止斧王的淘汰之刃和瘟疫法师的死神镰刀的致死伤害。\n受到的伤害减免效果会阻止生命移除类效果杀死暗影萨满。", "b": 2}, {"id": "a4b46495b71890db4101", "n": "克林克兹·骨隐步", "m": "phased", "mz": "相位移动", "c": "基础", "d": "有", "why": "新增", "t": "克林克兹进入隐身状态，移动可以穿过其他单位，攻击或使用物品时现形。脱离隐身后会产生骷髅弓手。骷髅弓手不能移动，需要多次英雄或防御塔攻击才会被击杀。骷髅弓手继承克林克兹一定百分比的攻击力，对建筑造成的伤害降低%skeleton_building_damage_reduction%%%。攻击距离与克林克兹相同。\n渐隐时间为%fade_time%秒。", "b": 2}, {"id": "131cad7548676460533d", "n": "玛尔斯·战神迅矛", "m": "ground_zone", "mz": "场地魔法", "c": "魔晶", "d": "有", "why": "新增", "t": "战神迅矛可以刺中最多%max_impale_targets%名英雄，并留下一道火焰路径，持续造成伤害并减缓移动速度。\n玛尔斯以致命的精准掷出他强大的战矛，对击中的每个敌方单位造成伤害。击中的第一个敌方英雄将被战矛刺穿，并被击退。若战矛击中树木、建筑或悬崖，目标将会被钉在上面，并受到眩晕。\n战神迅矛可以击中隐身单位，造成眩晕还使其显形。\n战神迅矛只会将单位从低地钉在地势变高的地方，否则会将他们推下高地。", "b": 2}, {"id": "e6317b8f83596ad0683e", "n": "龙骑士·神龙摆尾", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "旧记录", "t": "龙骑士用盾对身边的一个敌方单位进行打击，对它和它身边的目标造成眩晕和伤害。", "b": 2}, {"id": "5426ac4bf3a890ae7393", "n": "幻影长矛手·并列", "m": "invisibility", "mz": "隐身", "c": "魔晶", "d": "有", "why": "旧记录", "t": "并列增加主动技能。使幻影长矛手进入隐身，最多持续%invis_duration%秒，同时产生一个复制幻象来迷惑敌人。隐身期间自身移动速度提升%invis_movespeed%%%。\n幻影长矛手的攻击有一定几率使自己的存在破碎，产生自身的幻象。幻象也有几率进一步破碎，再产生幻象。幻影长矛手产生的幻象持续%illusion_duration%秒，幻象产生的幻象则持续%illusion_from_illusion_duration%秒。", "b": 2}, {"id": "7d9e87dd9073f0e7ee67", "n": "獸·砸", "m": "stun", "mz": "眩晕", "c": "魔晶", "d": "有", "why": "旧记录", "t": "獸向目标地点扔出一块岩石，对敌人造成眩晕和伤害。岩石无法扔向獸身边的最小范围内。岩石落地后会分裂成3块碎石，落在初始目标地点的后方。砸每击中一名英雄都会增加咤的一层叠加效果。", "b": 2}, {"id": "6fe803ccfc9f6fadc940", "n": "大地之灵·磁化", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "旧记录", "t": "将附近小范围内的敌方单位磁化，使其短时间内受到伤害。被磁化的英雄单位将会引起附近残岩的爆炸，每次爆炸都将摧毁残岩并刷新残岩附近单位身上的磁化时间（若附近单位未被磁化则为其施加一个磁化效果）。该过程可重复数次。如果一个被磁化的英雄受到了地磁之握或巨石冲击的作用，那么所有被磁化的英雄都会受到同样效果。", "b": 2}, {"id": "43dae91f48f619448834", "n": "编织者·时光倒流", "m": "mana_gain", "mz": "自身回蓝/吸蓝", "c": "基础", "d": "有", "why": "旧记录", "t": "编织者回到五秒前的时间点，获得当时的生命值和魔法值。不影响冷却时间、金钱和经验。\n\n驱散类型：强驱散\n能够移除编织者身上大部分的负面状态。\n时光倒流可以躲避攻击和技能弹道。", "b": 2}, {"id": "e13ba36029a3e8712ca8", "n": "百戏大王·逃生技", "m": "slow_resistance", "mz": "减速抗性", "c": "基础", "d": "有", "why": "旧记录", "t": "把一名友方英雄装进可动的异维度箱子。友军被装入后拥有相位移动状态，获得额外魔法抗性、减速抗性和移动速度。并且无法成为目标，被锁闭、沉默和缴械。效果结束后或者移动到初始区域之外箱子都会打开。", "b": 2}, {"id": "37a95db4e005c81b9153", "n": "拉席克·闪电风暴", "m": "slow", "mz": "减速", "c": "基础", "d": "有", "why": "旧记录", "t": "召唤一片闪电风暴攻击目标敌方单位，并跳跃到附近的敌方单位。被攻击的敌人将会被降低移动速度。", "b": 2}, {"id": "e1f9256216eb28c7be1e", "n": "拉比克·弱化能流", "m": "self_mobility", "mz": "自身位移", "c": "基础", "d": "没有", "why": "旧记录", "t": "拉比克制造一道强大的奥术能量流，在多个敌方单位之间流动，造成伤害并降低他们的攻击力和技能伤害。每次跳跃造成的伤害递减。", "b": 2}, {"id": "2eb3a2fed6d058bd8613", "n": "兽王·原始咆哮", "m": "stun", "mz": "眩晕", "c": "基础", "d": "有", "why": "旧记录", "t": "兽王发出震耳欲聋的咆哮，使目标敌方单位受到伤害并眩晕，同时在兽王和他的猎物之间清出一条通道。通道上的所有单位都被震开，也受到伤害并被降低移动和攻击速度。另外，兽王和他的单位获得%movement_speed%%%移动速度提升，持续%movement_speed_duration%秒。", "b": 2}, {"id": "0d7f72a3491110281fff", "n": "死亡先知·驱使恶灵", "m": "spell_block", "mz": "格挡指向技能", "c": "基础", "d": "没有", "why": "旧记录", "t": "释放恶灵偷走敌方单位和建筑的生命。恶灵需要回到她身上才能再次攻击。持续时间结束后，死亡先知根据造成的伤害量，获得一定比例的治疗。对建筑造成50%%伤害。持续%abilityduration%秒。\n作用范围代表死亡先知周围的恶灵寻找目标的范围。\n伤害格挡类技能不能减少恶灵伤害。", "b": 2}, {"id": "913b3587b906ce01784d", "n": "琼英碧灵·幽魂子弹", "m": "slow", "mz": "减速", "c": "魔晶", "d": "有", "why": "旧记录", "t": "琼英碧灵对一个敌人射出一颗幽灵子弹，造成伤害，将其击退并将其变为虚无状态，持续%duration%秒——使他们对物理伤害免疫，并且无法攻击。目标被减速，并且承受的魔法伤害增加%bonus_spell_damage_pct%%%。敌人不会被击出琼英碧灵的攻击距离。", "b": 2}, {"id": "782f2f3b32210f9e4c1a", "n": "半人马战行者·奔袭冲撞", "m": "slow", "mz": "减速", "c": "基础", "d": "有", "why": "旧记录", "t": "半人马战行者带领所有队友向胜利冲锋，所有友方英雄达到极限移动速度，并使踩到的敌人减速。每个敌人只会受到一次踩踏作用，并受到基于半人马战行者力量值的伤害。", "b": 2}, {"id": "f341b8c1d131189bbb48", "n": "祈求者·强袭飓风", "m": "cyclone_banish", "mz": "吹风/放逐", "c": "基础", "d": "有", "why": "旧记录", "t": "释放出一道快速移动的飓风，将路径上的敌方单位卷起，使其在空中无助地漂浮一段时间，然后落地受死。最大距离取决于雷元素等级。滞空时间取决于冰元素等级。落地伤害取决于雷元素的等级。\n\n驱散类型：弱驱散\n被强袭飓风吹起时单位处于无敌状态，落地时受到伤害。", "b": 2}, {"id": "d27a0fd04862c41b7def", "n": "末日使者·末日", "m": "silence", "mz": "沉默", "c": "基础", "d": "有", "why": "新增", "t": "对敌人施加末日诅咒，对其进行驱散，并且使其无法施放技能或获得任何治疗效果，同时造成持续伤害。\n\n驱散类型：弱驱散", "b": 2}, {"id": "dca4f2c0ce35b3622609", "n": "冥魂大帝·绝冥再生", "m": "summons", "mz": "召唤物", "c": "基础", "d": "有", "why": "新增", "t": "冥魂大帝倒下后，他飞散的冥魂会重组，使他复活。死亡时附近%slow_radius%范围内的敌人会被减速，会产生骷髅兵攻击附近每个敌方英雄。可以对自身施放，使冥魂大帝立刻阵亡。\n如果魔法不足冥魂大帝将不会重生。\n如果冥魂大帝拥有不朽之守护，同时绝冥再生不处于冷却状态，死亡后将首先触发绝冥再生。\n重生后生命值和魔法值全满。", "b": 1}, {"id": "8f0469e6ab445fcbc87d", "n": "Eul的神圣法杖", "m": "aoe_damage", "mz": "范围伤害", "c": "装备", "d": "没有", "why": "旧记录", "t": "主动：龙卷风\n使目标单位被卷入龙卷风中，持续2.5秒，并处于无敌状态。只能对敌方单位或自身使用龙卷风。\n\n敌方单位落地后将受到50点魔法伤害。\n驱散类型：弱驱散\n不能对队友使用龙卷风。\n对自己施放龙卷风时无视减益免疫。\n龙卷风可以驱散部分正面和负面状态。\n龙卷风持续时间不受状态抗性影响。\n+10 智力\n+2.5 魔法恢复\n+20 移动速度", "b": 2}, {"id": "c1cfbafe8d79fec55151", "n": "发条技师·喷气背包", "m": "terrain_walk", "mz": "无视地形", "c": "魔晶", "d": "有", "why": "旧记录", "t": "发条技师开动喷气背包，获得飞行移动状态，飞行视野和移动速度加成。发条技师的转身速率大幅降低，并且无法攻击。在加成状态的持续时间内可以开启和关闭喷气背包。", "b": 2}, {"id": "48590ce9043d21d79fcb", "n": "慧光", "m": "spell_amp", "mz": "法术放大", "c": "装备", "d": "有", "why": "旧记录", "t": "多个相同物品不会叠加。\n+16 智力\n+10% 技能增强\n+20% 魔法恢复增强", "b": 2}, {"id": "091918f76f20636cfbba", "n": "美杜莎·石化凝视", "m": "slow", "mz": "减速", "c": "基础", "d": "有", "why": "旧记录", "t": "任何盯着蛇发女妖的敌方单位的攻击速度和移动速度均将被减缓。如果一单位在石化凝视期间盯着蛇发女妖超过%face_duration%秒，该单位会被完全石化。被石化的单位处于眩晕状态，受到物理攻击时承受额外伤害。\n无论敌方单位是在美杜莎施放技能期间的何时受到石化凝视作用，他受到的技能效果都是满额的持续时间。", "b": 2}, {"id": "67242d70362629e5c2ec", "n": "斯拉克·海浪短刀", "m": "slow", "mz": "减速", "c": "基础", "d": "有", "why": "新增", "t": "斯拉克用他的海浪短刀划开目标，窃取目标一部分的移动速度、生命恢复和生命回复。这个效果独立叠加。", "b": 2}, {"id": "8c20045467849c774cb5", "n": "赏金猎人·追踪术", "m": "grant_vision", "mz": "提供视野", "c": "基础", "d": "有", "why": "新增", "t": "追踪一个敌方英雄，获得目标的真实视域，使目标受到的伤害增加，同时掌握目标当前携带的金钱数额。如果目标在被追踪期间死亡，赏金猎人和附近友方英雄都将获得若干金钱奖励。施放追踪术不会脱离隐身。\n只要目标在追踪术期间以任何方式死亡，赏金猎人都能获得金钱奖励。\n追踪术效果仅对友方单位可见。\n鼠标移至目标技能栏上方的负面效果图标可以看到目标携带的金钱数额。\n金钱奖励为不可靠金钱。", "b": 1}, {"id": "ae3a86e743b66449c713", "n": "大地之灵·地磁之握", "m": "silence", "mz": "沉默", "c": "基础", "d": "有", "why": "旧记录", "t": "大地之灵将目标残岩或友方单位拉扯到自己所在的位置，行进路径上被击中的敌人都会被沉默并受到伤害。拉扯的残岩也会对击中的敌人造成伤害。以友军为目标时施法距离减少。\n如果目标处于时间结界，决斗或黑洞之中则不起作用。\n地磁之握还可以对友方小兵施放。", "b": 2}, {"id": "c3b109c143b93bce1e9d", "n": "电炎绝手·电光石火", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "旧记录", "t": "电炎绝手开枪产生大范围的爆炸，对锥形区域内的敌人造成伤害和减速。平射距离内的伤害提升%point_blank_dmg_bonus_pct%%%，移动速度减缓、攻击速度降低和减速持续时间额外提升%point_blank_debuff_duration_pct%%%。", "b": 2}, {"id": "e1c42ca462777c0177aa", "n": "小小·树木连掷", "m": "aoe_damage", "mz": "范围伤害", "c": "A杖", "d": "有", "why": "旧记录", "t": "持续施法 - 小小进行持续施法，随机将自身周围的树木扔向目标范围。每棵树对该区域内敌人造成的伤害为小小的攻击伤害加上扔树的额外伤害。", "b": 2}, {"id": "1678e2a6f82fb6187043", "n": "主宰·治疗守卫", "m": "aura", "mz": "光环", "c": "基础", "d": "有", "why": "新增", "t": "召唤一个治疗守卫，按周围友军单位最大生命值的一定比例治疗他们。治疗守卫可以移动，移动速度为%healing_ward_movespeed_tooltip%。持续%abilityduration%秒。\n可以控制治疗守卫。\n多个治疗守卫的效果不会叠加。", "b": 2}, {"id": "7b34a2f7335e15718921", "n": "编织者·虫群", "m": "debuff_immunity", "mz": "减益免疫/技能免疫", "c": "基础", "d": "有", "why": "旧记录", "t": "编织者放出%count%只编织者幼虫，每只幼虫都会紧紧缠住它遇到的敌人，攻击敌人并削弱他们的护甲，直到幼虫被杀死。\n甲虫抓住目标后将一直留在目标身上，除非甲虫被击杀或持续时间结束。\n甲虫免疫技能，需要一个单位的%destroy_attacks%次攻击才能被击杀。英雄造成双倍伤害。\n幼虫提供视野。", "b": 2}, {"id": "174e623e982f3bc07db1", "n": "黑暗贤者·才思敏捷", "m": "mana_gain", "mz": "自身回蓝/吸蓝", "c": "基础", "d": "有", "why": "旧记录", "t": "黑暗贤者从每点智力获得%int_to_atkspd%攻击速度。\n\n黑暗贤者升级时会恢复最大生命值和魔法值的一定百分比。", "b": 2}, {"id": "e404297e7989d4de73cf", "n": "剧毒术士·毒刺", "m": "channel_interrupt", "mz": "打断持续施法", "c": "基础", "d": "没有", "why": "旧记录", "t": "剧毒的攻击会持续减速敌人并造成伤害。\n毒刺的伤害可以致死。\n毒刺造成的持续性伤害不会打断物品的回复效果，也不能使闪烁匕首进行冷却状态。", "b": 2}, {"id": "88297e25a9993cb929aa", "n": "米波·分则能成", "m": "economy", "mz": "经济经验", "c": "基础", "d": "没有", "why": "旧记录", "t": "米波再召唤出一个米波，可以跟随米波本体升级并共用物品。技能的冷却时间相互独立，但是物品的冷却时间在米波之间共用，回城卷轴除外。来自物品的攻击力、攻击速度、生命值、魔法值、恢复效果、法力损毁和触发几率会根据米波数量均分，在每只身上的效果减少%dps_penalty_pct%%%。任意米波阵亡都会导致所有米波全体死亡。", "b": 2}, {"id": "1dff92ba89aab40b0ff2", "n": "天怒法师·奥法鹰隼", "m": "reveal", "mz": "显形", "c": "基础", "d": "没有", "why": "旧记录", "t": "天怒法师施放出缓慢移动的奥术鹰群，对敌方单位造成基于天怒法师智力值的伤害。\n鹰群移动得非常缓慢（500移速），提供325范围的视野。击中目标后，将给予目标区域的视野，持续3.34秒。\n奥法鹰隼无法被躲避。", "b": 2}, {"id": "39fa827727d0d89e7eb8", "n": "石鳞剑士·幸运一击", "m": "armor_reduction", "mz": "减护甲", "c": "基础", "d": "有", "why": "旧记录", "t": "石鳞剑士孤注一掷，让命运决定敌人的下场。石鳞剑士的攻击或技能拥有一定几率大幅降低攻击速度，同时削弱护甲。", "b": 2}, {"id": "0bb13eb4562572764bfa", "n": "杰奇洛·天生一对", "m": "attack_modifier", "mz": "攻击特效", "c": "基础", "d": "有", "why": "新增", "t": "杰奇洛攻击时两个头都会发动攻击，不过每个头造成的伤害减少。\n第二次攻击无视伤害格挡。", "b": 2}, {"id": "61886dfc12d601bb96cb", "n": "小小·长大", "m": "slow", "mz": "减速", "c": "基础", "d": "没有", "why": "旧记录", "t": "小小崎岖的身体不断成长，提升了攻击力、移动速度、护甲和投掷的威力，但攻击速度降低。", "b": 2}, {"id": "feeb9fc3950ec8cd8929", "n": "莉娜·光击阵", "m": "stun", "mz": "眩晕", "c": "基础", "d": "有", "why": "旧记录", "t": "召唤柱状火焰伤害并眩晕敌人。\n光击阵将摧毁作用范围内的树木。", "b": 2}, {"id": "1a6f4c3e8f824c1e5046", "n": "裂魂人·暗影冲刺", "m": "self_mobility", "mz": "自身位移", "c": "基础", "d": "有", "why": "旧记录", "t": "裂魂人盯紧一个敌方单位，开始无视一切物体的冲刺，起始为%min_movespeed_bonus_pct%%%额外移速，%windup_time%秒后达到最大速度。途中经过的所有敌方单位和目标单位都将受到巨力重击。如果目标单位在到达前阵亡，裂魂人将他的目标改为原路径上最近的一个敌方单位。\n裂魂人在冲刺过程中能穿过树木，悬崖和任何单位。\n冲刺指示特效仅对队友可见。\n裂魂人将获得并共享目标的视野。", "b": 2}, {"id": "2130455e82cb3af91be7", "n": "死亡先知·吸魂巫术", "m": "healing", "mz": "治疗/回复", "c": "基础", "d": "有", "why": "新增", "t": "创造一个灵魂连接，将死亡先知与一个敌方单位相连。每秒吸取生命值。\n多个连接不能同时作用于一个目标。", "b": 2}, {"id": "7c049e2291207546183a", "n": "工程师·爆破起飞！", "m": "charges", "mz": "充能", "c": "基础", "d": "没有", "why": "旧记录", "t": "工程师冲到敌人中间，在相遇时引爆炸药，造成大量范围伤害，并眩晕敌人。引爆时会对工程师造成当前生命值一定百分比的非致死伤害。\n工程师在此次爆炸中受到的自身伤害为纯粹伤害，而且不会致死。\n此技能将摧毁树木。", "b": 2}, {"id": "ae10dba64ae882ceb903", "n": "干扰者·风雷之击", "m": "grant_vision", "mz": "提供视野", "c": "基础", "d": "有", "why": "旧记录", "t": "用闪电反复打击目标单位。每次打击会伤害附近小范围内的敌方单位，并施加%slow_duration%秒的%slow_amount%%%攻击速度和移动速度降低效果。提供目标的视野。", "b": 2}, {"id": "737241cb9b28554d5dd6", "n": "凯·猛禽之舞", "m": "applies_basic_dispel", "mz": "施加弱驱散", "c": "基础", "d": "有", "why": "旧记录", "t": "凯进入不可控制的状态，持续%AbilityCastPoint%秒，%invuln_period%秒为无敌状态并获得一次弱驱散效果。如果施法成功完成，凯会对周围发动致命的辐射状斩击，基于目标的最大生命值造成伤害，并且造成伤害的一定百分比会治疗凯。\n斩击非英雄单位或幻象时吸血量减少至%illusion_lifesteal_pct%%%。", "b": 2}, {"id": "5606f4a07f9df43f4882", "n": "大地之灵·巨石冲击", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "旧记录", "t": "大地之灵将敌方单位或友方单位作为目标，将其击飞，目标将沿他面朝的方向飞行一段距离。如果大地之灵点地为目标，他将击飞%remnant_smash_radius_tooltip%范围内距离最近的单位，优先以残岩为目标。击飞的单位或残岩会对碰到的所有单位造成伤害。如果敌人是被残岩击中还将额外被减速。残岩被击飞的距离比其他单位更远。", "b": 2}, {"id": "430905a1f058145b81c1", "n": "上古巨神·动量", "m": "armor_reduction", "mz": "减护甲", "c": "基础", "d": "没有", "why": "旧记录", "t": "上古巨神获得额外护甲，数值为移动速度加成的一定百分比。\n移动速度加成是指高于基础移动速度的部分。\n上古巨神被减速到低于基础移动速度时动量不会降低上古巨神的护甲。", "b": 2}, {"id": "3e126070c8f4381970a7", "n": "侦察守卫", "m": "grant_vision", "mz": "提供视野", "c": "装备", "d": "有", "why": "旧记录", "t": "使用：放置\n放置隐形的侦察守卫来获得附近区域1600范围内的视野。持续6分钟。\n\n按住Ctrl键可以对友方英雄使用，将1个守卫转移到他的物品栏中。", "b": 2}, {"id": "b174c19d538e2b4181ad", "n": "独行德鲁伊·野蛮咆哮", "m": "aoe_damage", "mz": "范围伤害", "c": "魔晶", "d": "没有", "why": "旧记录", "t": "施加弱驱散效果，并对施法者附近范围内友军提供移动速度和攻击速度加成。施法效果会在独行德鲁伊和熊灵之间复制，不论双方是否可以施法。驱散类型：弱驱散\n独行德鲁伊和熊灵发出野性的咆哮，使周围敌人恐惧，朝自己的基地狂奔。敌人的移动速度将增加%bonus_speed%%%。\n被缠绕的英雄将无法移动。\n与熊灵共享冷却时间。", "b": 2}, {"id": "cf416c1a8428d13b4a88", "n": "天穹守望者·乱流", "m": "slow", "mz": "减速", "c": "基础", "d": "有", "why": "旧记录", "t": "将不稳定的涡流能量灌注到落单敌人体内，造成持续伤害并减缓其移动速度。如目标周围有其他敌方单位 ，则不会造成伤害。", "b": 2}, {"id": "ecde2c8af38959c5d342", "n": "森海飞霞·野地奇袭", "m": "stun", "mz": "眩晕", "c": "基础", "d": "有", "why": "旧记录", "t": "扔出一张网，对区域内靠近树木的敌人造成眩晕。敌人会持续受到伤害并被拖拽到目标区域内最近的树上，并且眩晕期间视野降低至0。\n若树木被摧毁，被影响的单位将解除眩晕。\n野地奇袭不会击中隐身单位。", "b": 2}, {"id": "58af19beb51fe6f648ff", "n": "马格纳斯·授予力量", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "旧记录", "t": "对友军施放时，给予攻击力加成并使其获得分裂效果。\n\n授予力量总是在马格纳斯身上生效，拥有%self_multiplier%%%额外效果。\n攻击力加成根据基础攻击力和主属性加成计算。\n分裂伤害无视减益免疫。\n远程单位的攻击没有分裂效果。", "b": 2}, {"id": "fa27e64ac9541ba56d63", "n": "陈·狂热者", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "没有", "why": "旧记录", "t": "陈复活时都会带着一个狂热者加入战斗，这是近战小兵战士，可以牺牲自己治疗友军，或者对敌人造成伤害。狂热者会获得神圣劝化的加成效果，并且和其他线上近战小兵一样随着游戏时间的增加提升属性，获得额外基础攻击力。狂热者会在陈身边复活。狂热者技能可以主动使用，在%teleport_delay%秒延迟后把控制下的目标单位传送到陈的身边。如果陈是技能的目标，将传送控制的所有单位。受到来自敌方英雄及其单位的伤害会中止传送过程。", "b": 2}, {"id": "14bb32fe72552599ee98", "n": "暗夜魔王·虚空", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "没有", "why": "旧记录", "t": "制造一个伤害性的虚空，对一个敌方单位造成减速及伤害。夜晚时虚空可以造成短暂眩晕，打断持续施法，并且效果的持续时间更长。\n虚空在白天不会对敌人造成眩晕。", "b": 2}, {"id": "5c819dea99dcbf170b88", "n": "风之杖", "m": "applies_basic_dispel", "mz": "施加弱驱散", "c": "装备", "d": "有", "why": "旧记录", "t": "主动：龙卷风\n使目标单位被卷入龙卷风中，持续2.5秒，并处于无敌状态。可以对自身、敌方单位或友方单位使用龙卷风。对自身使用后，自身能使龙卷风以300的移速进行移动。\n\n敌方单位落地后将受到50点魔法伤害。\n驱散类型：弱驱散\n龙卷风可以驱散部分正面和负面状态。\n对自身施放时，龙卷风可以任意移动，移动速度为360。\n龙卷风持续时间不受状态抗性影响。\n+30 移动速度\n+3 魔法恢复\n+35 智力", "b": 2}, {"id": "bcc7fba5dc3fc529357a", "n": "死亡先知·驱使恶灵", "m": "damage_block", "mz": "护盾/伤害吸收/减伤", "c": "基础", "d": "没有", "why": "旧记录", "t": "释放恶灵偷走敌方单位和建筑的生命。恶灵需要回到她身上才能再次攻击。持续时间结束后，死亡先知根据造成的伤害量，获得一定比例的治疗。对建筑造成50%%伤害。持续%abilityduration%秒。\n作用范围代表死亡先知周围的恶灵寻找目标的范围。\n伤害格挡类技能不能减少恶灵伤害。", "b": 2}, {"id": "f16d23fd868da0600eaf", "n": "钢背兽·粘稠鼻液", "m": "armor_reduction", "mz": "减护甲", "c": "基础", "d": "有", "why": "旧记录", "t": "用鼻涕包裹一个敌方单位，降低护甲和移动速度，持续%goo_duration%秒。多次施放的效果会叠加，并且刷新持续时间。", "b": 2}, {"id": "9a22178693dcb17822fa", "n": "雷泽·等离子场", "m": "slow", "mz": "减速", "c": "基础", "d": "有", "why": "旧记录", "t": "释放一波威力随扩张程度提升的等离子能量场，收缩时也会对经过的敌人造成伤害和减速。距离雷泽越远，伤害和减速越高。等离子场对每个单位造成两次伤害。", "b": 2}, {"id": "baa7256d207c2359e61d", "n": "小小·抓树", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "旧记录", "t": "抓起一棵树，使小小在有限次数的攻击里获得攻击距离加成、攻击力加成和溅射攻击。可以将树木扔出，对远距离的敌人造成攻击伤害。\n树木扔出后技能进入冷却。", "b": 2}, {"id": "a8fec06ec4935e90356a", "n": "幻影刺客·魅影无形", "m": "cooldown_reduction", "mz": "减冷却", "c": "魔晶", "d": "有", "why": "新增", "t": "冷却时间减少%bonus_AbilityCooldown%秒。只要幻影刺客击杀英雄，她的技能冷却时间都会加快%cooldown_refund_pct%%%最高冷却时间。\n幻影刺客模糊自己的身形，躲避多种飞行过程中的攻击和技能弹道，提升她的移动速度，使她无法被看到，直到她靠近敌方英雄或防御塔。\n通过普通攻击攻击肉山会驱散魅影无形。", "b": 2}, {"id": "104f605d4e73a5fb9ee9", "n": "帕克·顽皮克敌", "m": "projectile_dodge", "mz": "躲避弹道", "c": "基础", "d": "没有", "why": "旧记录", "t": "每当帕克躲避攻击时，它就会分别回复最大生命值和最大魔法值的%mana_and_health_restore_pct%%%。躲避指向性技能的弹道将回复%dodged_spell_multiplier%倍数值。防御塔的攻击不会对此生效。", "b": 2}, {"id": "a52863e37b74190b36fd", "n": "复仇之魂·恶有恶报", "m": "incoming_damage_amp", "mz": "伤害加深", "c": "基础", "d": "有", "why": "新增", "t": "复仇之魂的攻击同时被视为远程和近战，可以获得相应加成。只要敌方英雄击杀了复仇之魂，他们会获得一个负面效果，直到下次阵亡，期间复仇之魂会对他们造成%bonus_damage%%%额外伤害。同一时间只能存在一个负面效果。", "b": 2}, {"id": "520e2c2a8c1370299c36", "n": "齐天大圣·棒击大地", "m": "self_mobility", "mz": "自身位移", "c": "魔晶", "d": "有", "why": "旧记录", "t": "棒击大地对沿途和末端的敌人施加乾坤之跃，威力为最长持续施法时间的%spring_channel_pct%%%。棒击大地设为多样施法（右键点击技能栏图标）后，齐天大圣还会跳跃至金箍棒的另一端。\n齐天大圣让金箍棒变大，并将其挥起猛击地面，眩晕一条直线上的敌人并造成额外伤害和基于他普通攻击的致命一击伤害。具有克敌机先效果。", "b": 2}, {"id": "fe86c26602b6d1fd3278", "n": "美杜莎·分裂箭", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "旧记录", "t": "美杜莎施展魔法将她的箭分裂成若干支箭矢。分裂箭造成的伤害为正常攻击力的一定百分比。额外目标不会受到其他攻击特效（比如致命一击）的作用。\n次级目标将是除了主要目标外距离最近的敌方单位。\n如果在分裂箭激活的状态下创造幻象，幻象也将继承此技能。", "b": 2}, {"id": "e7115513846c93269ef1", "n": "宙斯·神圣一跳", "m": "grant_vision", "mz": "提供视野", "c": "基础", "d": "有", "why": "新增", "t": "宙斯作出神圣一跳，向前跳跃并震击最近的可见敌人（以英雄优先），造成伤害，并减缓其移动速度、攻击速度。宙斯获得附近%vision_radius%范围的顺畅视野，持续3秒。", "b": 2}, {"id": "93f80f873a43059a34b4", "n": "黑暗贤者·普通一拳", "m": "stun", "mz": "眩晕", "c": "A杖", "d": "有", "why": "旧记录", "t": "被动技能。使黑暗贤者下次对英雄的攻击具有克敌机先效果，可以打出目标的复制体，并且根据过去%recent_duration%秒内黑暗贤者的移动距离造成伤害和眩晕。移动%max_distance%距离以上将造成最大威力。", "b": 2}, {"id": "a2fc01a925b1d0a70885", "n": "银月之晶", "m": "grant_vision", "mz": "提供视野", "c": "装备", "d": "有", "why": "旧记录", "t": "使用：吞噬\n 吞噬银月之晶，永久获得60攻击速度和200夜间视野加成。最多使用1次。\n\n被动：月夜之视\n提供额外夜间视野。\n+140 攻击速度\n+400 额外夜间视野", "b": 2}, {"id": "160ddf5a1919e9b6c3e9", "n": "蝙蝠骑士·火焰飞行", "m": "phased", "mz": "相位移动", "c": "基础", "d": "有", "why": "新增", "t": "蝙蝠骑士飞向天空，从空中留下一道燃烧的尾迹。飞行时，燃烧尾迹会破坏树木，对经过的敌人造成伤害。在火焰飞行持续时间的最后会达到最高移动速度加成。\n火焰飞行期间蝙蝠骑士可以飞越任何单位，树木和不可通行的地形。\n如果蝙蝠骑士在持续时间结束时正好在不可通行的地形上方，那么他将会卡住。\n蝙蝠骑士死亡后火焰效果将继续存在。", "b": 2}, {"id": "24f011242418494f53a2", "n": "拉比克·隔空取物", "m": "stun", "mz": "眩晕", "c": "基础", "d": "有", "why": "旧记录", "t": "拉比克利用他的隔空取物能力，将敌人短暂抬到空中，然后猛投向地面。被投下的单位会砸晕落地点附近的敌人。\n目标滞空时，拉比克可以使用次级技能将目标扔往目标方向。\n单位落地后，自身不会受到范围眩晕效果。", "b": 2}, {"id": "7cbabe006934699adaa6", "n": "幻影长矛手·幻影冲锋", "m": "charges", "mz": "充能", "c": "基础", "d": "没有", "why": "旧记录", "t": "对目标发动攻击后，幻影长矛手将快速向其冲去，获得移动速度和闪避提升。\n如果冲锋中途取消攻击指令，那么移动速度加成就会消失。\n冲锋过程中移动速度为%bonus_speed%。", "b": 2}, {"id": "73cf075abfc94bd78ee9", "n": "暗影萨满·妖术", "m": "hex", "mz": "妖术", "c": "基础", "d": "有", "why": "新增", "t": "将一个敌方单位变成人畜无害的动物，使其无法攻击和使用技能。\n立即摧毁幻象。\n目标的基础移动速度为%movespeed%，但是如果目标有满速状态则移速不受影响。", "b": 1}, {"id": "31f5f6f05825d90d4f8a", "n": "灰烬之灵·献祭心", "m": "aoe_damage", "mz": "范围伤害", "c": "魔晶", "d": "有", "why": "新增", "t": "使残焰获得献祭心，并且每秒伤害和作用范围提升。\n灰烬之灵持续燃烧，时刻对周围所有敌人造成每秒伤害。\n破坏不会使阿哈利姆魔晶升级的残焰继承的献祭心失效。", "b": 2}, {"id": "cafd569c3bc1a72708d5", "n": "缚灵索", "m": "root", "mz": "缠绕", "c": "装备", "d": "有", "why": "旧记录", "t": "主动：永恒锁链\n缠绕目标400范围内所有敌人，持续2秒。\n多个裂隙之石或升级物品的作用范围加成不会叠加。\n+450 生命值\n+200 魔法值\n+12 智力\n+75 作用范围", "b": 2}, {"id": "12d8763b6dcd36bd2c23", "n": "圣堂刺客·灵能陷阱", "m": "debuff_immunity", "mz": "减益免疫/技能免疫", "c": "基础", "d": "有", "why": "旧记录", "t": "圣堂刺客放下一个隐形的神秘陷阱监视敌人的动向。引爆后将减缓%trap_radius%范围内敌人的移动速度，陷阱放置时间越久，引爆后减速效果越强，最低为%movement_speed_min%%%，放置%trap_max_charge_duration%秒后引爆将达到最大减速效果，为%movement_speed_max%%%，并且还能造成额外伤害。\n陷阱没有时间限制。\n他们拥有隐形效果，渐隐时间为%trap_fade_time%秒，还拥有技能免疫状态。他们可以承受2次远程英雄的攻击，1次近战英雄的攻击，或4次非英雄单位的攻击。\n陷阱的视野是250/250，不能阻止中立生物刷新。", "b": 2}, {"id": "d69348eddae721453025", "n": "陨星锤", "m": "stun", "mz": "眩晕", "c": "装备", "d": "有", "why": "旧记录", "t": "主动：陨星锤\n 持续施法 - 成功施法后召唤一颗陨石，打击400范围内敌人，造成0.75秒眩晕和冲击伤害。对敌方单位和建筑造成持续伤害，持续6秒。非建筑单位在烧灼期间还会被减速20%。对建筑冲击伤害：90对建筑持续伤害：50对非建筑冲击伤害：130对非建筑持续伤害：50持续施法时间：2秒落地时间：0.5秒\n+6 力量\n+6 敏捷\n+24 智力\n+10% 技能增强\n+25% 魔法恢复增强", "b": 2}, {"id": "1140f10fde1e3a9bccde", "n": "玛尔斯·战神迅矛", "m": "aoe_damage", "mz": "范围伤害", "c": "魔晶", "d": "有", "why": "没再提到", "t": "战神迅矛可以刺中最多%max_impale_targets%名英雄，并留下一道火焰路径，持续造成伤害并减缓移动速度。\n玛尔斯以致命的精准掷出他强大的战矛，对击中的每个敌方单位造成伤害。击中的第一个敌方英雄将被战矛刺穿，并被击退。若战矛击中树木、建筑或悬崖，目标将会被钉在上面，并受到眩晕。\n战神迅矛可以击中隐身单位，造成眩晕还使其显形。\n战神迅矛只会将单位从低地钉在地势变高的地方，否则会将他们推下高地。", "b": 1}, {"id": "083185a144533f24996a", "n": "凤凰·烈火精灵", "m": "attack_slow", "mz": "减攻速", "c": "基础", "d": "有", "why": "旧记录", "t": "召唤4只围绕凤凰飞行的烈火精灵。每一只烈火精灵都能被单独发射到指定区域。对敌人持续造成伤害并大幅降低他们的攻击速度。\n烈火精灵现在到达目标区域后将获得1秒的视野。", "b": 2}, {"id": "1b23022fdfcf8456c24e", "n": "散魂剑", "m": "applies_basic_dispel", "mz": "施加弱驱散", "c": "装备", "d": "有", "why": "旧记录", "t": "主动：抑制\n同时驱散佩戴者和目标。敌方目标会被减速4秒，友方目标则会提升移动速度和40%减速抗性，持续4秒。施法者总是会获得友军的加成效果。\n\n移动速度减缓和提升效果在状态持续时间内初始均为100%，并且逐渐减少至0。\n驱散类型：弱驱散\n\n被动：破法\n每次攻击将燃烧目标40点魔法，而且每燃烧一点魔法都会造成1点物理伤害。\n\n幻象不会燃烧魔法。\n+40 敏捷\n+10 智力", "b": 2}, {"id": "bc604bff8462c8055365", "n": "斯拉达·汪洋前哨", "m": "healing", "mz": "治疗/回复", "c": "基础", "d": "有", "why": "没再提到", "t": "斯拉达在水洼、水迹或河道中将获得移动速度、生命恢复、攻击力和护甲加成。", "b": 1}, {"id": "767efb7ced945da36e70", "n": "宽容之靴", "m": "aura", "mz": "光环", "c": "装备", "d": "有", "why": "旧记录", "t": "主动：坚韧\n为周围友军提供+50攻速加成和+15%移动速度加成，持续6秒。而且最初1.5秒友军不受减速效果影响。\n\n作用范围：1200\n\n被动：迅捷光环\n为周围友军提供15移动速度和2.5点/秒生命恢复。\n\n作用范围：1200\n多个鞋类物品提供的移动速度加成不叠加。\n+8 力量\n+65 移动速度\n+18 生命恢复", "b": 2}, {"id": "fc9c87d96aaf1062c4c2", "n": "幽鬼·鬼影重重", "m": "fear", "mz": "恐惧", "c": "A杖", "d": "有", "why": "改名", "t": "幽鬼第一次对鬼影重重的幻象使用空降时，目标附近%fear_aoe%范围内的敌人会被恐惧，朝远离幽鬼的方向奔跑%fear_duration%秒，并且移动速度降低%fear_movespeed_slow%%%。冷却时间减少%scepter_cooldown_reduction_tooltip%秒。\n创造一个复仇鬼影分别攻击每个敌方英雄。鬼影无法控制，受到额外伤害，造成的伤害低于幽鬼本体。鬼影移动无视地形。子技能空降可以将本体传送至幻象，并将其摧毁。", "b": 1}, {"id": "cb6d4800952c9910d08f", "n": "白银之锋", "m": "invisibility", "mz": "隐身", "c": "装备", "d": "有", "why": "旧记录", "t": "主动：疾影步\n进入隐身直到17秒持续时间结束、或者在此之前攻击或施法。隐身时，移动速度将提升20%，而且可以穿越单位。\n\n破隐一击将额外造成300点物理伤害，同时5秒内目标的被动技能无效，移动速度不会超过200。\n+70 攻击力\n+35 攻击速度", "b": 2}, {"id": "256d87907de3c45dc1c6", "n": "电炎绝手·喷吐", "m": "displace_other", "mz": "位移他人", "c": "A杖", "d": "有", "why": "新增", "t": "小莫迪吐出他肚子里的单位，对大片区域造成冲击伤害和眩晕。留下的火痰根据蜥蜴绝吻的当前等级还将持续造成减速和伤害。喷吐没有最小发射距离。", "b": 2}, {"id": "b655ede867d54f6797e2", "n": "虚无之灵·太虚之径", "m": "slow", "mz": "减速", "c": "基础", "d": "有", "why": "旧记录", "t": "虚无之灵撕裂现实进入精神位面，再出现在目标地点，对沿途的所有敌人造成伤害。此次攻击将施加一个太虚印记，造成%pop_damage_delay%秒减速，然后引爆。\n太虚之径的攻击不会分裂。", "b": 2}, {"id": "491db52673d4c91e3265", "n": "矮人直升机·追踪导弹", "m": "aoe_damage", "mz": "范围伤害", "c": "魔晶", "d": "有", "why": "新增", "t": "追踪导弹现在从施放%shard_delay%秒后开始不断发射%shard_radius%作用范围的火箭弹幕。火箭弹幕优先以追踪导弹的目标为目标。\n发射一枚会自动定位目标单位的追踪导弹。导弹发射后持续增加飞行速度，击中目标时造成伤害及眩晕。敌方单位可在导弹接近前将其击落。\n防御塔对导弹造成半额伤害。\n准星效果仅对队友可见。\n导弹会跟随并击中隐身单位。", "b": 2}, {"id": "99a947a26a5e868435ed", "n": "半人马战行者·马到成功", "m": "phased", "mz": "相位移动", "c": "A杖", "d": "有", "why": "新增", "t": "半人马战行者套上一辆便车。开启后半人马战行者获得当前等级奔袭冲撞的加成效果，而且可以对友方目标施放便车。", "b": 2}, {"id": "00a618ee878e8c064581", "n": "琼英碧灵·越界", "m": "phased", "mz": "相位移动", "c": "基础", "d": "有", "why": "旧记录", "t": "琼英碧灵变身，成为虚无状态，获得基础攻击力加成和相位移动状态。被动使总是可以攻击虚无状态下的目标，并且她在虚无状态下也能攻击。在她或目标处于虚无时，她的所有攻击伤害均为魔法伤害，她的物理吸血被视为技能吸血。驱散类型：弱驱散\n琼英碧灵在变身期间可以躲避弹道。\n琼英碧灵在变身后无法攻击建筑。", "b": 2}, {"id": "13d44bafe618758dc22d", "n": "卓尔游侠·霜冻之箭", "m": "heal_reduction", "mz": "治疗削减", "c": "A杖", "d": "有", "why": "旧记录", "t": "霜冻之箭现在对敌人施加低温的叠加效果，提升霜冻之箭的伤害，并且每层叠加效果都会降低生命回复。若敌人在低温效果下阵亡，他们将会爆炸，对范围内的敌人造成伤害和减速。\n卓尔游侠在箭矢中附上冰冻效果，减缓敌人的移动速度并造成额外伤害。持续%abilityduration%秒。\n减速的持续时间在下一支冰箭射中后刷新。", "b": 2}, {"id": "f81af68ecb91e3c32b05", "n": "石鳞剑士·卷土重来", "m": "debuff_immunity", "mz": "减益免疫/技能免疫", "c": "魔晶", "d": "有", "why": "旧记录", "t": "石鳞剑士将自身卷成保护性的圆球，获得减益免疫状态，拥有%magic_resistance%%%魔法抗性加成，并且可以转身。可以在地雷滚滚期间施放，暂停滚动。可以在卷土重来期间施放地雷滚滚和甲盾冲击。若敌人在此期间发动攻击，将滚离攻击者，对途中的敌人施加地雷滚滚的伤害/眩晕。", "b": 2}, {"id": "91e0a0999b5ff960a4c4", "n": "维萨吉·陵卫斗篷", "m": "aura", "mz": "光环", "c": "基础", "d": "有", "why": "新增", "t": "维萨吉产生数层屏障来保护他，降低受到的伤害。每当他受到来自玩家的伤害，就会失去一层屏障，失去的屏障需要一定时间才能恢复。维萨吉的佣兽在%radius%范围内也会受到斗篷的保护，承伤降低的数值取决于维萨吉拥有的层数。\n每次维萨吉受到来自其他玩家的伤害超过最小伤害时，保护层就会移除一层。\n佣兽在维萨吉周围%radius%范围内将获得当前陵卫斗篷的承伤降低效果。\n破坏会使技能无法获得新的叠加效果。\n破坏不会使现有叠加效果提供的加成失效。", "b": 2}, {"id": "53823a38acbb83973994", "n": "邪影芳灵·恐吓", "m": "grant_vision", "mz": "提供视野", "c": "基础", "d": "有", "why": "旧记录", "t": "邪影芳灵放出她的精灵宠物恐吓她的敌人。经过一定延迟后，目标区域内所有敌人变得害怕，朝自己的泉水狂奔。作祟开启期间不能使用恐吓。\n恐吓提供受作用单位的视野。", "b": 2}, {"id": "3957edf3e88b374060fb", "n": "风行者·强力击", "m": "channel_interrupt", "mz": "打断持续施法", "c": "基础", "d": "没有", "why": "旧记录", "t": "持续施法 - 风行者为她的弓蓄力，射出一支强力的箭矢，最长可蓄力%abilitychanneltime%秒，其间可以打断蓄力，蓄力时间越长，箭矢伤害越高。这支箭会对穿过的所有敌方单位造成伤害和减速效果，并破坏树木。每伤害一个单位，箭矢的伤害和减速效果都会降低。\n强力击将摧毁作用范围内的树木。", "b": 2}, {"id": "231c7f1ac6b098d77904", "n": "祈求者·幽灵漫步", "m": "aura", "mz": "光环", "c": "基础", "d": "有", "why": "新增", "t": "祈求者操纵冰电之力围绕自身，使自己隐形并且获得生命和魔法恢复。各种元素的不平衡导致附近敌人的移动速度被减缓，减速效果取决于冰元素的等级，并使祈求者自身移动速度减缓，减速效果与雷元素等级成反比。\n减速效果对减益免疫状态下的单位无效。", "b": 2}, {"id": "217b63504a54f0e3315a", "n": "黑皇杖", "m": "applies_basic_dispel", "mz": "施加弱驱散", "c": "装备", "d": "有", "why": "旧记录", "t": "主动：天神下凡\n施加弱驱散。获得减益免疫状态。提供60%魔法抗性加成，并且免疫反弹和纯粹伤害。持续时间内敌方技能的负面效果不会生效。\n\n持续时间：9/8/7秒\n驱散类型：弱驱散\n再次购买黑皇杖也不会重置天神下凡的持续时间。\n天神下凡的持续时间不会受到增益持续时间增加的影响。\n+10 力量\n+24 攻击力", "b": 2}, {"id": "a0b85859b5db890b58f9", "n": "钢背兽·毛团", "m": "aoe_damage", "mz": "范围伤害", "c": "魔晶", "d": "有", "why": "新增", "t": "向目标地点咳出一团满是刺针的毛团。毛团会在该地点爆开，范围内的敌人都将受到多个鼻液叠加效果和单次刺针扫射的作用。", "b": 2}, {"id": "8cf8945ab32768dd7b60", "n": "绝刃", "m": "slow", "mz": "减速", "c": "装备", "d": "有", "why": "旧记录", "t": "被动：法术强化\n下个对敌人施放的单体技能会单独对目标造成250点额外伤害，禁用其被动技能，并且减缓30%移动速度，持续4秒。\n减速的负面效果可以被驱散。\n破坏的负面效果不能被驱散。\n+450 生命值\n+450 魔法值\n+8 全属性\n+7 生命恢复\n+3 魔法恢复", "b": 2}, {"id": "2da9d890633ec3f7e7a2", "n": "天堂之戟", "m": "evasion", "mz": "闪避", "c": "装备", "d": "有", "why": "新增", "t": "主动：缴械\n阻止目标在3.5秒内进行攻击。\n+9 护甲\n+6.5 生命恢复\n+25% 闪避", "b": 2}, {"id": "19360f926e0676b25b54", "n": "谜团·午夜凋零", "m": "tree_destroy", "mz": "砍树", "c": "基础", "d": "有", "why": "旧记录", "t": "使一块区域浸入暗共振中，对敌方单位造成%base_damage% + 基于敌人当前生命值的伤害。\n此技能将摧毁范围内的树木。\n多个午夜凋零的效果不会叠加。", "b": 2}, {"id": "540c9c301461a2d345a6", "n": "回复戒指", "m": "healing", "mz": "治疗/回复", "c": "装备", "d": "有", "why": "新增", "t": "+1.25 生命恢复", "b": 2}, {"id": "0f202cc7c53c323b8f36", "n": "沉默术士·智慧之刃", "m": "stat_steal", "mz": "偷属性", "c": "基础", "d": "有", "why": "旧记录", "t": "沉默术士用他的智慧强化刀刃，每次攻击窃取目标的智力，并造成基于他智力值的额外伤害。", "b": 1}, {"id": "65624ae418563ca45dad", "n": "森海飞霞·一箭穿心", "m": "slow", "mz": "减速", "c": "基础", "d": "有", "why": "旧记录", "t": "森海飞霞装载她的弩机，射出致命的一箭，对一名敌方英雄造成高额伤害，并施加破坏和减速效果。伤害和负面状态持续时间随着装载时间增加，%max_charge_time%秒后达到最大效果，弩箭在%misfire_time%秒后自动发射。\n由于弩箭的威力，森海飞霞后退%recoil_distance%距离。弩箭穿过的非英雄单位会受到半额伤害。", "b": 2}, {"id": "dbee1de63281cd5bf6be", "n": "食人魔魔法师·火焰爆轰", "m": "stun", "mz": "眩晕", "c": "基础", "d": "有", "why": "旧记录", "t": "以一波火焰轰击一个敌方单位，造成伤害并使目标眩晕。\n触发多重施法时，两次火焰爆轰之间有%multicast_delay%秒的间隔。", "b": 2}, {"id": "bb9fb4fb2a882a2df7d9", "n": "寒冬飞龙·严寒烧灼", "m": "mana_gain", "mz": "自身回蓝/吸蓝", "c": "A杖", "d": "没有", "why": "旧记录", "t": "严寒烧灼变成开关型技能，开启后每秒消耗一定量魔法。提升寒冬飞龙的移动速度。\n寒冬飞龙乘着一股极地寒风扶摇而上，移动将无视地形，每次攻击都将呼出逼人的寒气。高飞时，她的攻击距离更远，攻击弹道速度也更快，被攻击的敌人在寒意作用下，移动速度会被减缓，同时每秒损失%percent_damage%%%当前生命值。\n本技能无法作用于肉山。\n寒冬飞龙的攻击前摇降低至%attack_point%秒。\n严寒烧灼的持续伤害和减速可以被驱散。", "b": 2}, {"id": "9669369b0bae6c539858", "n": "暗影萨满·群蛇守卫", "m": "debuff_immunity", "mz": "减益免疫/技能免疫", "c": "基础", "d": "有", "why": "新增", "t": "召唤%ward_count%个群蛇守卫攻击敌方单位和建筑。守卫免疫魔法。非英雄单位对毒蛇守卫造成半额伤害。", "b": 2}, {"id": "6f51a2e8039e16087f30", "n": "树精卫士·自然卷握", "m": "slow", "mz": "减速", "c": "基础", "d": "有", "why": "旧记录", "t": "朝目标地点制造藤蔓。藤蔓对穿过的敌人造成减速和伤害。对非英雄单位造成的伤害减少%creep_penalty%%%。", "b": 2}, {"id": "d7a262a2269d70518b2c", "n": "纷争面纱", "m": "lifesteal", "mz": "吸血", "c": "装备", "d": "有", "why": "新增", "t": "主动：法术虚弱\n发出一波弱化冲击，使900范围内敌方英雄受到的技能伤害增加10%。\n\n可以在持续施法期间施放。\n\n持续时间：16秒。\n法术虚弱不与血精石的法术虚弱光环叠加。\n+175 生命值\n+10 智力\n+18% 技能吸血", "b": 2}, {"id": "22ef6ff4b441de6c8067", "n": "力丸·闪烁突袭", "m": "attack_modifier", "mz": "攻击特效", "c": "基础", "d": "有", "why": "新增", "t": "传送到目标背后，如果是敌人对其造成%slow_pct_tooltip%%%短暂减速，并发动一次拥有额外伤害的攻击。", "b": 2}, {"id": "84ad1cec0c55567c3411", "n": "工程师·粘性炸弹", "m": "slow", "mz": "减速", "c": "基础", "d": "有", "why": "旧记录", "t": "向目标区域抛出一个粘性炸弹。如果炸弹落在一个敌方英雄身旁，炸弹会粘上去，减缓其移动速度。数秒后炸弹会爆炸，对爆炸区域内造成伤害，并再次施加减速，持续%secondary_slow_duration%秒。", "b": 2}, {"id": "c8c413decd0a996071b1", "n": "裂魂人·暗影冲刺", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "新增", "t": "裂魂人盯紧一个敌方单位，开始无视一切物体的冲刺，起始为%min_movespeed_bonus_pct%%%额外移速，%windup_time%秒后达到最大速度。途中经过的所有敌方单位和目标单位都将受到巨力重击。如果目标单位在到达前阵亡，裂魂人将他的目标改为原路径上最近的一个敌方单位。\n裂魂人在冲刺过程中能穿过树木，悬崖和任何单位。\n冲刺指示特效仅对队友可见。\n裂魂人将获得并共享目标的视野。", "b": 2}, {"id": "e8bfe963e757c85184ee", "n": "复仇之魂·复仇光环", "m": "respawn", "mz": "重生", "c": "A杖", "d": "有", "why": "旧记录", "t": "提升自身加成系数。死亡时产生一个复仇之魂的强幻象，继承全额攻击力，可以施放自己的所有技能。复仇之魂复活时若幻象依然存在，则自身会直接将其取代。幻象获得的经验将给予英雄。强幻象不会被相关技能秒杀。\n复仇之魂的存在提升了附近友方英雄的攻击力。复仇之魂自身获得%self_multiplier%%%额外加成。\n破坏会使攻击力光环失效。", "b": 2}, {"id": "fc5dde96a41b6298c588", "n": "独行德鲁伊·缠绕之根", "m": "root", "mz": "缠绕", "c": "基础", "d": "有", "why": "旧记录", "t": "敌方英雄获得%hits_required%层叠加效果后独行德鲁伊可以缠绕敌方英雄。被缠绕的英雄无法移动，并受到持续伤害。施放时，对区域内每个敌方英雄施加%hits_incremented_on_active%层叠加效果，对敌方非英雄单位施加%hits_required%层。独行德鲁伊的攻击还会被强化%lone_druid_buff_duration%秒，每次攻击敌方英雄都会施加%lone_druid_counters_applied_tooltip%层叠加效果。被缠绕的英雄无法获得叠加层数。升级这个技能也会升级熊灵的缠绕之爪技能。\n被缠绕的单位将无法使用闪烁类技能，如果进入隐身状态也会显形。\n独行德鲁伊的强化增益和敌人叠加计数减益无法被驱散。\n缠绕的减益效果可以被驱散。\n独行德鲁伊或者熊灵的攻击不会使非英雄单位获得叠加效果，只会在施放缠绕之根时使他们被缠绕。\n对肉山的作用机制和英雄相同。", "b": 2}, {"id": "ba4e558acc3a1c0ae359", "n": "小小·抓树", "m": "tree_destroy", "mz": "砍树", "c": "基础", "d": "有", "why": "新增", "t": "抓起一棵树，使小小在有限次数的攻击里获得攻击距离加成、攻击力加成和溅射攻击。可以将树木扔出，对远距离的敌人造成攻击伤害。\n树木扔出后技能进入冷却。", "b": 2}, {"id": "586f905ce38802c1e2ff", "n": "军团指挥官·决斗", "m": "taunt", "mz": "嘲讽", "c": "基础", "d": "有", "why": "改名", "t": "军团指挥官强制与目标敌方英雄进行决斗，持续短暂的数秒。决斗开始后双方英雄不能使用任何物品，而目标敌方英雄不能使用技能。如果有英雄在决斗期间死亡，赢得决斗的英雄将永久获得攻击力加成。\n如果双方距离超过2000，决斗也会结束。", "b": 1}, {"id": "98d37fea1a274ec7b32d", "n": "邪影芳灵·荆棘迷宫", "m": "channel_interrupt", "mz": "打断持续施法", "c": "基础", "d": "没有", "why": "旧记录", "t": "%initial_creation_delay%秒后邪影芳灵在目标区域创造出%placement_range%范围的迷宫，迷宫拥有%placement_count%棵荆棘。进入荆棘的敌人将被缠绕，并且持续受到伤害。迷宫持续%placement_duration%秒。\n缠绕无法打断持续施法。", "b": 2}, {"id": "125243999aff124e7b3c", "n": "影魔·毁灭阴影", "m": "magic_resist_reduction", "mz": "减魔抗/魔法易伤", "c": "基础", "d": "有", "why": "新增", "t": "影魔对其正前方区域释放毁灭能量，对该区域中的敌人造成伤害，并且根据当前支配死灵的灵魂数量造成额外伤害。在目标身上施加一个连中效果，持续时间内再被毁灭阴影击中将受到额外伤害。\n连中效果的持续时间在每次连中时刷新。", "b": 2}, {"id": "a7590c3036288c31ecbe", "n": "伐木机·喷火装置", "m": "slow", "mz": "减速", "c": "魔晶", "d": "有", "why": "旧记录", "t": "伐木机向面朝的方向放出一道火焰。施加一个负面效果，造成每秒伤害，并减缓敌人的移动速度。对建筑造成的伤害有所减少。", "b": 2}, {"id": "7f24a6de61973a3fb22a", "n": "痛苦女王·痛苦尖叫", "m": "invisibility", "mz": "隐身", "c": "基础", "d": "没有", "why": "旧记录", "t": "痛苦女王发出刺耳的尖叫，对周围敌人造成伤害。造成伤害的%damage_reflected_to_self%%%会反弹回她身上。\n痛苦尖叫能作用隐身单位。\n痛苦尖叫无法被躲避。\n对幻象造成的伤害不会反弹。反弹的伤害为减免前的，而且不致死。\n反弹伤害不提供任何吸血，而且无法反弹。", "b": 2}, {"id": "48290d2025c0e3586caa", "n": "变体精灵·变形", "m": "self_mobility", "mz": "自身位移", "c": "A杖", "d": "有", "why": "新增", "t": "变形增加多样施法（右键点击技能栏图标）。开启后会产生目标英雄的强幻象，可以施放英雄的所有基础技能。如果变体精灵切换变形时幻象还存活，他就会摧毁该幻象，并取而代之。\n使自身向敌方目标改变，获得其基础技能，并且基于目标改变自己的主属性。技能持续时间内可以来回切换。\n变体精灵自身及其控制的单位不能作为变形的目标。\n变形不会复制魔晶/神杖类技能，除非变体精灵自身也拥有相应物品。\n不会触发法术反弹。", "b": 2}, {"id": "6c804b220f9516028117", "n": "龙骑士·火焰气息", "m": "attack_damage_reduction", "mz": "减攻击力", "c": "基础", "d": "有", "why": "新增", "t": "向龙骑士的前方喷射出一团火焰，烧灼碰到的敌人，并使其攻击力降低。\n不会触发法术抵抗或法术反弹。", "b": 2}, {"id": "0d53c088227032022bb7", "n": "斯拉达·侵蚀雾霭", "m": "incoming_damage_amp", "mz": "伤害加深", "c": "基础", "d": "有", "why": "旧记录", "t": "削弱敌人的护甲，加深他受到的物理伤害，同时提供目标的真实视域，显示隐身单位。敌方单位将在身后留下水迹。", "b": 2}, {"id": "0d9da2fc109c530b01f7", "n": "玛尔斯·战神迅矛", "m": "stun", "mz": "眩晕", "c": "基础", "d": "有", "why": "旧记录", "t": "玛尔斯以致命的精准掷出他强大的战矛，对击中的每个敌方单位造成伤害。击中的第一个敌方英雄将被战矛刺穿，并被击退。若战矛击中树木、建筑或悬崖，目标将会被钉在上面，并受到眩晕。\n战神迅矛可以击中隐身单位，造成眩晕还使其显形。\n战神迅矛只会将单位从低地钉在地势变高的地方，否则会将他们推下高地。", "b": 2}, {"id": "a15a2fd2ec55b48e53cb", "n": "露娜·月蚀", "m": "ground_zone", "mz": "场地魔法", "c": "A杖", "d": "有", "why": "新增", "t": "露娜可以对友方单位或自身施放月蚀，使月蚀的效果跟随目标，或者对一片区域施放。增加月光数量，减少月蚀持续时间，并且移除单体打击次数上限，月光的产生间隔缩短一半。\n召唤一次月蚀，以她当前技能等级的月光随机打击附近敌人。月光只有伤害效果，不会造成眩晕，而且单一目标只能受到有限次数的打击。月蚀会暂时将白天变为黑夜。\n如果露娜没有升级月光，月蚀将无法造成伤害，但是变为黑夜效果有效。\n露娜阵亡后月光马上中止。\n不能伤害隐身单位。\n每道月光之间都有%beam_interval%秒的间隔。神杖升级后间隔为%beam_interval_scepter%秒。", "b": 2}, {"id": "aa38f3ead3a41e6e06bf", "n": "光之守卫·冲击波", "m": "grant_vision", "mz": "提供视野", "c": "基础", "d": "有", "why": "旧记录", "t": "持续施法 - 引导光的能量，持续施法的时间越长，威力越大。释放后，光波沿直线向前发出，造成伤害并获得沿途的视野。\n在持续施法期间获得的视野不断增大。", "b": 2}, {"id": "9efb19c728c785758c7b", "n": "白银之锋", "m": "phased", "mz": "相位移动", "c": "装备", "d": "有", "why": "新增", "t": "主动：疾影步\n进入隐身直到17秒持续时间结束、或者在此之前攻击或施法。隐身时，移动速度将提升20%，而且可以穿越单位。\n\n破隐一击将额外造成300点物理伤害，同时5秒内目标的被动技能无效，移动速度不会超过200。\n+70 攻击力\n+35 攻击速度", "b": 2}, {"id": "a78aafc67ea7131676dd", "n": "卓尔游侠·精准光环", "m": "aura", "mz": "光环", "c": "基础", "d": "有", "why": "新增", "t": "卓尔游侠根据她自身的当前敏捷和英雄等级获得敏捷加成。附近远程英雄获得%trueshot_agi_bonus_allies_pct%%%敏捷加成。", "b": 2}, {"id": "8c942e6856822d8486b2", "n": "育母蜘蛛·孵化蜘蛛", "m": "summons", "mz": "召唤物", "c": "基础", "d": "有", "why": "新增", "t": "育母蜘蛛将她的卵注入敌人体内，造成伤害和减速，持续%slow_duration%秒。如果目标在感染期间被击杀，卵会孵化成小蜘蛛。\n如果目标在受到此技能后%buff_duration%秒内被杀死，小蜘蛛就会孵化。\n被小蜘蛛杀死的单位会生出额外的小蜘蛛。", "b": 2}, {"id": "98bc1858806feffd8052", "n": "不朽尸王·血肉傀儡", "m": "incoming_damage_amp", "mz": "伤害加深", "c": "基础", "d": "有", "why": "旧记录", "t": "不朽尸王变身为一具令人毛骨悚然的血肉傀儡。在这个状态下，他获得一定百分比的力量加成，移动速度加成，并且攻击附带减速和伤害加深效果，还会产生墓碑的僵尸。", "b": 2}, {"id": "ed8708c1a93bc6b6e5fc", "n": "米波·地卜术", "m": "attack_modifier", "mz": "攻击特效", "c": "基础", "d": "有", "why": "新增", "t": "米波会根据所在地形给予自身和克隆体可叠加的加成效果。每个米波都会给予其他米波自身的加成。如果%tree_radius%范围内有树木，他会获得%tree_regen%点/秒生命恢复。如果他站在土地上，他会获得%dirt_move_speed%%%移动速度加成。如果他在水中，他的攻击会减缓目标%water_move_slow%%%移速，持续%water_slow_duration%秒。\n土地包括所有水之外的地形。", "b": 2}, {"id": "0089401e9b6b57b974fc", "n": "狼人·召狼", "m": "summons", "mz": "召唤物", "c": "基础", "d": "有", "why": "旧记录", "t": "召唤%wolf_count%头精灵狼为狼人战斗。3级精灵狼获得永久隐身，4级精灵狼获得致残技能，20%几率使目标残废，造成每秒8点伤害，并失去60攻击速度，持续4秒。\n使用此技能后原来的狼群将会死亡。", "b": 2}, {"id": "9bd2842206c019346b04", "n": "天怒法师·上古封印", "m": "incoming_damage_amp", "mz": "伤害加深", "c": "基础", "d": "没有", "why": "旧记录", "t": "天怒法师利用上古符文将目标单位封印，目标单位将被沉默，受到魔法伤害时将承受额外伤害。\n减少魔法抗性的效果对非英雄单位无效。", "b": 2}, {"id": "f31589d26927861d3067", "n": "主宰·迅风斩", "m": "self_mobility", "mz": "自身位移", "c": "A杖", "d": "有", "why": "新增", "t": "发动一次短时间的无敌斩，持续%duration%秒。", "b": 2}, {"id": "d83c75852c6beec8061c", "n": "全能骑士·退化光环", "m": "aura", "mz": "光环", "c": "基础", "d": "有", "why": "旧记录", "t": "削弱过于靠近的敌方单位的移动能力，降低其移动速度。\n对减益免疫单位无效。", "b": 2}, {"id": "83eb4ab57cb9cf9bd017", "n": "美杜莎·秘术异蛇", "m": "mana_gain", "mz": "自身回蓝/吸蓝", "c": "基础", "d": "有", "why": "旧记录", "t": "放出一条秘术异蛇在敌人之间跳跃，造成伤害。每次跳跃后伤害和速度都会增加。抵达最后一个目标后，它会返回到美杜莎身上为其恢复魔法值。异蛇会返还所有目标最大魔法值一定百分比的魔法。\n秘术异蛇无法躲避。", "b": 2}, {"id": "ccf8904e825ce46769d8", "n": "卓尔游侠·射手天赋", "m": "pierce_evasion", "mz": "克敌机先", "c": "基础", "d": "有", "why": "旧记录", "t": "卓尔游侠的战斗经验使她有概率发出极其精准高效的箭矢。箭矢将穿透敌人的防御，无视他们的基础护甲。如果%disable_range%范围内有敌方英雄，本技能没有效果。\n射手天赋的触发效果拥有克敌机先。", "b": 2}, {"id": "5a8b2355ff0a483f8b7d", "n": "黯灭", "m": "attack_modifier", "mz": "攻击特效", "c": "装备", "d": "有", "why": "新增", "t": "被动：毁蚀\n物理攻击将降低目标-6点护甲，持续7秒。\n\n被动：灵魂窃取\n黯灭在装备后每次有英雄死于毁蚀效果下就会+2点攻击力，最高为30点。\n护甲降低效果对建筑有效。\n+55 攻击力", "b": 2}, {"id": "627eba2a1ae1344c9d82", "n": "祈求者·阳炎冲击", "m": "summons", "mz": "召唤物", "c": "魔晶", "d": "有", "why": "新增", "t": "阳炎冲击对敌方英雄造成伤害时，该地点会产生当前等级的熔炉精灵。\n向目标区域释放毁灭性的阳炎之光能量，一旦能量着陆，将对区域内的敌人进行灼烧。伤害取决于火元素等级，区域内敌人将平摊所有伤害。\n施放后立即获得目标区域的视野。\n祈求者使用阳炎冲击击杀英雄后，即使不在经验范围内也能获得经验。", "b": 2}, {"id": "8778df9ed2f463121949", "n": "圣剑", "m": "spell_amp", "mz": "法术放大", "c": "装备", "d": "有", "why": "旧记录", "t": "切换：转变\n在25%技能增强加成和%bonus_damage%攻击力加成之间切换。\n\n被动：永恒\n 死亡后掉落，而且无法被摧毁。\n\n当拥有者的队友拾取后，仅在返还给拥有者后才会有效。一旦被敌人拾取，圣剑将不再受此限制，信使无法拾取掉落的圣剑。\n如果圣剑掉落后被拥有者的敌人拾取，那么只有在敌人死亡后才会再次掉落。\n多个圣剑的技能增强不会叠加。\n+100 攻击力", "b": 2}, {"id": "df9e3e7928ef5f27b0ae", "n
