<title>机制抽查第二轮</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700&display=swap">
<style>
/* Layout: sticky progress bar, filters, one column of claims. Each claim leads with what the record says. */
:root{
  --bg:#f3f4f2; --panel:#ffffff; --ink:#1d2421; --muted:#5f6a65; --line:#d9dedb; --soft:#e9edea;
  --accent:#2f6f62; --ok:#2e7d4f; --bad:#b4442f; --unsure:#9a6b10;
  --f-display:"Noto Serif SC","Songti SC",serif; --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917; --panel:#1c2320; --ink:#e3e8e5; --muted:#9aa6a0; --line:#2e3833; --soft:#25302b;
  --accent:#6fbfa9; --ok:#5cc28a; --bad:#e2775f; --unsure:#d9a93f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --panel:#1c2320; --ink:#e3e8e5; --muted:#9aa6a0; --line:#2e3833; --soft:#25302b;
  --accent:#6fbfa9; --ok:#5cc28a; --bad:#e2775f; --unsure:#d9a93f; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--f-display);font-size:1.55rem;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:6px 0 0;max-width:62ch}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-block:1px solid var(--line);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.stat{font-variant-numeric:tabular-nums;font-size:.9rem;color:var(--muted)}
.stat b{color:var(--ink)} .stat .bad{color:var(--bad)} .stat .uns{color:var(--unsure)}
.meter{flex:1 1 140px;height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);width:0}
.save{font-size:.85rem;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tools label{font-size:.88rem;color:var(--muted);display:flex;gap:6px;align-items:center}
select{font:inherit;font-size:.9rem;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);max-width:100%}
.def{margin:0;font-size:.9rem;color:var(--muted);background:var(--soft);padding:8px 10px;border-radius:6px}
.def[hidden]{display:none}
.list{display:flex;flex-direction:column;gap:10px}
.row{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.row[data-v="ok"]{background:color-mix(in srgb,var(--ok) 7%,var(--panel));border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}
.row[data-v="wrong"]{background:color-mix(in srgb,var(--bad) 8%,var(--panel));border-color:var(--bad)}
.row[data-v="unsure"]{background:color-mix(in srgb,var(--unsure) 8%,var(--panel));border-color:var(--unsure)}
.claim{margin:0;font-size:1.02rem;font-weight:500;min-width:0}
.claim .has{color:var(--ok);font-weight:700} .claim .not{color:var(--bad);font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:.78rem;color:var(--muted)}
.meta span{background:var(--soft);border-radius:4px;padding:1px 6px}
.text{margin:0;font-size:.9rem;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.dfn{margin:0;font-size:.82rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.v{font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:5px 16px;cursor:pointer}
.v:focus-visible,select:focus-visible,.more:focus-visible,.why:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.v[aria-pressed="true"][data-k="ok"]{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.v[aria-pressed="true"][data-k="wrong"]{background:var(--bad);border-color:var(--bad);color:var(--panel)}
.v[aria-pressed="true"][data-k="unsure"]{background:var(--unsure);border-color:var(--unsure);color:var(--panel)}
.why{flex:1 1 220px;min-width:0;font:inherit;font-size:.9rem;border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--bg);color:var(--ink)}
.more{font:inherit;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:6px;padding:8px 14px;cursor:pointer;align-self:center}
.empty{color:var(--muted);text-align:center;padding:24px}
</style>
<div class="wrap">
  <header>
    <h1>机制抽查第二轮</h1>
    <p class="lede">这些记录只有两个AI看过，你还没确认。每条看“记录说的对不对”：对就点“对”，不对点“错”并写一句为什么，拿不准点“不确定”。现在先看第一批，看完告诉助手再决定要不要看其余的。已点的会自动保存。说明文字来自游戏数据快照，补丁未核对。</p>
  </header>
  <div class="bar" role="status">
    <span class="stat">已看 <b id="seen">0</b> / <b id="total">0</b>　错 <b class="bad" id="bad">0</b>　不确定 <b class="uns" id="uns">0</b></span>
    <span class="meter" aria-hidden="true"><i id="fill"></i></span>
    <span class="save" id="save">连接中…</span>
  </div>
  <div class="tools">
    <label for="fbatch">范围 <select id="fbatch"><option value="1">第一批</option><option value="">全部</option></select></label>
    <label for="fwhy">来源 <select id="fwhy"></select></label>
    <label for="fmech">机制 <select id="fmech"></select></label>
    <label for="fstate">我的标记 <select id="fstate"><option value="none">未看</option><option value="">全部</option><option value="wrong">错</option><option value="unsure">不确定</option><option value="ok">对</option></select></label>
  </div>
  <p class="def" id="def" hidden></p>
  <div class="list" id="list"></div>
  <button class="more" id="more" type="button" hidden>再显示 30 条</button>
</div>

伤害效果将会消失。\n+25 攻击力\n+35 攻击速度", "b": 1}, {"id": "24b16b9a9ac31cb02ab2", "n": "斯温·风暴之拳", "m": "invulnerable_untargetable", "mz": "无敌/不可选取", "c": "A杖", "d": "没有", "why": "旧记录", "t": "提升施法距离，并且对目标施加弱驱散效果。可以影响无敌目标。设为多样施法（右键点击技能栏图标）后，额外造成%scepter_bonus_damage%点伤害并且斯温会跟随风暴之拳行进。\n斯温用他充满魔力的手套对目标周围内所有敌人造成伤害和眩晕。", "b": 1}, {"id": "9bbb06781c149ade8ded", "n": "死亡先知·驱使恶灵", "m": "healing", "mz": "治疗/回复", "c": "基础", "d": "有", "why": "旧记录", "t": "释放恶灵偷走敌方单位和建筑的生命。恶灵需要回到她身上才能再次攻击。持续时间结束后，死亡先知根据造成的伤害量，获得一定比例的治疗。对建筑造成50%%伤害。持续%abilityduration%秒。\n作用范围代表死亡先知周围的恶灵寻找目标的范围。\n伤害格挡类技能不能减少恶灵伤害。", "b": 1}, {"id": "3e17acecb7ae581b6c61", "n": "马格纳斯·两极反转", "m": "displace_other", "mz": "位移他人", "c": "基础", "d": "有", "why": "旧记录", "t": "马格纳斯改变物质的属性，将附近的敌人拖拽至他的前方，并且以震击对他们造成伤害和眩晕。", "b": 1}, {"id": "0cebfd10b4724713ef62", "n": "蝙蝠骑士·火焰飞行", "m": "tree_destroy", "mz": "砍树", "c": "基础", "d": "有", "why": "旧记录", "t": "蝙蝠骑士飞向天空，从空中留下一道燃烧的尾迹。飞行时，燃烧尾迹会破坏树木，对经过的敌人造成伤害。在火焰飞行持续时间的最后会达到最高移动速度加成。\n火焰飞行期间蝙蝠骑士可以飞越任何单位，树木和不可通行的地形。\n如果蝙蝠骑士在持续时间结束时正好在不可通行的地形上方，那么他将会卡住。\n蝙蝠骑士死亡后火焰效果将继续存在。", "b": 1}, {"id": "94b47077a63bc378209e", "n": "黑暗贤者·复制之墙", "m": "illusions", "mz": "幻象", "c": "基础", "d": "有", "why": "旧记录", "t": "制造一堵扭曲的光墙，对穿过的敌方英雄造成伤害和减速，并复制一个其自身的幻象，幻象由黑暗贤者控制，持续到光墙消失，或者被敌人消灭。\n幻象不会产生幻象。\n每堵光墙同一时间产生的为一名英雄产生的幻象只有一个。", "b": 1}, {"id": "53f3f56ea19e9e899a81", "n": "神谕者·虚妄之诺", "m": "magic_resist_reduction", "mz": "减魔抗/魔法易伤", "c": "基础", "d": "没有", "why": "旧记录", "t": "暂时篡改队友的命运，技能期间受到的任何治疗和伤害效果将在虚妄之诺结束后结算，其中治疗效果结算时效果更强。施放时将移除目标身上大部分的负面状态效果。\n\n驱散类型：强驱散\n伤害和治疗效果虽然被延缓结算，但是结算时依然会考虑护甲和魔法抗性的减免。\n经过延缓的伤害和治疗效果在目标失去本技能效果后立刻结算。", "b": 1}, {"id": "ec22fb2dec33b66fa963", "n": "破晓辰星·天光现世", "m": "healing", "mz": "治疗/回复", "c": "基础", "d": "有", "why": "旧记录", "t": "持续施法 - 破晓辰星在地图上任意友方英雄%max_offset_distance%距离内的一个地点创造一个脉冲效果，并制造持续%daytime_duration%秒的白天。每次脉冲都会对敌人造成伤害，并治疗友军。经过一段短暂时间后，她飞向目标地点，落地时造成额外伤害并眩晕敌人。开始持续施法后，破晓辰星无法中止此技能。\n脉冲间隔为%pulse_interval%秒。\n总飞行时间为%abilitychanneltime%秒持续施法时间 + %airtime_duration%秒飞行时间。\n施放时立刻召回战锤。", "b": 1}, {"id": "8af6e75994dd746bfee4", "n": "凯·回音重斩", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "旧记录", "t": "凯挥舞他的长刀向前沿一条直线斩击%katana_distance%距离，攻击区域内的敌人并施加短暂的%tag_slow%%%减速。经过短暂延迟后，这个区域会被再次攻击。英雄会承受额外伤害。\n会摧毁树木。不会继承分裂效果。", "b": 1}, {"id": "eae234b6510b68039443", "n": "树精卫士·疯狂生长", "m": "phased", "mz": "相位移动", "c": "A杖", "d": "有", "why": "旧记录", "t": "冷却时间降低至%AbilityCooldown%秒。施放疯狂生长时，树精卫士从土壤中汲取力量，他的身体急剧增大，持续%bloom_duration%秒。变大后他会获得相位移动状态，移动速度为固定%movement_speed%，%strength_bonus%%%力量加成，并且拥有在%splash_radius%范围内造成%splash_pct%%%攻击伤害的溅射攻击。\n在树精卫士周围召唤出疯狂生长的伤害性藤条和枝干，造成伤害并且阻止被缠绕的敌人移动、闪烁、进入隐身或攻击。\n效果无视减益免疫，但是在期间获得减益免疫状态将挣脱控制。", "b": 2}, {"id": "4e2c4cbc35e1bb628e01", "n": "拉席克·恶魔敕令", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "旧记录", "t": "使拉席克周围的区域充满魔法性爆炸，对敌方单位和建筑造成纯粹伤害。范围内的敌人越少，他们受到的伤害就越高。\n即使拉席克死亡，爆炸还是会在原地继续。", "b": 1}, {"id": "de26646e62d3277e0925", "n": "魅惑魔女·魅惑", "m": "applies_basic_dispel", "mz": "施加弱驱散", "c": "基础", "d": "有", "why": "旧记录", "t": "魅惑魔女诱惑一个敌人。如果目标是英雄，将被驱散，其移动速度也会被减缓，持续%slow_duration%秒，而魅惑魔女和她的单位攻击目标时拥有额外攻击距离。\n\n如果目标是非英雄单位，魅惑魔女会将其控制，并获得%xp_gain_pct%%%相应的击杀经验。魅惑魔女控制的非英雄单位最多持续%dominate_duration%秒。\n\n驱散类型：弱驱散\n可以转化幻象。", "b": 1}, {"id": "14dd9ce3dd1b757daa9e", "n": "暗影恶魔·威胁", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "没有", "why": "旧记录", "t": "暗影恶魔的攻击会对敌人施加一个可叠加的负面状态，使他们受到的伤害增加，持续%duration%秒。\n破坏会使技能无法施加新的叠加效果。\n破坏不会使现有叠加效果提供的状态失效。", "b": 1}, {"id": "955862ec267e94c44cb8", "n": "虚空假面·时间结界", "m": "reveal", "mz": "显形", "c": "基础", "d": "有", "why": "旧记录", "t": "在时空中创造一个泡状遮罩，将所有位于其中的单位定住，并使虚空假面在其内部来去自如。只有虚空假面和他控制的单位不受影响。在其中的隐形敌人会显形。\n能够定住所有单位和建筑，不论敌我。除了虚空假面控制的单位。\n虚空假面不受任何时间结界的影响。", "b": 1}, {"id": "bf41b4bad88cfa31add5", "n": "斯拉克·深海护罩", "m": "invisibility", "mz": "隐身", "c": "魔晶", "d": "有", "why": "新增", "t": "在目标地点创造一团云雾。作用范围内所有友军为隐藏状态，受到暗影之舞的作用。", "b": 2}, {"id": "3d1171b27687880db137", "n": "远古冰魄·冰霜漩涡", "m": "grant_vision", "mz": "提供视野", "c": "基础", "d": "有", "why": "旧记录", "t": "创造一个寒冰能量的漩涡，对范围内敌人造成伤害和减速，并增加他们受到的魔法伤害。\n提供放置地点的小片视野。", "b": 1}, {"id": "e0d2b7238c38a611b028", "n": "力丸·背刺", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "没有", "why": "旧记录", "t": "力丸每次从背后攻击敌人时都会造成额外伤害，伤害量为自身敏捷的一定倍数。\n反补友方单位时具有%ally_multiplier%%%效果。\n力丸的幻象也会有背刺的动作，但是不会造成额外伤害。", "b": 1}, {"id": "e60526c65cf37968fa41", "n": "水晶室女·冰晶克隆", "m": "projectile_dodge", "mz": "躲避弹道", "c": "魔晶", "d": "有", "why": "旧记录", "t": "向一个方向滑行，在原地制造一个自身的冰晶克隆，并且躲避多种飞行过程中的攻击和技能弹道。如果克隆受到了足量伤害，或者超过一定时间都会碎裂，对附近%frostbite_radius%范围内敌人施加冰封禁制。克隆体也可以被水晶室女自身的技能摧毁。", "b": 1}, {"id": "d6b49cdb1d7dde1fcf45", "n": "工程师·活性电击", "m": "charges", "mz": "充能", "c": "基础", "d": "没有", "why": "旧记录", "t": "工程师对友军目标放出电荷，使他们短时间内获得移动速度加成。攻击目标的敌人会受到伤害被暂时缴械，并且受到弱驱散效果。效果结束时，或者用子技能提前引爆后电荷将会爆炸，使范围内所有敌人缴械并受到伤害。", "b": 1}, {"id": "290d7e4e01de99c13a15", "n": "敌法师·法力损毁", "m": "mana_burn", "mz": "烧蓝/法力削减", "c": "基础", "d": "有", "why": "旧记录", "t": "每次攻击损毁目标魔法值，并造成相当于损毁魔法值一定百分比的伤害。\n幻象继承法力损毁的燃烧魔法为%illusion_percentage%%%。", "b": 1}, {"id": "c5926491f59b44de97f8", "n": "森海飞霞·野地奇袭", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "旧记录", "t": "扔出一张网，对区域内靠近树木的敌人造成眩晕。敌人会持续受到伤害并被拖拽到目标区域内最近的树上，并且眩晕期间视野降低至0。\n若树木被摧毁，被影响的单位将解除眩晕。\n野地奇袭不会击中隐身单位。", "b": 1}, {"id": "f120f4d0aaf477d52a38", "n": "剧毒术士·毒蛇撕咬", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "没有", "why": "旧记录", "t": "剧毒术士召唤阿克特克的幼体，把它的毒牙刺入一个敌人，造成魔法伤害，并施加造成每秒伤害的剧毒。目标在感染时发动攻击，他就会再次受到初始伤害。", "b": 1}, {"id": "7566e88da10d3d8eb5ca", "n": "维萨吉·黄泉颤抖", "m": "slow", "mz": "减速", "c": "基础", "d": "有", "why": "新增", "t": "维萨吉吸取目标单位的移动和攻击速度，自身和附近的佣兽获得等量加成。\n两个状态效果是分开驱散的。\n速度加成和目标的速度减少相互独立。\n维萨吉周围%radius%内的佣兽也将获得黄泉颤抖的加成效果。", "b": 1}, {"id": "fc16745f2152b3f49293", "n": "虚无之灵·共鸣脉冲", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "旧记录", "t": "虚无之灵将自己包裹在保护性护盾之中，可以吸收物理伤害，并围绕自身发出一次伤害性脉冲。脉冲每击中一名敌方英雄，护盾的伤害吸收量都会提升。", "b": 1}, {"id": "81a378e37aa9bbc1ea06", "n": "灰烬之灵·献祭心", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "旧记录", "t": "灰烬之灵持续燃烧，时刻对周围所有敌人造成每秒伤害。\n破坏不会使阿哈利姆魔晶升级的残焰继承的献祭心失效。", "b": 1}, {"id": "c0031b6c8af519b99624", "n": "破晓辰星·星破天惊", "m": "slow", "mz": "减速", "c": "基础", "d": "有", "why": "旧记录", "t": "破晓辰星将她的战锤旋转3次，对敌人造成攻击伤害以及额外伤害。最后一次打击时，她将战锤击向地面，对她前方的敌人造成眩晕和伤害。\n破晓辰星在技能持续时间内以%movement_speed%的移动速度行进，并且最后一击后需要%self_stun_duration%秒才能复原。\n连击期间无法施放上界重锤或天光现世。\n此技能不继承分裂效果。\n可以对自身施放来向前移动。\n前两次挥击会减少敌人%swipe_slow%%%移动速度，持续%sweep_stun_duration%秒。", "b": 1}, {"id": "9c836964f546281ee32f", "n": "小小·长大", "m": "displace_other", "mz": "位移他人", "c": "魔晶", "d": "没有", "why": "旧记录", "t": "现在投掷扔出的单位，扔树和树木连掷扔出的树木都会在落地点的更大范围内造成额外伤害和减速效果。\n小小崎岖的身体不断成长，提升了攻击力、移动速度、护甲和投掷的威力，但攻击速度降低。", "b": 2}, {"id": "2637480bb20beec8eda2", "n": "散魂剑", "m": "attack_modifier", "mz": "攻击特效", "c": "装备", "d": "有", "why": "新增", "t": "主动：抑制\n同时驱散佩戴者和目标。敌方目标会被减速4秒，友方目标则会提升移动速度和40%减速抗性，持续4秒。施法者总是会获得友军的加成效果。\n\n移动速度减缓和提升效果在状态持续时间内初始均为100%，并且逐渐减少至0。\n驱散类型：弱驱散\n\n被动：破法\n每次攻击将燃烧目标40点魔法，而且每燃烧一点魔法都会造成1点物理伤害。\n\n幻象不会燃烧魔法。\n+40 敏捷\n+10 智力", "b": 1}, {"id": "6230f88bca0623161ce9", "n": "玛西·过肩摔", "m": "slow", "mz": "减速", "c": "基础", "d": "有", "why": "旧记录", "t": "玛西抓起一个友方或敌方目标，将其轻松地向她身后摔去，敌方目标将受到伤害并被减速。落地区域内所有敌方单位也会受到伤害并被减速。", "b": 1}, {"id": "e1a3f5126d12c05c9124", "n": "凝魂之露", "m": "damage_block", "mz": "护盾/伤害吸收/减伤", "c": "装备", "d": "有", "why": "旧记录", "t": "被动：魔法伤害抵挡\n受到超过75点伤害时自动触发，消耗一点能量并抵挡120点魔法伤害。\n\n自带6点能量。能量耗尽后消失。\n每次受到伤害时最多使用一点能量。\n+0.6 魔法恢复", "b": 1}, {"id": "33de584be781a4240fbe", "n": "石鳞剑士·虚张声势", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "新增", "t": "石鳞剑士先冲向目标地点，再向指示方向上的所有敌人刺出数剑并减速他们。\n\n刺剑有几率触发幸运一击。\n在地雷滚滚期间施放虚张声势将使地雷滚滚提前结束。", "b": 1}, {"id": "f5997d4ab1e14c3f1922", "n": "远古冰魄·冰晶爆轰", "m": "stun", "mz": "眩晕", "c": "魔晶", "d": "有", "why": "旧记录", "t": "冻结击中的敌人，持续时间为当前等级寒霜之足眩晕时间的%cold_feet_stun_duration_pct%%%。\n向地图的任意位置发出爆炸冰球，在冰球飞行时再次施放此技能将使其停下，使所在区域产生毁灭性的冰爆。冰球飞行的距离越长，冰爆影响的范围也将越大。冰爆范围内的所有敌方单位将马上受到大量伤害，而处于冰球飞行路径上的敌方英雄将与冰爆范围内的敌方英雄一同受到寒霜诅咒的作用，持续受到小幅伤害，同时无法恢复生命值。在此期间如果生命值低于一定百分比，该英雄将立刻死亡。\n施放后本技能替换为释放，将使指向球停在目标区域。\n作用范围的大小是%radius_min% + %radius_grow%*指向球的飞行时间，上限为%radius_max%。\n击杀目标的英雄由触发即死的伤害来源决定。\n斩杀效果对幻象无 obility", "mz": "自身位移", "c": "装备", "d": "有", "why": "新增", "t": "主动：钩捕\n对敌人使用时向其发射一支鱼叉，将自身和目标牵引到更近的位置，最多牵引自身与目标之间距离的35%。近战英雄总是将目标牵引至他们的攻击距离。以树木为目标总是会把自身牵引至该树木。\n\n被动：回音一击\n近战攻击可以快速攻击两次。两次攻击都将减缓100%移动速度，第一次持续1秒。回音一击冷却时间：5秒\n+25 攻击力\n+25 力量\n+10 敏捷\n+10 智力\n+2 魔法恢复", "b": 1}, {"id": "53324b0a2329b990f94c", "n": "幽鬼·幽鬼之刃", "m": "ground_zone", "mz": "场地魔法", "c": "基础", "d": "有", "why": "新增", "t": "幽鬼掷出一把匕首，留下一条暗影之径，对路径上的敌人造成伤害并减缓其移动速度。被匕首击中的单位移动时也会留下暗影之径。幽鬼在暗影之径上移速提升，并且可以无视地形移动。\n在离开暗影之径后%dagger_grace_period%秒内碰撞体积依然为0，作为缓冲时间。\n不会触发法术抵抗或法术反弹。", "b": 1}, {"id": "cf575da3bfb39fb8c631", "n": "祸乱之源·魔爪", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "没有", "why": "旧记录", "t": "持续施法 - 抓住一个敌方单位，使其失去行动能力并持续受到大量伤害，同时每%fiend_grip_tick_interval%秒按目标最大魔法值一定比例吸取魔法。", "b": 1}, {"id": "4be5e29300c620d76292", "n": "神谕者·虚妄之诺", "m": "damage_block", "mz": "护盾/伤害吸收/减伤", "c": "基础", "d": "有", "why": "旧记录", "t": "暂时篡改队友的命运，技能期间受到的任何治疗和伤害效果将在虚妄之诺结束后结算，其中治疗效果结算时效果更强。施放时将移除目标身上大部分的负面状态效果。\n\n驱散类型：强驱散\n伤害和治疗效果虽然被延缓结算，但是结算时依然会考虑护甲和魔法抗性的减免。\n经过延缓的伤害和治疗效果在目标失去本技能效果后立刻结算。", "b": 1}, {"id": "a7f024bbec6cb803b77a", "n": "邪影芳灵·仙灵粉尘", "m": "mana_gain", "mz": "自身回蓝/吸蓝", "c": "基础", "d": "有", "why": "旧记录", "t": "邪影芳灵获得额外%hp_regen_amp%%%生命恢复和魔法恢复，而她无法作为目标或无敌时将提升至%hp_regen_amp_out_of_world%%%。", "b": 1}, {"id": "0edf5a8c23fe285c1058", "n": "力丸·刀光谍影", "m": "reveal", "mz": "显形", "c": "基础", "d": "没有", "why": "旧记录", "t": "力丸遁入阴影，变为隐身状态，主动攻击敌人后力丸将会显形。击杀英雄和助攻会提供额外经验。", "b": 2}, {"id": "e475c947b9935002f299", "n": "影魔·毁灭阴影", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "旧记录", "t": "影魔对其正前方区域释放毁灭能量，对该区域中的敌人造成伤害，并且根据当前支配死灵的灵魂数量造成额外伤害。在目标身上施加一个连中效果，持续时间内再被毁灭阴影击中将受到额外伤害。\n连中效果的持续时间在每次连中时刷新。", "b": 1}, {"id": "e1a6a4a93ef7fea6a515", "n": "真视宝石", "m": "reveal", "mz": "显形", "c": "装备", "d": "有", "why": "没再提到", "t": "主动：现形\n显示300范围内的守卫和单位，即使在战争迷雾中也会现形。\n被动：真实视域\n携带者自身和周围友方单位可以看见900范围内的隐形单位和守卫。\n\n被动：永恒\n死亡后掉落，而且不能被摧毁。\n在信使身上时没有实际效果。", "b": 1}, {"id": "43f2a04bb77f9187a346", "n": "马格纳斯·巨角冲撞", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "新增", "t": "马格纳斯向前冲刺，用他巨大的犀角将敌人挑起。被击中的英雄将被拽至终点，然后受到伤害并且移动速度被减缓。根据行进的距离伤害也会提升。\n马格纳斯受到眩晕、妖术或放逐作用时，巨角冲撞都会被打断。", "b": 1}, {"id": "c3ae7bbdeb277d9e5b0e", "n": "殁境神蚀者·责难", "m": "damage_block", "mz": "护盾/伤害吸收/减伤", "c": "基础", "d": "有", "why": "旧记录", "t": "提升殁境神蚀者的最大魔法值。施放后，殁境神蚀者获得全伤害护盾，数值为固定值 + 最大魔法值的一定百分比。", "b": 2}, {"id": "8a538bfdadd8507aa04b", "n": "孽主·侵略大军", "m": "slow", "mz": "减速", "c": "基础", "d": "没有", "why": "旧记录", "t": "友方英雄传送后会临时获得承受伤害降低和移动速度加成。友军通过恶魔之扉传送后会获得%dark_portal_multiplier%倍加成。", "b": 1}, {"id": "3b1d8a8cad9335b06f75", "n": "凯·回音重斩", "m": "slow", "mz": "减速", "c": "基础", "d": "有", "why": "旧记录", "t": "凯挥舞他的长刀向前沿一条直线斩击%katana_distance%距离，攻击区域内的敌人并施加短暂的%tag_slow%%%减速。经过短暂延迟后，这个区域会被再次攻击。英雄会承受额外伤害。\n会摧毁树木。不会继承分裂效果。", "b": 1}, {"id": "77d2ed7e281d9e7ddd09", "n": "坚韧球", "m": "mana_gain", "mz": "自身回蓝/吸蓝", "c": "装备", "d": "有", "why": "旧记录", "t": "+5.5 生命恢复\n+2.25 魔法恢复", "b": 1}, {"id": "1e0dbd116bdab0fbb606", "n": "巨魔战将·战斗专注", "m": "lifesteal", "mz": "吸血", "c": "基础", "d": "有", "why": "旧记录", "t": "巨魔战将释放出强大的战斗专注，强迫自身持续攻击%range%距离内最近的敌方单位，以英雄优先。专注期间不会因伤害而阵亡。提供额外吸血，攻击速度，减速抗性和移动速度。施放时施加弱驱散。 \n\n驱散类型：弱驱散\n巨魔战将在战斗专注作用下仍然可以使用他的物品技能，但是无法执行其他指令。\n斧王的淘汰之刃还是能斩杀巨魔战将。\n巨魔战将会获得目标的视野。", "b": 1}, {"id": "a86141aeb16045f7b7a4", "n": "司夜刺客·法力燃烧", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "没有", "why": "旧记录", "t": "司夜刺客对敌人造成伤害还会燃烧造成伤害一定百分比的魔法。", "b": 1}, {"id": "05eb53a8c18de43c2ff9", "n": "光之守卫·灵魂形态", "m": "healing", "mz": "治疗/回复", "c": "基础", "d": "有", "why": "旧记录", "t": "伊扎洛暂时使身体发光，获得施法距离加成，提升光明速度的移速加成，并且冲击波将由一个单独的灵魂施法，可以治疗友军。", "b": 2}, {"id": "5a7887bf8821c35b95d8", "n": "灰烬之灵·无影拳", "m": "cleave", "mz": "分裂溅射", "c": "基础", "d": "没有", "why": "旧记录", "t": "灰烬之灵以燎原之火的速度横冲直撞，攻击目标区域内所有敌人，随后返回所在位置。对英雄造成额外伤害。\n在施放技能时作用的目标就已决定。\n对目标的攻击每次间隔为%attack_interval%秒。\n炘拥有的攻击特效（如致命一击、重击、分裂、连锁闪电等效果）在技能攻击期间都能生效。\n施放无影拳时间可以使用其他技能和物品。", "b": 1}, {"id": "8941d50136e163c9e14d", "n": "司夜刺客·尖刺外壳", "m": "damage_return", "mz": "反伤", "c": "基础", "d": "有", "why": "旧记录", "t": "激活状态下，尖刺外壳可以反弹并无效化司夜刺客受到的伤害（每个攻击者最多作用一次），同时眩晕攻击者。激活尖刺外壳不会打破复仇的隐身状态。\n\n钻地状态下尖刺外壳施放后将立刻眩晕周围的敌人。\n反弹的伤害与司夜刺客本应受到的实际伤害相同。\n尖刺外壳只有在受到玩家控制来源的伤害后会反弹。\n反弹的伤害与司夜刺客受到的伤害类型相同。\n这个技能造成的伤害被视为反弹伤害。反弹伤害不提供任何吸血，而且无法反弹。", "b": 1}, {"id": "e09074f91dc3dac0faad", "n": "獸·突", "m": "charges", "mz": "充能", "c": "基础", "d": "没有", "why": "旧记录", "t": "獸积蓄力量再向选定方向冲去，将敌人和队友同时击退。敌方单位被撞时受到伤害，并且被眩晕。蓄力时间越长，獸冲的距离越远。\n\n可以随时使用停止指令来中止。", "b": 2}, {"id": "f73991572cc2b2b4507e", "n": "马格纳斯·巨角冲撞", "m": "self_mobility", "mz": "自身位移", "c": "基础", "d": "有", "why": "旧记录", "t": "马格纳斯向前冲刺，用他巨大的犀角将敌人挑起。被击中的英雄将被拽至终点，然后受到伤害并且移动速度被减缓。根据行进的距离伤害也会提升。\n马格纳斯受到眩晕、妖术或放逐作用时，巨角冲撞都会被打断。", "b": 1}, {"id": "c4fd4c8499c55bd3dee4", "n": "力丸·背刺", "m": "attack_modifier", "mz": "攻击特效", "c": "基础", "d": "有", "why": "新增", "t": "力丸每次从背后攻击敌人时都会造成额外伤害，伤害量为自身敏捷的一定倍数。\n反补友方单位时具有%ally_multiplier%%%效果。\n力丸的幻象也会有背刺的动作，但是不会造成额外伤害。", "b": 1}, {"id": "c06466c20ad8f5e8985f", "n": "艾欧·羁绊", "m": "self_mobility", "mz": "自身位移", "c": "基础", "d": "有", "why": "新增", "t": "将艾欧和一个友方单位连接在一起，提高双方的移动速度。当艾欧回复生命或魔法时，连在一起的友军将获得一部分回复效果。距离过远时连接将会断开，也可以主动断开连接。羁绊会减速触碰到的敌人。\n如果羁绊的目标距离艾欧700码以外，艾欧将链接目标并将自己向目标牵引（牵引后相距300码）。\n被羁绊连接的单位回复速度相比更快，艾欧满血时也能回复。\n艾欧的移动速度与羁绊目标一致。", "b": 1}, {"id": "0c1fc43b00620329afb2", "n": "琼英碧灵·越界", "m": "applies_basic_dispel", "mz": "施加弱驱散", "c": "基础", "d": "有", "why": "旧记录", "t": "琼英碧灵变身，成为虚无状态，获得基础攻击力加成和相位移动状态。被动使总是可以攻击虚无状态下的目标，并且她在虚无状态下也能攻击。在她或目标处于虚无时，她的所有攻击伤害均为魔法伤害，她的物理吸血被视为技能吸血。驱散类型：弱驱散\n琼英碧灵在变身期间可以躲避弹道。\n琼英碧灵在变身后无法攻击建筑。", "b": 1}, {"id": "f230fef0de281a2de598", "n": "石鳞剑士·甲盾冲击", "m": "damage_block", "mz": "护盾/伤害吸收/减伤", "c": "基础", "d": "有", "why": "旧记录", "t": "石鳞剑士跃入空中，再落向当前位置的前方地面造成冲击，对范围内所有敌人造成伤害。甲盾冲击只要击中任意敌方英雄，他就能在短时间内获得一定数值的全伤害护盾。\n\n地雷滚滚过程中使用甲盾冲击将会保持前进，并且可以使地雷滚滚跨过地形障碍。", "b": 2}, {"id": "f9c78ee646719b4b8100", "n": "祈求者·熔炉精灵", "m": "summons", "mz": "召唤物", "c": "基础", "d": "有", "why": "旧记录", "t": "祈求者融合火之灼热和冰之坚毅，创造出熔炉精灵。熔炉精灵的攻击力和护甲取决于火元素的等级，攻击距离、持续时间和生命值取决于冰元素的等级。元素的灼热攻击能够熔化敌方英雄的护甲。熔炉精灵的产生数量取决于冰元素和火元素中等级较低的元素。\n施放此技能后原有的熔炉精灵将会死亡。", "b": 1}, {"id": "c811c090bff03c1840a4", "n": "清莲宝珠", "m": "applies_basic_dispel", "mz": "施加弱驱散", "c": "装备", "d": "有", "why": "旧记录", "t": "主动：回音之壳\n对目标单位施加一个外壳，持续5秒，可以将大部分指向性技能反馈给施法者。\n\n拥有外壳的单位依然会受到技能的伤害。\n驱散类型：弱驱散\n中立物品的指向性技能不会触发回音之壳。\n+10 护甲\n+6.5 生命恢复\n+4 魔法恢复\n+250 魔法值", "b": 2}, {"id": "03521db5b47403b2be3e", "n": "虚空假面·时间膨胀", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "新增", "t": "虚空假面将附近所有敌人困在一个时间膨胀场中，技能的冷却都会减慢。施加时每个受困的敌人都会获得一层时间膨胀的叠加效果，每有一个技能处于冷却就再获得一层。每层叠加效果造成每秒伤害，并降低移动速度和攻击速度降低。持续时间在时间结界作用下会暂停。\n不会影响物品的冷却时间。\n效果期间叠加层数还会改变。施放技能后如果技能进入冷却就会提供一层叠加效果。如果技能冷却在时间膨胀期间完成，效果会被移除。", "b": 1}, {"id": "4e9fc7e6ed65ff62757d", "n": "术士·剧变", "m": "slow", "mz": "减速", "c": "基础", "d": "有", "why": "旧记录", "t": "持续施法 - 随施法时间增强的减速气流，还会造成伤害。持续最多%abilitychanneltime%秒。在魔法结束或目标离开生效区域后，敌人仍会被减速%duration%秒。\n减速效果的增加是根据持续施法的时长，而不是敌人在区内停留的持续时间。", "b": 1}, {"id": "3a7a03be38a25ca1b93b", "n": "瘟疫法师·幽魂护罩", "m": "ethereal", "mz": "虚无", "c": "基础", "d": "有", "why": "旧记录", "t": "瘟疫法师步入将生者与死者相隔的领域。散发出一片灵气，减缓周围敌人的移动速度。在这个形态下，瘟疫法师为虚无状态，无法攻击或被攻击，受到的魔法伤害增加，但是生命/魔法恢复效果加强。", "b": 1}, {"id": "923271107564a3d0b582", "n": "獸·踏", "m": "disarm", "mz": "缴械", "c": "基础", "d": "没有", "why": "旧记录", "t": "獸践踏一切。每行进%step_distance%距离就会对獸附近范围内所有敌人造成伤害。伤害量为基础伤害加上獸攻击力的一定系数。獸在技能期间被缴械。", "b": 1}, {"id": "71f759b412a336a1bb93", "n": "Eul的神圣法杖", "m": "mana_gain", "mz": "自身回蓝/吸蓝", "c": "装备", "d": "有", "why": "旧记录", "t": "主动：龙卷风\n使目标单位被卷入龙卷风中，持续2.5秒，并处于无敌状态。只能对敌方单位或自身使用龙卷风。\n\n敌方单位落地后将受到50点魔法伤害。\n驱散类型：弱驱散\n不能对队友使用龙卷风。\n对自己施放龙卷风时无视减益免疫。\n龙卷风可以驱散部分正面和负面状态。\n龙卷风持续时间不受状态抗性影响。\n+10 智力\n+2.5 魔法恢复\n+20 移动速度", "b": 1}, {"id": "eda551798d35d2b80887", "n": "兽王·斯洛姆战鼓", "m": "lifesteal", "mz": "吸血", "c": "A杖", "d": "有", "why": "新增", "t": "兽王或周围他控制的单位攻击敌人都会使他敲下战鼓，对附近单位造成伤害，并且治疗自身和他控制的单位，数值为造成伤害的一定百分比。每次攻击都会降低敲鼓的间隔，%max_stacks%次攻击后降低至最短%min_drum_hit_interval%秒敲击一次。如果没有发动攻击，敲鼓间隔会逐渐变长。使用原始咆哮时自动增加%primal_roar_stacks%层敲鼓叠加效果。", "b": 1}, {"id": "7557fd8b3576d94468e0", "n": "变体精灵·变体打击", "m": "displace_other", "mz": "位移他人", "c": "基础", "d": "有", "why": "旧记录", "t": "用猛烈的水波打击一个敌方单位，将其击退并眩晕，同时造成伤害，伤害量为基础伤害加上变体精灵自身敏捷值乘以伤害系数的额外伤害。如果变体精灵的敏捷比力量高50%%，将采用最高伤害系数。\n\n击退距离和眩晕时间是根据变体精灵的力量值。如果变体精灵的力量比敏捷高50%%，将造成最大击退和眩晕。\n弹道移动速度为%projectile_speed%。", "b": 2}, {"id": "dadd49cfe8fe3bed488f", "n": "维萨吉·陵卫斗篷", "m": "damage_block", "mz": "护盾/伤害吸收/减伤", "c": "基础", "d": "有", "why": "旧记录", "t": "维萨吉产生数层屏障来保护他，降低受到的伤害。每当他受到来自玩家的伤害，就会失去一层屏障，失去的屏障需要一定时间才能恢复。维萨吉的佣兽在%radius%范围内也会受到斗篷的保护，承伤降低的数值取决于维萨吉拥有的层数。\n每次维萨吉受到来自其他玩家的伤害超过最小伤害时，保护层就会移除一层。\n佣兽在维萨吉周围%radius%范围内将获得当前陵卫斗篷的承伤降低效果。\n破坏会使技能无法获得新的叠加效果。\n破坏不会使现有叠加效果提供的加成失效。", "b": 2}, {"id": "e73e6cbfacc20d594012", "n": "昆卡·幽灵船", "m": "aoe_damage", "mz": "范围伤害", "c": "A杖", "d": "有", "why": "没再提到", "t": "幽灵船在目标地点以%fleet_interval%秒的间隔产生%fleet_count%艘船组成的舰队。每艘船现在还会从左舷和右舷发射%num_cannon_volleys%波炮弹，穿过敌人时造成%cannon_ball_damage_pct%%%幽灵船伤害。\n召唤一艘幽灵船驶过战场，直到撞成粉碎，残骸周围的敌人将会因撞击受到伤害并眩晕。被幽灵船碰到的友军会获得2倍效果的统帅朗姆酒。\n幽灵船实际的碰撞范围比船本身大。\n幽灵船的移动速度为%ghostship_speed%。", "b": 1}, {"id": "8773560bca03ce78ac67", "n": "树精卫士·疯狂生长", "m": "pierces_debuff_immunity", "mz": "穿透减益免疫", "c": "基础", "d": "有", "why": "新增", "t": "在树精卫士周围召唤出疯狂生长的伤害性藤条和枝干，造成伤害并且阻止被缠绕的敌人移动、闪烁、进入隐身或攻击。\n效果无视减益免疫，但是在期间获得减益免疫状态将挣脱控制。", "b": 1}, {"id": "7473250f4e4e468f6a3d", "n": "独行德鲁伊·野蛮咆哮", "m": "fear", "mz": "恐惧", "c": "基础", "d": "有", "why": "改名", "t": "独行德鲁伊和熊灵发出野性的咆哮，使周围敌人恐惧，朝自己的基地狂奔。敌人的移动速度将增加%bonus_speed%%%。\n被缠绕的英雄将无法移动。\n与熊灵共享冷却时间。", "b": 1}, {"id": "6e6e7d56a2571b85d2bf", "n": "远古冰魄·寒霜之足", "m": "stun", "mz": "眩晕", "c": "基础", "d": "有", "why": "旧记录", "t": "对一个敌人施加诅咒，造成持续伤害。如果目标没有在%AbilityDuration%秒内远离初始地点走出足够距离，那么将被眩晕并冻在原地。\n每0.5秒造成一次伤害。", "b": 1}, {"id": "bd8413aea7f988c31ab5", "n": "斯拉达·鱼人碎击", "m": "stun", "mz": "眩晕", "c": "基础", "d": "有", "why": "旧记录", "t": "猛击地面，留下一片水洼，对附近敌方单位造成伤害并眩晕。眩晕结束后还会受到减速。", "b": 1}, {"id": "b7e56124d7ab3e1ab610", "n": "圣堂刺客·灵能之刃", "m": "cleave", "mz": "分裂溅射", "c": "基础", "d": "有", "why": "新增", "t": "圣堂刺客锋利的灵能之刃可以穿透敌人，对其正后方的敌方单位造成伤害，并且攻击距离得到提升。每对一个单位造成伤害后，飞溅伤害都会减少一定百分比。\n飞溅伤害可以伤害隐身单位。\n重击等攻击特效只对主目标有效。", "b": 2}, {"id": "f5445b8e60c70df0d461", "n": "巫医·巫毒疗法", "m": "aura", "mz": "光环", "c": "基础", "d": "有", "why": "新增", "t": "巫医集中魔力治疗附近的友军单位，开启巫毒疗法后会持续消耗巫医的魔法。\n治疗间隔为%heal_interval%秒。\n对减益免疫单位有效。", "b": 1}, {"id": "cc20945306a8140ad40d", "n": "瘟疫法师·死神镰刀", "m": "mana_gain", "mz": "自身回蓝/吸蓝", "c": "基础", "d": "有", "why": "旧记录", "t": "眩晕目标敌方英雄，然后造成基于他当前损失生命值的伤害。瘟疫法师击杀敌人后将永久获得生命和魔法恢复。如果目标在死神镰刀效果下死亡，击杀者为瘟疫法师。\n伤害在眩晕结束后结算。", "b": 1}, {"id": "66160ee7518992ef4096", "n": "祸乱之源·虚弱", "m": "attack_damage_reduction", "mz": "减攻击力", "c": "基础", "d": "有", "why": "旧记录", "t": "每秒造成伤害，并且降低敌人的总攻击力和施法距离。", "b": 1}, {"id": "0626eab3217efbc13d36", "n": "巫毒面具", "m": "spell_amp", "mz": "法术放大", "c": "装备", "d": "没有", "why": "旧记录", "t": "被动：技能吸血\n佩戴者每次对敌人造成技能伤害都将根据造成伤害的一定百分比回复生命值。\n纯粹伤害或反弹伤害不会进行治疗。\n+15% 技能吸血", "b": 2}, {"id": "8e1d482127274b54dd9c", "n": "巫妖·寒霜爆发", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "旧记录", "t": "破坏性的寒霜在目标敌方单位身上爆发，造成范围伤害并降低范围内敌人的移动和攻击速度，持续%abilityduration%秒。主要目标所受伤害最高。", "b": 1}, {"id": "d9d874a802da634728d0", "n": "酒仙·余烬佳酿", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "旧记录", "t": "向敌人扔出一个酒桶，对沿途的敌人造成伤害，并在目标地点溅出酒液。路径上和溅酒点的敌人会浸满余烬佳酿，并且被减速。受到魔法或纯粹伤害后还将被点燃。点燃时持续时间增加%extra_duration%秒，并且受到持续伤害。", "b": 2}, {"id": "424ab35fd0905336bc90", "n": "卓尔游侠·霜冻之箭", "m": "slow", "mz": "减速", "c": "A杖", "d": "有", "why": "旧记录", "t": "霜冻之箭现在对敌人施加低温的叠加效果，提升霜冻之箭的伤害，并且每层叠加效果都会降低生命回复。若敌人在低温效果下阵亡，他们将会爆炸，对范围内的敌人造成伤害和减速。\n卓尔游侠在箭矢中附上冰冻效果，减缓敌人的移动速度并造成额外伤害。持续%abilityduration%秒。\n减速的持续时间在下一支冰箭射中后刷新。", "b": 1}, {"id": "386d35341dcd190bd17f", "n": "上古巨神·裂地沟壑", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "旧记录", "t": "上古巨神向前方放出一道不平坦的裂纹。3秒后裂纹塌陷，范围内的单位将被减速，并受到基于他们自身生命最大值的伤害。其中一半伤害为魔法伤害，另一半为物理伤害。", "b": 2}, {"id": "683cd58c9495f3ecab15", "n": "神谕者·天命之雨", "m": "healing", "mz": "治疗/回复", "c": "魔晶", "d": "有", "why": "旧记录", "t": "在目标范围内降下大雨。站在该区域的敌人受到每秒伤害，并且治疗增强被削弱。区域内友军被治疗，并且具有治疗增强效果。", "b": 2}, {"id": "a6c87d8bbb2a856debed", "n": "主宰·剑舞", "m": "critical", "mz": "暴击", "c": "基础", "d": "有", "why": "旧记录", "t": "主宰有一定概率在攻击时触发致命一击。", "b": 2}, {"id": "dc484303cdf1c3d32743", "n": "秘奥闪光", "m": "self_mobility", "mz": "自身位移", "c": "装备", "d": "有", "why": "旧记录", "t": "主动：秘奥闪光\n传送到最远1400距离的位置。\n\n传送后回复250点生命和100点魔法。\n\n受到来自敌方英雄或肉山的攻击时，秘奥闪光将在3秒内无法使用。\n快速点击两次会将自己往己方泉水方向传送。\n+25 智力", "b": 2}, {"id": "ddcedbd69cb7067f1986", "n": "亚巴顿·回光返照", "m": "aoe_damage", "mz": "范围伤害", "c": "A杖", "d": "没有", "why": "旧记录", "t": "提升持续时间。启动回光返照后，亚巴顿附近迷雾缠绕的施法距离内友方英雄受到的伤害超过%ally_threshold_scepter%点时亚巴顿就会自动对其施放迷雾缠绕。\n启动后驱散自身，所有受到的伤害转而产生治疗效果。只要技能不在冷却中，在生命值低于%hp_threshold%点时技能会自动启动。\n\n驱散类型：强驱散\n在亚巴顿受到眩晕作用时依然可以手动开启回光返照，但是受到沉默作用时不可以。不过被沉默时被动效果依然能生效。\n无光之盾在回光返照生效期间不会吸收伤害，因此也不会影响治疗效果。\n破坏会使回光返照无法自动触发。", "b": 2}, {"id": "ff797406f7a21623e873", "n": "斯拉达·侵蚀雾霭", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "没有", "why": "旧记录", "t": "削弱敌人的护甲，加深他受到的物理伤害，同时提供目标的真实视域，显示隐身单位。敌方单位将在身后留下水迹。", "b": 2}, {"id": "3e668ca71dc2b158d38b", "n": "祈求者·冰", "m": "healing", "mz": "治疗/回复", "c": "基础", "d": "有", "why": "旧记录", "t": "允许祈求者掌控冰元素。每个活跃的冰元素会让祈求者获得生命恢复加成。每级冰被动提供额外力量。\n祈求者最多只有3个元素。\n不会打破隐身状态，而且可以在持续施法期间施放。", "b": 2}, {"id": "96c3cfac48af32df3864", "n": "暗影萨满·禽戏", "m": "hp_removal", "mz": "生命移除", "c": "基础", "d": "没有", "why": "旧记录", "t": "受到致死伤害时，暗影萨满会获得强驱散效果，并且以1点生命的小鸡继续存活。受到的伤害将降为零，持续较短时间，并且额外产生若干只小鸡，迷惑敌人。冷却时间会在暗影萨满复活时重置。\n\n驱散类型：强驱散\n无法阻止斧王的淘汰之刃和瘟疫法师的死神镰刀的致死伤害。\n受到的伤害减免效果会阻止生命移除类效果杀死暗影萨满。", "b": 1}, {"id": "79375275ce0868dbdedb", "n": "变体精灵·波浪形态", "m": "invulnerable_untargetable", "mz": "无敌/不可选取", "c": "基础", "d": "有", "why": "旧记录", "t": "变体精灵化为波浪向前涌进，对路径上的敌人造成伤害。变体精灵在波浪形态中是无敌的。", "b": 2}, {"id": "7fae0bcc824ee70becad", "n": "哈斯卡·牺牲", "m": "charges", "mz": "充能", "c": "基础", "d": "没有", "why": "旧记录", "t": "哈斯卡牺牲自己的生命来摧毁敌人的生命，他跃向一个目标，造成目标当前生命值一定百分比的伤害，并且降低目标的移动和攻击速度。哈斯卡在跳跃过程中为减益免疫，并且魔法抗性提升%immunity_resist%%%。\n\n驱散类型：弱驱散\n如果哈斯卡在跳跃时受到控制技能，或目标在0.015秒内移动1400码以上，跳跃就会停止。\n减速效果无视减益免疫。\n牺牲无法被躲避。", "b": 2}, {"id": "35f75304e3c175999533", "n": "卓尔游侠·冰川", "m": "grant_vision", "mz": "提供视野", "c": "魔晶", "d": "有", "why": "旧记录", "t": "卓尔游侠在她脚下创造一片冰山，击退附近的敌人。站在山上的单位会获得飞行视野，而卓尔游侠和她的远程友军会获得攻击距离加成。卓尔游侠站在山上时攻击下方目标时获得额外伤害。山的前面会阻挡视野，并且除了卓尔游侠外无法穿行。施放时不会打断数箭齐发。", "b": 1}, {"id": "02f6eeb1f4f8693dbb93", "n": "水晶室女·冰霜新星", "m": "slow", "mz": "减速", "c": "基础", "d": "有", "why": "旧记录", "t": "召唤具有破坏性的冰爆，降低目标区域内的敌人的移动速度。\n冰霜新星在持续时间内提供目标区域的视野。", "b": 2}, {"id": "54f1ad16ce454ef8fcb9", "n": "酒仙·醉拳", "m": "evasion", "mz": "闪避", "c": "基础", "d": "有", "why": "旧记录", "t": "酒仙可以根据操控的元素来切换拳法。每当酒仙施放技能，他都会进入浸酒状态，拳法的威力提升%brewed_up_bonus%%%，持续%brewed_up_duration%秒。如果他在浸酒状态下又施放了技能，持续时间会延长%brewed_up_duration_extend%秒。浸酒状态结束后，他会进入大醉状态，%hangover_time%秒内无法再次进入浸酒状态。大地拳法 - 获得护甲和魔法抗性加成。狂风拳法 - 获得闪避和移动速度加成。烈火拳法 - 获得攻击速度加成，并且拥有几率造成致命一击伤害。\n与其他闪避效果为非线性叠加。", "b": 1}, {"id": "8354d583976167d5a934", "n": "蝙蝠骑士·烈焰破击", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "旧记录", "t": "投掷一瓶爆炸性的混合物，到达目标地点时爆炸，击退区域内的敌人并造成减速和持续伤害。", "b": 2}, {"id": "479aec447b56b9c163af", "n": "伐木机·锯齿飞轮", "m": "tree_destroy", "mz": "砍树", "c": "基础", "d": "有", "why": "旧记录", "t": "伐木机将主锯刃射向目标区域，锯刃会高速旋转，对周围的敌方单位造成伤害。在锯刃作用范围内的敌方单位每损失最大生命值的%slow_health_percentage%%%，他们的移动速度都会进一步被降低。锯刃在发射和收回的过程中都将造成伤害并砍倒碰到的树木。在发射锯刃后伐木机将无法攻击，同时会持续消耗魔法。\n如果伐木机魔法不足或移动超过%break_distance%距离，锯齿飞轮将会飞回。", "b": 2}, {"id": "8406474c4a8e7d0fbfb9", "n": "斯拉克·海浪短刀", "m": "healing", "mz": "治疗/回复", "c": "基础", "d": "有", "why": "旧记录", "t": "斯拉克用他的海浪短刀划开目标，窃取目标一部分的移动速度、生命恢复和生命回复。这个效果独立叠加。", "b": 2}, {"id": "f24da44b591cf0da6483", "n": "齐天大圣·出神入化", "m": "invulnerable_untargetable", "mz": "无敌/不可选取", "c": "基础", "d": "有", "why": "新增", "t": "齐天大圣可以在猴子猴孙期间变成其中一个猴子猴孙，%transfiguration_duration%秒内取代其位置，无法和其他猴子猴孙相区分，并且在原地留下一个猴子猴孙。变身后齐天大圣为无敌，但是无法攻击或施放技能。", "b": 2}, {"id": "d43351a8c4c1a5bcad22", "n": "亚巴顿·凋零迷雾", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "没有", "why": "旧记录", "t": "对敌人造成伤害时会施加凋零迷雾的负面效果，持续%duration%秒。受作用敌人如果血量低于%hp_threshold_pct%%%，那么生命回复会降低%heal_reduction_pct%%%。", "b": 2}, {"id": "e162ccb1c74ec01ed8cc", "n": "祈求者·急速冷却", "m": "stun", "mz": "眩晕", "c": "基础", "d": "有", "why": "旧记录", "t": "祈求者将敌人的热量抽空，将其降到绝对零度，持续时间取决于冰元素等级。敌人将受到伤害并被短暂冻结，后续攻击会使敌人再次冻结并造成额外伤害。被冻结的频率固定，但是冻结的冷却时间将会随着冰元素等级提高而缩短。\n只有%damage_trigger%点以上的实际伤害才能触发急速冷却。", "b": 2}, {"id": "72b35023b8bfd6c2da1a", "n": "修补匠·机械行军", "m": "healing", "mz": "治疗/回复", "c": "A杖", "d": "有", "why": "旧记录", "t": "机械行军在穿过友方英雄时会施加不可叠加的持续治疗效果。\n征募一支机器人军队，摧毁修补匠周围的敌方单位。\n机器人的产生速率是每秒%machines_per_sec%个。", "b": 2}, {"id": "b129adcf2bbe7543e593", "n": "莱恩·法力吸取", "m": "mana_burn", "mz": "烧蓝/法力削减", "c": "基础", "d": "有", "why": "旧记录", "t": "持续施法 - 引导魔法能量，持续吸取魔法并减缓敌人的移动速度。如果敌人没有魔法剩余，减速效果提升%movespeed_bonus_when_empty_pct%%%。可以对友军施放，给予他们%ally_pct%%%魔法和移动速度。\n阻止英雄进入隐身状态。", "b": 2}, {"id": "98519f015b9933df7bb2", "n": "兽王·原始咆哮", "m": "displace_other", "mz": "位移他人", "c": "基础", "d": "有", "why": "新增", "t": "兽王发出震耳欲聋的咆哮，使目标敌方单位受到伤害并眩晕，同时在兽王和他的猎物之间清出一条通道。通道上的所有单位都被震开，也受到伤害并被降低移动和攻击速度。另外，兽王和他的单位获得%movement_speed%%%移动速度提升，持续%movement_speed_duration%秒。", "b": 1}, {"id": "554460c1683a86c4546d", "n": "半人马战行者·奔袭冲撞", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "旧记录", "t": "半人马战行者带领所有队友向胜利冲锋，所有友方英雄达到极限移动速度，并使踩到的敌人减速。每个敌人只会受到一次踩踏作用，并受到基于半人马战行者力量值的伤害。", "b": 2}, {"id": "c8e179a7dbe95d8752db", "n": "潮汐猎人·重如铁锚", "m": "slow", "mz": "减速", "c": "魔晶", "d": "有", "why": "新增", "t": "潮汐猎人将一只重锚栓到一名敌方英雄身上。被栓到锚上的英雄处于被束缚状态。尝试移动到距离巨锚%chain_length%距离外会导致英雄的移动速度降低至%max_movement_speed%，而且会一直拽着长锚。巨锚承受%attacks_to_destroy%次英雄攻击后会被摧毁。", "b": 2}, {"id": "2b1a4e689fbee2d21ff9", "n": "小小·山崩", "m": "ground_zone", "mz": "场地魔法", "c": "基础", "d": "有", "why": "新增", "t": "用岩石轰炸一块区域，对敌方单位造成短间隔的伤害并眩晕。", "b": 1}, {"id": "ce900b80c5abaad7702f", "n": "巫妖·阴邪凝视", "m": "hypnotize", "mz": "蛊惑", "c": "基础", "d": "有", "why": "改名", "t": "持续施法 - 使一个敌方单位着魔，缓慢走到巫妖与其之间的一点，并吸取其当前魔法值的一定百分比。", "b": 1}, {"id": "11eab0d6c5f286cf1e26", "n": "术士·剧变", "m": "ground_zone", "mz": "场地魔法", "c": "基础", "d": "有", "why": "新增", "t": "持续施法 - 随施法时间增强的减速气流，还会造成伤害。持续最多%abilitychanneltime%秒。在魔法结束或目标离开生效区域后，敌人仍会被减速%duration%秒。\n减速效果的增加是根据持续施法的时长，而不是敌人在区内停留的持续时间。", "b": 1}, {"id": "211a58d6a1e82740da6c", "n": "怪蛇之息", "m": "attack_modifier", "mz": "攻击特效", "c": "装备", "d": "有", "why": "新增", "t": "被动：瘴毒\n攻击会使目标中毒，每秒造成目标2.5%最大生命值的魔法伤害，持续3秒。\n\n被动：多头一体\n远程攻击有30%的概率向非原攻击目标的前方%secondary_target_angle%度角内、攻击距离+150距离内的最多3个附近敌人发射额外弹道。额外弹道造成20 + 75%普通攻击伤害，并且不会触发瘴毒除外的击中效果。主攻击造成20 + 100%普通攻击伤害。\n来自金箍棒、魔龙枪和升级物品的攻击距离加成不会叠加。\n+15 力量\n+30 敏捷\n+25 攻击力\n+150 攻击距离", "b": 1}, {"id": "50a515660cdab4447334", "n": "工程师·雷区标识", "m": "invulnerable_untargetable", "mz": "无敌/不可选取", "c": "A杖", "d": "有", "why": "旧记录", "t": "在指定地点放置警示牌，使作用范围内的感应地雷为无敌状态，并且造成的伤害增加%bonus_mine_damage_pct%%%。同一时间只能存在一个标识。持续%lifetime%秒。敌方英雄进入标识的%trigger_radius%范围内时标识附近整个%aura_radius%范围变成一片雷区，持续%minefield_duration%秒。敌方单位在区域内移动都会受到伤害。雷区持续时间结束后标识会被摧毁。", "b": 2}, {"id": "a2d709554101782b8ea0", "n": "百戏大王·尖刀戏", "m": "slow", "mz": "减速", "c": "基础", "d": "有", "why": "旧记录", "t": "百戏大王向自己精心选择的地点扔出一把匕首。匕首击中敌人会造成即时伤害，短暂减速击中的单位，并且使他们流血。流血的英雄受到基于目标最大生命值一定百分比的每秒伤害，流血的非英雄单位受到每秒固定伤害。", "b": 2}, {"id": "99de86af7293815c5deb", "n": "矮人直升机·追踪导弹", "m": "stun", "mz": "眩晕", "c": "基础", "d": "有", "why": "旧记录", "t": "发射一枚会自动定位目标单位的追踪导弹。导弹发射后持续增加飞行速度，击中目标时造成伤害及眩晕。敌方单位可在导弹接近前将其击落。\n防御塔对导弹造成半额伤害。\n准星效果仅对队友可见。\n导弹会跟随并击中隐身单位。", "b": 2}, {"id": "7875e669b89ce9168b9b", "n": "撼地者·回音击", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "旧记录", "t": "穿过地面的冲击波，伤害敌方单位。每个受到攻击的敌人都会引起伤害附近单位的反射波。英雄本体将引起两次反射。", "b": 2}, {"id": "8feb777e07f755382821", "n": "灰烬之灵·炎阳索", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "旧记录", "t": "灰烬之灵释放出火焰绳索来缠绕附近的敌人，将他们困于原地并每秒造成一定伤害。\n将随机选取炘周围的单位作为目标。\n不能作用于减益免疫或隐身单位。", "b": 2}, {"id": "908fc7aaddf33eb873d8", "n": "巨牙海民·海象神拳！", "m": "attack_modifier", "mz": "攻击特效", "c": "基础", "d": "有", "why": "没再提到", "t": "巨牙海民为他强力的海象神拳做好准备，下一次攻击将会造成额外伤害并暴击，同时将目标打到半空中。\n海象神拳！拥有克敌机先效果。", "b": 1}, {"id": "a7aacf218bd61f669e3e", "n": "凯·猛禽之舞", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "旧记录", "t": "凯进入不可控制的状态，持续%AbilityCastPoint%秒，%invuln_period%秒为无敌状态并获得一次弱驱散效果。如果施法成功完成，凯会对周围发动致命的辐射状斩击，基于目标的最大生命值造成伤害，并且造成伤害的一定百分比会治疗凯。\n斩击非英雄单位或幻象时吸血量减少至%illusion_lifesteal_pct%%%。", "b": 2}, {"id": "e197d030b85b02d402c1", "n": "拉席克·闪电风暴", "m": "summons", "mz": "召唤物", "c": "基础", "d": "没有", "why": "旧记录", "t": "召唤一片闪电风暴攻击目标敌方单位，并跳跃到附近的敌方单位。被攻击的敌人将会被降低移动速度。", "b": 2}, {"id": "2a12cd5b79b0e8f54f5f", "n": "育母蜘蛛·麻痹之咬", "m": "projectile_dodge", "mz": "躲避弹道", "c": "基础", "d": "没有", "why": "旧记录", "t": "育母蜘蛛用毒液削弱敌方单位，使她的攻击带有减速效果，中毒单位的攻击有一定概率落空，并且被攻击时承受额外伤害。\n攻击落空几率与闪避和上下坡丢失叠加。", "b": 2}, {"id": "6f942804be6c5d778675", "n": "米波·超大米波", "m": "slow", "mz": "减速", "c": "A杖", "d": "有", "why": "旧记录", "t": "主米波将%radius%范围内其他米波放到自己的肩膀上。在这个形态下，他会获得其他米波%stats_pct%%%的属性，并且可以把他们扔向敌人，造成伤害和减速。\n\n生效时地之束缚会产生额外的网，身上每只米波都会使忽悠造成额外%poof_damage_factor%%%伤害。", "b": 2}, {"id": "9750ed1f53a955adfc6a", "n": "潮汐猎人·巨浪", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "没有", "why": "旧记录", "t": "召唤一股巨浪攻击一个敌方单位，减速并削弱护甲。", "b": 2}, {"id": "530494e157c454025b40", "n": "末日使者·吞噬", "m": "economy", "mz": "经济经验", "c": "基础", "d": "有", "why": "旧记录", "t": "消化一个敌军或中立生物，获得其特殊技能。开启多样施法（右键点击技能栏图标）后，末日使者不会获得其技能。持续时间与冷却时间相同。\n末日使者将获得该生物的正常金钱，还有技能的额外金钱。\n如果吞噬的单位没有技能，之前获得的技能将会保留。", "b": 2}, {"id": "6e70733c47b0ee690525", "n": "陈·狂热者", "m": "displace_other", "mz": "位移他人", "c": "基础", "d": "有", "why": "新增", "t": "陈复活时都会带着一个狂热者加入战斗，这是近战小兵战士，可以牺牲自己治疗友军，或者对敌人造成伤害。狂热者会获得神圣劝化的加成效果，并且和其他线上近战小兵一样随着游戏时间的增加提升属性，获得额外基础攻击力。狂热者会在陈身边复活。狂热者技能可以主动使用，在%teleport_delay%秒延迟后把控制下的目标单位传送到陈的身边。如果陈是技能的目标，将传送控制的所有单位。受到来自敌方英雄及其单位的伤害会中止传送过程。", "b": 2}, {"id": "c626234831ff795ce762", "n": "恐怖利刃·怵潮", "m": "fear", "mz": "恐惧", "c": "A杖", "d": "有", "why": "改名", "t": "放出一道能量波，朝所有方向向外行进，击中敌方英雄将使其恐惧并造成伤害，同时恐怖利刃短时间内获得魔化状态。", "b": 1}, {"id": "be345af49e66f92b7e4b", "n": "大地之灵·巨石翻滚", "m": "self_mobility", "mz": "自身位移", "c": "基础", "d": "有", "why": "新增", "t": "大地之灵化身为巨石，经过%delay%秒延迟后向目标位置翻滚，对经过的敌人造成伤害和眩晕，伤害值为%damage% + %damage_str%%%力量。如果撞到敌方英雄或自身被眩晕，翻滚都会中止。如果翻滚过程中经过残岩将会大幅提高翻滚距离和速度，造成的眩晕时间更长。\n翻滚时经过残岩会将其摧毁。\n巨石的作用范围为%radius%。\n大地之灵在滚动时无法作为目标，而且无敌。", "b": 1}, {"id": "bf4f15e298f7d4fc6f41", "n": "祈求者·熔炉精灵", "m": "attack_modifier", "mz": "攻击特效", "c": "基础", "d": "有", "why": "新增", "t": "祈求者融合火之灼热和冰之坚毅，创造出熔炉精灵。熔炉精灵的攻击力和护甲取决于火元素的等级，攻击距离、持续时间和生命值取决于冰元素的等级。元素的灼热攻击能够熔化敌方英雄的护甲。熔炉精灵的产生数量取决于冰元素和火元素中等级较低的元素。\n施放此技能后原有的熔炉精灵将会死亡。", "b": 1}, {"id": "6be72cc9fb77189e202a", "n": "秘奥闪光", "m": "healing", "mz": "治疗/回复", "c": "装备", "d": "有", "why": "旧记录", "t": "主动：秘奥闪光\n传送到最远1400距离的位置。\n\n传送后回复250点生命和100点魔法。\n\n受到来自敌方英雄或肉山的攻击时，秘奥闪光将在3秒内无法使用。\n快速点击两次会将自己往己方泉水方向传送。\n+25 智力", "b": 2}, {"id": "42e6f4fa705fa814c834", "n": "灰烬之灵·无影拳", "m": "critical", "mz": "暴击", "c": "基础", "d": "没有", "why": "旧记录", "t": "灰烬之灵以燎原之火的速度横冲直撞，攻击目标区域内所有敌人，随后返回所在位置。对英雄造成额外伤害。\n在施放技能时作用的目标就已决定。\n对目标的攻击每次间隔为%attack_interval%秒。\n炘拥有的攻击特效（如致命一击、重击、分裂、连锁闪电等效果）在技能攻击期间都能生效。\n施放无影拳时间可以使用其他技能和物品。", "b": 2}, {"id": "5fc430c5b04febd92e50", "n": "破晓辰星·星破天惊", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "旧记录", "t": "破晓辰星将她的战锤旋转3次，对敌人造成攻击伤害以及额外伤害。最后一次打击时，她将战锤击向地面，对她前方的敌人造成眩晕和伤害。\n破晓辰星在技能持续时间内以%movement_speed%的移动速度行进，并且最后一击后需要%self_stun_duration%秒才能复原。\n连击期间无法施放上界重锤或天光现世。\n此技能不继承分裂效果。\n可以对自身施放来向前移动。\n前两次挥击会减少敌人%swipe_slow%%%移动速度，持续%sweep_stun_duration%秒。", "b": 2}, {"id": "f7b76ce08801df64d525", "n": "矮人直升机·高射火炮", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "旧记录", "t": "矮人直升机的攻击会击中目标周围一定范围内的所有敌人，持续一定次数的攻击。只有主要目标会受到致命一击等攻击特效。持续%abilityduration%秒或攻击次数耗尽。\n对主目标的攻击距离没有改变。", "b": 2}, {"id": "ee3b8b123a8ecc5c9a96", "n": "修补匠·部署炮塔", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "旧记录", "t": "在目标地点部署3个不可控的炮塔。被炮塔撞击的敌人受到伤害，并向远离落地点的方向推去。如果修补匠被撞击，他也会被推走。部署完毕后，炮塔开始向最近敌方英雄的方向发射导弹。", "b": 2}, {"id": "39fc6a08beb400fb1b2d", "n": "帕克·相位转移", "m": "invulnerable_untargetable", "mz": "无敌/不可选取", "c": "基础", "d": "有", "why": "旧记录", "t": "持续施法 - 帕克暂时将自己转移到另一个位面，从而免疫伤害。\n帕克在相位转移状态下依然具有碰撞体积。\n进行任何动作都会中止相位转移。\n帕克在相位转移状态下无敌。", "b": 2}, {"id": "4c248a562810045cebab", "n": "维萨吉·召唤佣兽", "m": "summons", "mz": "召唤物", "c": "基础", "d": "有", "why": "旧记录", "t": "召唤%familiar_count%只盲眼的佣兽为维萨吉作战。佣兽拥有石像形态技能，可以化为石像，在落地时使敌人眩晕。在石像形态中的佣兽无敌，并且迅速回复生命值。佣兽被击杀时给予高额奖励。\n\n技能可以设为多样施法（右键点击技能栏图标），在%recall_duration%秒后召回维萨吉的佣兽，在此期间佣兽无法攻击或行动。\n施放召唤佣兽后已有的佣兽将会死亡。\n佣兽在维萨吉周围时将获得当前陵卫斗篷的承伤降低效果和黄泉颤抖的加成效果。", "b": 2}, {"id": "3ab35177baf837f220f5", "n": "帕格纳·湮灭专家", "m": "spell_amp", "mz": "法术放大", "c": "基础", "d": "有", "why": "旧记录", "t": "帕格纳可以在持续施法期间施放技能和使用物品。\n\n每摧毁一座防御塔，帕格纳都会获得%tower_scale%%%技能增强。", "b": 2}, {"id": "84d24880a5bdebf0d2a3", "n": "龙骑士·飞龙之怒", "m": "attack_modifier", "mz": "攻击特效", "c": "基础", "d": "有", "why": "新增", "t": "神龙的生命之血提升了龙骑士的技能和物品，使其拥有作用范围加成，并且攻击会对敌方单位造成额外魔法伤害。", "b": 1}, {"id": "4c6ea6af5108086889d3", "n": "狼人·嗥叫", "m": "attack_damage_reduction", "mz": "减攻击力", "c": "基础", "d": "有", "why": "旧记录", "t": "使敌人感到害怕，狼人和精灵狼周围%radius%范围内所有敌人的护甲和攻击力降低。夜晚期间嗥叫的护甲和攻击力降低效果为全地图生效。", "b": 2}, {"id": "b456259083ef131234a1", "n": "艾欧·过载", "m": "healing", "mz": "治疗/回复", "c": "基础", "d": "有", "why": "旧记录", "t": "艾欧获得攻击速度、技能增强和基于最大生命值的生命恢复。如果艾欧和一个友军连接，该单位也会获得过载提供的所有增益效果。", "b": 2}, {"id": "765ef715cd9f15f0f189", "n": "雷泽·等离子场", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "旧记录", "t": "释放一波威力随扩张程度提升的等离子能量场，收缩时也会对经过的敌人造成伤害和减速。距离雷泽越远，伤害和减速越高。等离子场对每个单位造成两次伤害。", "b": 2}, {"id": "ff7561914077b427aa9f", "n": "瘟疫法师·死亡脉冲", "m": "healing", "mz": "治疗/回复", "c": "基础", "d": "有", "why": "旧记录", "t": "瘟疫法师向他的周围释放死亡波纹，伤害敌方单位并治疗友军单位。\n死亡脉冲不能被躲避。", "b": 2}, {"id": "b6bb8e3d07aa5b6e359e", "n": "天涯墨客·墨涌", "m": "stun", "mz": "眩晕", "c": "基础", "d": "有", "why": "旧记录", "t": "天涯墨客将一个友方单位笼罩在一片墨汁中，目标的移动速度得到提升。友方单位附近的敌人会持续被墨须伤害。%buff_duration%秒后将根据墨须对英雄造成伤害的时间对区域内单位造成伤害和眩晕。", "b": 2}, {"id": "86874a65f57f2adf3663", "n": "宙斯·雷击", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "没有", "why": "旧记录", "t": "召唤一道闪电打击一个敌方单位，造成伤害及短暂眩晕。施放后，雷击在目标周围%sight_radius_night%范围内提供空中视野和真实视域。本技能可以对地施放，将会自动作用于%spread_aoe%范围内最近的敌方英雄上。\n该技能可以打断持续施法类技能和物品。", "b": 2}, {"id": "1aabb5c6eda559d4b980", "n": "蝴蝶", "m": "evasion", "mz": "闪避", "c": "装备", "d": "有", "why": "旧记录", "t": "与其他闪避效果为非线性叠加。\n+30 敏捷\n+35% 闪避\n+20% 基础攻击速度\n+30 攻击力", "b": 2}, {"id": "71d849d8ccf05c5b2d81", "n": "力丸·闪烁突袭", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "没有", "why": "旧记录", "t": "传送到目标背后，如果是敌人对其造成%slow_pct_tooltip%%%短暂减速，并发动一次拥有额外伤害的攻击。", "b": 2}, {"id": "67eb3ee6cf7d991ff786", "n": "远古冰魄·冰霜漩涡", "m": "magic_resist_reduction", "mz": "减魔抗/魔法易伤", "c": "基础", "d": "有", "why": "新增", "t": "创造一个寒冰能量的漩涡，对范围内敌人造成伤害和减速，并增加他们受到的魔法伤害。\n提供放置地点的小片视野。", "b": 2}, {"id": "7e43e0da6cae4bb2375f", "n": "力丸·刀光谍影", "m": "invisibility", "mz": "隐身", "c": "基础", "d": "有", "why": "旧记录", "t": "力丸遁入阴影，变为隐身状态，主动攻击敌人后力丸将会显形。击杀英雄和助攻会提供额外经验。", "b": 1}, {"id": "2cff83895a636b5dcac9", "n": "兽王·原始咆哮", "m": "slow", "mz": "减速", "c": "基础", "d": "有", "why": "旧记录", "t": "兽王发出震耳欲聋的咆哮，使目标敌方单位受到伤害并眩晕，同时在兽王和他的猎物之间清出一条通道。通道上的所有单位都被震开，也受到伤害并被降低移动和攻击速度。另外，兽王和他的单位获得%movement_speed%%%移动速度提升，持续%movement_speed_duration%秒。", "b": 2}, {"id": "6fabf5811136ab0cd899", "n": "痛苦女王·魅魔", "m": "lifesteal", "mz": "吸血", "c": "基础", "d": "有", "why": "旧记录", "t": "所有来源的技能吸血也对纯粹伤害生效。痛苦女王获得技能吸血，与敌人的距离越近效果越强。敌人距离她不到%close_radius%距离时达到最强效果，距离她超过%max_radius%距离时为最弱效果。", "b": 2}, {"id": "8e9ac39f355a4c7d94ef", "n": "卓尔游侠·霜冻之箭", "m": "slow", "mz": "减速", "c": "基础", "d": "有", "why": "旧记录", "t": "卓尔游侠在箭矢中附上冰冻效果，减缓敌人的移动速度并造成额外伤害。持续%abilityduration%秒。\n减速的持续时间在下一支冰箭射中后刷新。", "b": 2}, {"id": "1dc10ae462d78536ecf7", "n": "风暴之灵·残影", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "旧记录", "t": "风暴之灵制造一个充满爆炸性能量的自身残影，会向目标地点走去，持续%abilityduration%秒。如果有人接近就会引爆造成伤害，残影持续%abilityduration%秒。\n残影在技能施放%static_remnant_delay%秒后才能实体化。\n残影在持续时间内拥有顺畅视野。\n残影爆炸将伤害%static_remnant_damage_radius%码作用范围内的单位，但是触发范围是%static_remnant_radius%码。\n可以对自身施放，这样会原地施放。", "b": 2}, {"id": "710b688fad9fd222e5f0", "n": "伐木机·伐木锯链", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "旧记录", "t": "伐木机发射一条锯链，锯链会嵌入第一棵碰到的树里，然后将他拉向那棵树。行进过程中任何碰到的敌方单位都会受到伤害。", "b": 2}, {"id": "bb526c4657c5c475fff2", "n": "干扰者·恶念瞥视", "m": "displace_other", "mz": "位移他人", "c": "基础", "d": "有", "why": "新增", "t": "将目标英雄传送回他%backtrack_time%秒前所在位置。瞬间消灭幻象单位。根据瞥视距离的一定百分比造成伤害，不能超过最大伤害。\n飞行时间由目标的飞行距离决定。", "b": 2}, {"id": "bf2afe0175f7314ed668", "n": "不朽尸王·墓碑", "m": "healing", "mz": "治疗/回复", "c": "基础", "d": "没有", "why": "旧记录", "t": "在目标位置召唤一座墓碑。墓碑会不断在其附近的每个敌方单位身边产生僵尸攻击他们。僵尸拥有死亡渴望技能，使他们的攻击带有减速效果，并且若目标的生命值低于一定百分比，僵尸的攻击和移动速度会提升。\n墓碑免疫技能，但是可以被噬魂治疗。\n僵尸和墓碑均免疫技能。\n如果初始目标死亡或丢失视野，僵尸将会死亡。", "b": 2}, {"id": "627274b3ef8d652009a1", "n": "马格纳斯·长角抛物", "m": "aoe_damage", "mz": "范围伤害", "c": "A杖", "d": "有", "why": "旧记录", "t": "马格纳斯顶起前方的敌人，将其甩在身后。敌人受到伤害，滞空%air_duration%秒并处于眩晕状态，而且落地后还会眩晕一段时间。", "b": 2}, {"id": "f917668bd2b3728f66cd", "n": "自然先知·传送", "m": "damage_block", "mz": "护盾/伤害吸收/减伤", "c": "基础", "d": "有", "why": "旧记录", "t": "传送到地图上任何位置。到达地点后获得一个护盾。\n魔耗和冷却时间都是在技能施放结束后结算。自然先知在施放技能时被打断将不会耗费魔法或使技能进入冷却。\n施法开始后，目标地点将产生视觉特效，对队友和敌人均可见。", "b": 2}, {"id": "9e6f8c526698aaf9bbaa", "n": "全能骑士·纯洁之锤", "m": "healing", "mz": "治疗/回复", "c": "基础", "d": "有", "why": "旧记录", "t": "全能骑士将神圣之力注入他的战锤，使他的攻击距离提升，会根据基础攻击力的一定百分比造成纯粹伤害，并且使目标短时间内被减速。全能骑士会在%heal_duration%秒内回复%heal_pct%%%造成的伤害。", "b": 2}, {"id": "15b44a22ea21450eeb5c", "n": "巨魔战将·狂战士之怒", "m": "attack_modifier", "mz": "攻击特效", "c": "基础", "d": "有", "why": "新增", "t": "近战形态下巨魔战将的攻击有几率触发诱捕，阻止目标移动或使用位移类技能。另外近战形态下还拥有额外移动速度。远程形态下巨魔战将的攻击有几率使目标残废，造成额外伤害，并且降低目标的移动和攻击速度。", "b": 1}, {"id": "7f91f4f53c2bd3936c06", "n": "沙王·地震", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "没再提到", "t": "经过%abilitycastpoint%秒施法前摇后，沙王向地中发送扰动，引起大地剧烈震动。所有范围内的敌人会受到伤害并被减速。每次后续震波都会提高伤害传播半径。\n地震波将以沙王为中心，而不是他施放技能的地点。", "b": 1}, {"id": "0c718360754ffce7c187", "n": "斯拉达·侵蚀雾霭", "m": "invisibility", "mz": "隐身", "c": "基础", "d": "没有", "why": "旧记录", "t": "削弱敌人的护甲，加深他受到的物理伤害，同时提供目标的真实视域，显示隐身单位。敌方单位将在身后留下水迹。", "b": 2}, {"id": "f1fe87b2077a28fbd46e", "n": "斯拉克·突袭", "m": "tree_destroy", "mz": "砍树", "c": "基础", "d": "有", "why": "旧记录", "t": "斯拉克向前跳跃，束缚第一个碰到的英雄并施加能量转移的叠加效果。该单位只能在斯拉克着地点附近的有限范围内移动。\n施放后斯拉克以%pounce_speed%的速度向前跳跃，抓住敌方英雄或跳跃%pounce_distance%距离后停下。\n不能束缚减益免疫单位。\n斯拉克落地点附近的树木将会被摧毁。", "b": 2}, {"id": "88b41a56a2f3da935273", "n": "暗影恶魔·邪恶净化", "m": "slow", "mz": "减速", "c": "基础", "d": "有", "why": "旧记录", "t": "净化目标敌方单位，移除增益魔法效果，并使目标在持续时间内减速。伤害在持续时间结束时计算，在此之前目标单位的移动速度缓慢地恢复。崩裂禁锢中的单位依然可以受到邪恶净化的影响。\n\n驱散类型：弱驱散\n减速效果起始时为%max_slow%%%，然后持续减少至%min_slow%%%。\n邪恶净化的持续时间内将持续移除目标的有益状态。", "b": 2}, {"id": "73fb0eed0327482cc3b6", "n": "光之守卫·炎阳之缚", "m": "slow", "mz": "减速", "c": "基础", "d": "有", "why": "旧记录", "t": "削弱一个敌人的魔法抗性，并施加减速效果，目标移动的距离越长，减速效果越大。", "b": 2}, {"id": "e182e298a1602c8065d7", "n": "凯·翔影之钗", "m": "stun", "mz": "眩晕", "c": "基础", "d": "有", "why": "没再提到", "t": "装备双钗时凯的攻击有几率对敌人造成致命一击。凯可以主动开启技能，使自身被缴械，面朝方向被锁定，招架来自目标方向的攻击和攻击效果，持续%parry_duration%秒。如果有敌方英雄的攻击被招架，该英雄会被眩晕%parry_stun_duration%秒并获得印记，拥有印记的目标被凯攻击时必定会造成致命一击，并且被眩晕。子技能可以用于提前取消招架状态。", "b": 1}, {"id": "ea56ab5e332660f30131", "n": "祈求者·幽灵漫步", "m": "aoe_damage", "mz": "范围伤害", "c": "魔晶", "d": "有", "why": "旧记录", "t": "现在幽灵漫步还会对范围内的敌方英雄施加寒冰之墙的每秒伤害。\n祈求者操纵冰电之力围绕自身，使自己隐形并且获得生命和魔法恢复。各种元素的不平衡导致附近敌人的移动速度被减缓，减速效果取决于冰元素的等级，并使祈求者自身移动速度减缓，减速效果与雷元素等级成反比。\n减速效果对减益免疫状态下的单位无效。", "b": 2}, {"id": "860f41393dbe8d8a5b02", "n": "撼地者·强化图腾", "m": "self_mobility", "mz": "自身位移", "c": "A杖", "d": "有", "why": "新增", "t": "强化图腾可以对地施放，施放后会跳至半空中再降落至目标地点，在目标地点施放强化图腾。双击技能会按原技能施放，不会跳跃。强化图腾拥有分裂效果。\n强化撼地者的图腾，使下次攻击拥有额外攻击力和%bonus_attack_range%攻击距离加成。\n攻击力加成是基于基础攻击力和主属性数值。", "b": 1}, {"id": "9f1f02790b1b50affa4d", "n": "赏金猎人·追踪术", "m": "incoming_damage_amp", "mz": "伤害加深", "c": "基础", "d": "有", "why": "新增", "t": "追踪一个敌方英雄，获得目标的真实视域，使目标受到的伤害增加，同时掌握目标当前携带的金钱数额。如果目标在被追踪期间死亡，赏金猎人和附近友方英雄都将获得若干金钱奖励。施放追踪术不会脱离隐身。\n只要目标在追踪术期间以任何方式死亡，赏金猎人都能获得金钱奖励。\n追踪术效果仅对友方单位可见。\n鼠标移至目标技能栏上方的负面效果图标可以看到目标携带的金钱数额。\n金钱奖励为不可靠金钱。", "b": 2}, {"id": "cfa6553c9756d184ce6d", "n": "米拉娜·月神之箭", "m": "execute", "mz": "斩杀", "c": "基础", "d": "没有", "why": "旧记录", "t": "射出一支绝对精准的箭矢，对第一个击中的敌人造成伤害并眩晕目标。目标距离越远，眩晕时间越长，最短%arrow_min_stun%秒，最长可达%arrow_max_stun%秒。根据箭矢飞行的距离还将对目标额外造成最多%arrow_bonus_damage%点伤害。若击中的是非远古的普通单位，将直接秒杀。\n神箭每飞行150码，中箭后眩晕的持续时间将提高0.5秒，额外伤害增加14点。\n月神之箭可以射中隐身单位。\n流星赶月不会对阿哈利姆神杖升级群星风暴的第二次流星生效。", "b": 1}, {"id": "d154438d3cd758cc332d", "n": "宙斯·雷击", "m": "true_sight", "mz": "真视", "c": "基础", "d": "有", "why": "旧记录", "t": "召唤一道闪电打击一个敌方单位，造成伤害及短暂眩晕。施放后，雷击在目标周围%sight_radius_night%范围内提供空中视野和真实视域。本技能可以对地施放，将会自动作用于%spread_aoe%范围内最近的敌方英雄上。\n该技能可以打断持续施法类技能和物品。", "b": 1}, {"id": "e93d725d6c9f96355323", "n": "斯拉克·突袭", "m": "leash", "mz": "束缚", "c": "基础", "d": "有", "why": "改名", "t": "斯拉克向前跳跃，束缚第一个碰到的英雄并施加能量转移的叠加效果。该单位只能在斯拉克着地点附近的有限范围内移动。\n施放后斯拉克以%pounce_speed%的速度向前跳跃，抓住敌方英雄或跳跃%pounce_distance%距离后停下。\n不能束缚减益免疫单位。\n斯拉克落地点附近的树木将会被摧毁。", "b": 1}, {"id": "2be7fa9e3038221fab49", "n": "斯嘉蒂之眼", "m": "heal_reduction", "mz": "治疗削减", "c": "装备", "d": "有", "why": "旧记录", "t": "被动：霜冻攻击\n攻击对敌方远程目标会减缓-50%移动速度，对敌方近战目标会减缓-25%移动速度。攻击还会降低敌人-25%攻击速度和%restoration_reduction%%生命回复。持续3秒。\n+35 全属性", "b": 1}, {"id": "f575fc1854c49d93603d", "n": "圣堂刺客·折光", "m": "damage_block", "mz": "护盾/伤害吸收/减伤", "c": "基础", "d": "有", "why": "旧记录", "t": "圣堂刺客变得高度难以捉摸，获得一个小型护盾，同时获得攻击力加成。攻击力加成和护盾效果相互独立，并且都是有限次数的效果。如果护盾被摧毁，只要还有能量点数就会再产生一个新的。如果单次伤害超过了剩余的护盾，该次的全部伤害都会被吸收。\n生命移除类伤害将无视折光（也不会减少折光次数）。", "b": 2}, {"id": "3d4a221885b6ea71ebe0", "n": "帕吉·肉钩", "m": "tree_walk", "mz": "穿树", "c": "基础", "d": "没有", "why": "旧记录", "t": "向一个单位或方向射出血腥的肉钩。勾住第一个遭遇的单位，并将它拖到帕吉身边，如果是非远古单位会被秒杀，其他敌方单位则是受到伤害。\n钩中敌人后将打断持续施法类技能。\n肉钩能击中隐身单位。\n肉钩可以穿过树木、地形、建筑、远古生物和肉山。\n肉钩可以拖拽友方单位，不过他们不会受到伤害。\n肉钩可以将神符拖拽至帕吉身旁，并返还肉钩的魔法消耗。", "b": 1}, {"id": "f04fbaf66ca01b34c2ee", "n": "熊战士·激怒", "m": "status_resistance", "mz": "状态抗性", "c": "基础", "d": "有", "why": "旧记录", "t": "乌尔萨进入狂怒状态，承受的伤害降低并获得状态抗性。施放时将移除所受的负面效果。\n\n驱散类型：强驱散", "b": 1}, {"id": "859f6b0366179a8c2088", "n": "狙击手·爆头", "m": "slow", "mz": "减速", "c": "基础", "d": "有", "why": "旧记录", "t": "狙击手提高他的精确度，有一定概率造成%damage%点额外伤害并击退敌人。敌人距离狙击手越近，击退距离越远。爆头会短暂地降低敌人%slow%%%移动和攻击速度。", "b": 2}, {"id": "c153cc0aa5a336c45933", "n": "赏金猎人·暗影步", "m": "invisibility", "mz": "隐身", "c": "基础", "d": "有", "why": "旧记录", "t": "赏金猎人进入隐身，获得移动速度加成，并能够穿越其它单位，直到他攻击或使用技能。破隐一击会短暂眩晕目标。\n开启后不会打断大多数持续施法技能。", "b": 2}, {"id": "a7580336c1c47611bbd2", "n": "巨魔战将·战斗专注", "m": "execute", "mz": "斩杀", "c": "基础", "d": "没有", "why": "旧记录", "t": "巨魔战将释放出强大的战斗专注，强迫自身持续攻击%range%距离内最近的敌方单位，以英雄优先。专注期间不会因伤害而阵亡。提供额外吸血，攻击速度，减速抗性和移动速度。施放时施加弱驱散。 \n\n驱散类型：弱驱散\n巨魔战将在战斗专注作用下仍然可以使用他的物品技能，但是无法执行其他指令。\n斧王的淘汰之刃还是能斩杀巨魔战将。\n巨魔战将会获得目标的视野。", "b": 2}, {"id": "c8c5efa9669ed7ce0320", "n": "剧毒术士·瘴气", "m": "slow", "mz": "减速", "c": "基础", "d": "有", "why": "旧记录", "t": "沿直线射出一个毒液球，碰到的敌人受到初始伤害和持续伤害，并受到减速效果影响。瘴气在持续时间内每3秒造成一次持续伤害。\n瘴气可以致死。\n技能持续时间内每%tick_interval%秒造成一次伤害。\n初始减速效果为%movement_slow%%%，减速效果将逐渐降低。", "b": 2}, {"id": "85d7482a3da61a65dbe1", "n": "狂战斧", "m": "healing", "mz": "治疗/回复", "c": "装备", "d": "有", "why": "新增", "t": "主动：砍伐\n砍伐一根指定树木。\n\n被动：压制\n对非英雄单位进行物理攻击会造成额外伤害，近战英雄为10点，远程英雄为5点。\n\n被动：分裂\n普通攻击时对目标周围最远650距离的锥形区域内敌人造成60%物理伤害。对非英雄单位造成40%物理伤害。（仅近战有效）\n分裂伤害无视减益免疫。\n如果存在多个分裂效果，每个分裂的伤害都会单独计算。\n+50 攻击力\n+7.5 生命恢复\n+2.75 魔法恢复", "b": 1}, {"id": "772e9066d35bdcad2751", "n": "光之守卫·查克拉魔法", "m": "mana_gain", "mz": "自身回蓝/吸蓝", "c": "基础", "d": "有", "why": "旧记录", "t": "恢复目标单位的魔法值，并减少所有冷却中基础技能（非大招）的冷却时间。对自身使用时效果提升%self_bonus%%%。\n查克拉魔法无法减少终极技能的冷却时间。", "b": 2}, {"id": "b2e8032f855707aebe0c", "n": "獸·捶", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "旧记录", "t": "持续施法 - 獸释放出他的怒火，抓起敌方目标，反复将其向地面捶击，对范围内所有敌人造成伤害和短暂眩晕。每次连续击中会造成额外伤害。持续%channel_time%秒。", "b": 2}, {"id": "1ebbfb9e29011e3f6bf2", "n": "工程师·雷区标识", "m": "ground_zone", "mz": "场地魔法", "c": "A杖", "d": "有", "why": "新增", "t": "在指定地点放置警示牌，使作用范围内的感应地雷为无敌状态，并且造成的伤害增加%bonus_mine_damage_pct%%%。同一时间只能存在一个标识。持续%lifetime%秒。敌方英雄进入标识的%trigger_radius%范围内时标识附近整个%aura_radius%范围变成一片雷区，持续%minefield_duration%秒。敌方单位在区域内移动都会受到伤害。雷区持续时间结束后标识会被摧毁。", "b": 1}, {"id": "bb942fa139cf6943fc4f", "n": "赏金猎人·暗影步", "m": "phased", "mz": "相位移动", "c": "基础", "d": "有", "why": "新增", "t": "赏金猎人进入隐身，获得移动速度加成，并能够穿越其它单位，直到他攻击或使用技能。破隐一击会短暂眩晕目标。\n开启后不会打断大多数持续施法技能。", "b": 1}, {"id": "5c22168e04a1b73e1206", "n": "祈求者·幽灵漫步", "m": "mana_gain", "mz": "自身回蓝/吸蓝", "c": "基础", "d": "有", "why": "旧记录", "t": "祈求者操纵冰电之力围绕自身，使自己隐形并且获得生命和魔法恢复。各种元素的不平衡导致附近敌人的移动速度被减缓，减速效果取决于冰元素的等级，并使祈求者自身移动速度减缓，减速效果与雷元素等级成反比。\n减速效果对减益免疫状态下的单位无效。", "b": 2}, {"id": "55dff31c31b4afa8104a", "n": "光之守卫·致盲之光", "m": "tree_destroy", "mz": "砍树", "c": "基础", "d": "有", "why": "旧记录", "t": "一道致盲之光在目标区域闪现，把区域内的单位击退到区域边缘，并造成致盲，使他们的部分攻击不能命中。最短击退距离是在%knockback_duration%秒内击退%knockback_distance%距离。\n落地后受作用单位将摧毁150范围内的树木。", "b": 2}, {"id": "45960c750fa317cc9b04", "n": "蝙蝠骑士·粘性燃油", "m": "incoming_damage_amp", "mz": "伤害加深", "c": "基础", "d": "有", "why": "旧记录", "t": "用粘性油浸透一块区域，蝙蝠骑士的攻击和技能对敌人造成额外伤害，并降低他们的移动速度和转身速率。再次施法可以继续提高伤害，最多叠加%max_stacks%次。每次施放还会造成少量伤害。\n所有来自蝙蝠骑士的伤害均会加深，辉耀，淬毒之珠，影之灵龛和魂之灵瓮除外。\n粘性燃油无需转身即可施放。\n粘性燃油对非英雄单位造成%creep_damage_pct%%%伤害。", "b": 1}, {"id": "331064d8346db5cd5e73", "n": "昆卡·幽灵船", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "没再提到", "t": "召唤一艘幽灵船驶过战场，直到撞成粉碎，残骸周围的敌人将会因撞击受到伤害并眩晕。被幽灵船碰到的友军会获得2倍效果的统帅朗姆酒。\n幽灵船实际的碰撞范围比船本身大。\n幽灵船的移动速度为%ghostship_speed%。", "b": 1}, {"id": "daf98cfe8ab191c92efe", "n": "圣斧", "m": "pierce_evasion", "mz": "克敌机先", "c": "装备", "d": "有", "why": "旧记录", "t": "被动：巫师之刃\n使下次攻击具有克敌机先效果，并且会施加毒素，持续4秒，减缓25%移动速度，并且每秒造成0.75倍智力值的伤害。\n\n被动：法力腐蚀\n攻击会降低敌人20%魔法抗性，持续4秒。\n+40 智力\n+40 攻击速度\n+7 护甲\n+1.5 魔法恢复\n+300 弹道速度", "b": 1}, {"id": "95a0c235fd12d2095549", "n": "军团指挥官·强攻", "m": "applies_strong_dispel", "mz": "施加强驱散", "c": "基础", "d": "有", "why": "旧记录", "t": "移除友方目标单位的负面效果和控制技能，并提升其移动速度和生命恢复，持续一定时间。\n\n驱散类型：强驱散", "b": 1}, {"id": "56a1fe218388a0c94bbf", "n": "帕克·相位转移", "m": "magic_resist_reduction", "mz": "减魔抗/魔法易伤", "c": "魔晶", "d": "没有", "why": "旧记录", "t": "帕克的攻击造成额外魔法伤害。帕克每次施放相位转移时对攻击距离内所有敌人发动一次攻击。\n持续施法 - 帕克暂时将自己转移到另一个位面，从而免疫伤害。\n帕克在相位转移状态下依然具有碰撞体积。\n进行任何动作都会中止相位转移。\n帕克在相位转移状态下无敌。", "b": 2}, {"id": "abb2263fca40693e99e4", "n": "莫尔迪基安的臂章", "m": "healing", "mz": "治疗/回复", "c": "装备", "d": "有", "why": "新增", "t": "开关：邪恶之力\n开启后邪恶之力将提供+35点攻击力、+25点力量和+4点护甲，但每秒失去45点生命值。\n\n开启邪恶之力后生命流失并不会导致死亡，关闭邪恶之力后力量降低也不会导致死亡。\n力量值的变化会影响血量上限和当前生命值，但是不会致死。\n力量的增加将在0.6秒内完成。\n开启或关闭邪恶之力并不会打断持续施法。\n+15 攻击力\n+25 攻击速度\n+6 护甲\n+5 生命恢复", "b": 1}, {"id": "4c87621a12835748de68", "n": "黑暗贤者·普通一拳", "m": "bash", "mz": "重击", "c": "A杖", "d": "有", "why": "新增", "t": "被动技能。使黑暗贤者下次对英雄的攻击具有克敌机先效果，可以打出目标的复制体，并且根据过去%recent_duration%秒内黑暗贤者的移动距离造成伤害和眩晕。移动%max_distance%距离以上将造成最大威力。", "b": 2}, {"id": "3b0064fa126dfcaa28c1", "n": "百戏大王·整蛊垫", "m": "self_mobility", "mz": "自身位移", "c": "基础", "d": "有", "why": "新增", "t": "使用：噗把英雄向前推动%leap_distance%距离。在身后留下一团%fart_cloud_radius%范围的臭云，持续%fart_cloud_duration%秒，使敌人减速%fart_cloud_slow%%%。", "b": 2}, {"id": "5d9d204fe10cde05372c", "n": "虚无宝石", "m": "mana_gain", "mz": "自身回蓝/吸蓝", "c": "装备", "d": "有", "why": "旧记录", "t": "+1.75 魔法恢复", "b": 2}, {"id": "05e74f55c8f13ab5ad12", "n": "琼英碧灵·越界", "m": "ethereal", "mz": "虚无", "c": "基础", "d": "有", "why": "旧记录", "t": "琼英碧灵变身，成为虚无状态，获得基础攻击力加成和相位移动状态。被动使总是可以攻击虚无状态下的目标，并且她在虚无状态下也能攻击。在她或目标处于虚无时，她的所有攻击伤害均为魔法伤害，她的物理吸血被视为技能吸血。驱散类型：弱驱散\n琼英碧灵在变身期间可以躲避弹道。\n琼英碧灵在变身后无法攻击建筑。", "b": 2}, {"id": "cafc6eeea232e6197a6b", "n": "帕格纳·衰老", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "没有", "why": "旧记录", "t": "一个强大的驱逐咒语，能使一个单位进入虚无状态，无法攻击或受到攻击。受作用的友军提升了治疗效果，而受作用的敌军会被减速，并且承受额外魔法伤害。\n只有魔法伤害和纯粹伤害可以作用于处于衰老状态的单位。\n不会对友方单位造成减速。\n可以对幽冥守卫施放。", "b": 2}, {"id": "8bcb15d48587783ec7cf", "n": "凤凰·超新星", "m": "cooldown_reset", "mz": "刷新冷却", "c": "基础", "d": "有", "why": "新增", "t": "凤凰十分乐意终结自己现在的生命来换取重生。将自己变为一颗燃烧的恒星，灼烧附近一大片区域内的敌人。恒星受到敌方英雄一定次数的攻击后将会被摧毁。经过%abilityduration%秒后恒星将会爆炸，眩晕周围所有敌人。而凤凰的生命和魔法值都会回到满状态，并且所有技能的冷却时间都会刷新。\n\n驱散类型：强驱散", "b": 2}, {"id": "6d587fd552acbd5a1bf6", "n": "食人魔魔法师·未精通的火焰爆轰", "m": "aoe_damage", "mz": "范围伤害", "c": "A杖", "d": "没有", "why": "旧记录", "t": "操控一波火焰轰击一个敌方单位，造成%base_damage% + %str_multiplier%倍食人魔力量的伤害并使目标眩晕。魔法消耗为食人魔魔法师当前魔法的%scepter_mana%%%。\n触发多重施法时，两次火焰爆轰之间有%multicast_delay%秒的间隔。", "b": 2}, {"id": "74ab65743d3ca3e5554e", "n": "工程师·活性电击", "m": "damage_return", "mz": "反伤", "c": "基础", "d": "有", "why": "新增", "t": "工程师对友军目标放出电荷，使他们短时间内获得移动速度加成。攻击目标的敌人会受到伤害被暂时缴械，并且受到弱驱散效果。效果结束时，或者用子技能提前引爆后电荷将会爆炸，使范围内所有敌人缴械并受到伤害。", "b": 2}, {"id": "83cd4ca2bb7bb3283e28", "n": "血棘", "m": "pierce_evasion", "mz": "克敌机先", "c": "装备", "d": "有", "why": "旧记录", "t": "主动：灵魂撕裂\n使目标沉默5秒，沉默结束后其间所受伤害的60%将以额外魔法伤害的形式结算。\n\n英雄/非英雄对目标发动攻击会分别额外造成50 / 25点伤害。另外，自身和控制单位对目标发动的所有攻击都拥有克敌机先效果。\n\n被动：穿刺\n每次攻击有40%几率无视闪避并造成额外%passive_proc_damage%点魔法伤害。\n+25 智力\n+70 攻击速度\n+4 魔法恢复\n+20 攻击力", "b": 2}, {"id": "285b9db7e8b17d0dd082", "n": "帕克·梦境缠绕", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "没再提到", "t": "创造一个变化无常的的魔法梦境来困住敌方英雄，对他们造成伤害和束缚。如果被困住的敌方英雄试图挣脱缠绕走出梦境，将因为梦境破碎而受到眩晕和额外伤害。", "b": 1}, {"id": "a61dee3249462a720a26", "n": "疯狂面具", "m": "lifesteal", "mz": "吸血", "c": "装备", "d": "有", "why": "新增", "t": "主动：狂热\n攻击速度提升100，移动速度提升6%/12%（远程/近战），减速抗性提升15%/30%（远程/近战），但是护甲降低7点，并且被沉默。持续6秒。\n\n被动：吸血\n攻击者每次攻击都将根据造成伤害的一定百分比回复生命值。\n+20 攻击力\n+22% 吸血", "b": 1}, {"id": "50db25573576fb654232", "n": "百戏大王·独轮车", "m": "slow", "mz": "减速", "c": "基础", "d": "没有", "why": "旧记录", "t": "使用：上车召唤一辆快速的独轮车并骑上去，持续%mount_duration%秒。上车%damage_grace_period%秒后受到来自敌方英雄的伤害超过%damage_threshold%点会让他下车。撞到树木会将其摧毁，并且独轮车会减速。攻击、使用持续施法类技能或者撞到单位和其他障碍物都会使他下车。", "b": 2}, {"id": "a702ac34624905134bc4", "n": "风之杖", "m": "mana_gain", "mz": "自身回蓝/吸蓝", "c": "装备", "d": "有", "why": "旧记录", "t": "主动：龙卷风\n使目标单位被卷入龙卷风中，持续2.5秒，并处于无敌状态。可以对自身、敌方单位或友方单位使用龙卷风。对自身使用后，自身能使龙卷风以300的移速进行移动。\n\n敌方单位落地后将受到50点魔法伤害。\n驱散类型：弱驱散\n龙卷风可以驱散部分正面和负面状态。\n对自身施放时，龙卷风可以任意移动，移动速度为360。\n龙卷风持续时间不受状态抗性影响。\n+30 移动速度\n+3 魔法恢复\n+35 智力", "b": 2}, {"id": "bbe27ab144f0d9ac4568", "n": "育母蜘蛛·麻痹之咬", "m": "slow", "mz": "减速", "c": "基础", "d": "有", "why": "旧记录", "t": "育母蜘蛛用毒液削弱敌方单位，使她的攻击带有减速效果，中毒单位的攻击有一定概率落空，并且被攻击时承受额外伤害。\n攻击落空几率与闪避和上下坡丢失叠加。", "b": 2}, {"id": "eb0ac311c7f515e54812", "n": "狼人·嗥叫", "m": "armor_reduction", "mz": "减护甲", "c": "基础", "d": "有", "why": "旧记录", "t": "使敌人感到害怕，狼人和精灵狼周围%radius%范围内所有敌人的护甲和攻击力降低。夜晚期间嗥叫的护甲和攻击力降低效果为全地图生效。", "b": 1}, {"id": "de9ad6bcd4810346b3b5", "n": "钢背兽·毛团", "m": "armor_reduction", "mz": "减护甲", "c": "魔晶", "d": "有", "why": "新增", "t": "向目标地点咳出一团满是刺针的毛团。毛团会在该地点爆开，范围内的敌人都将受到多个鼻液叠加效果和单次刺针扫射的作用。", "b": 2}, {"id": "5c308fe3734f20e23852", "n": "孽主·侵略大军", "m": "damage_block", "mz": "护盾/伤害吸收/减伤", "c": "基础", "d": "有", "why": "旧记录", "t": "友方英雄传送后会临时获得承受伤害降低和移动速度加成。友军通过恶魔之扉传送后会获得%dark_portal_multiplier%倍加成。", "b": 2}, {"id": "8d4d3432839aca6e8144", "n": "沉默术士·遗言", "m": "silence", "mz": "沉默", "c": "基础", "d": "有", "why": "旧记录", "t": "向目标施加魔咒，提供目标的视野，并且只要目标施放技能或魔咒消失，目标就会受到伤害并被沉默。根据沉默术士和目标的智力差还将造成额外伤害。\n持续施法类技能在英雄结束施法后触发此技能的效果。", "b": 1}, {"id": "ec2a8791dbd0eed40a86", "n": "兽王·野性之斧", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "旧记录", "t": "兽王投出他的斧头然后召回它们，切开飞过的敌人和树木。每把飞斧对同一个敌人只能击中一次，并且加深来自兽王和其单位的伤害。\n此技能将摧毁树木。", "b": 2}, {"id": "534329d65b9400a2ae53", "n": "狙击手·基恩瞄准镜", "m": "attack_modifier", "mz": "攻击特效", "c": "基础", "d": "有", "why": "新增", "t": "狙击手和目标相距每%bonus_damage_distance%距离，他的攻击都会造成额外伤害。", "b": 1}, {"id": "b002c42f0c2e334448cb", "n": "凯·影武长刀", "m": "root", "mz": "缠绕", "c": "基础", "d": "有", "why": "新增", "t": "长刀的攻击和技能会对敌人施加一个可叠加的持续伤害效果，持续时间内造成原攻击伤害一定百分比的额外伤害。凯可以主动使用技能，刺中目标，阻止他们移动或转身。目标身上的影武长刀效果爆发，使部分叠加数值立刻造成伤害。", "b": 2}, {"id": "b15d11b21fd3feceb970", "n": "恐鳌之心", "m": "healing", "mz": "治疗/回复", "c": "装备", "d": "有", "why": "旧记录", "t": "被动：巨兽之血\n生命恢复提升缺失生命值的1.5%。\n多个巨兽之血的效果不会叠加。\n+40 力量\n+1% 最大生命值恢复", "b": 2}, {"id": "6b754289f1ffec63add1", "n": "哈斯卡·狂战士之血", "m": "healing", "mz": "治疗/回复", "c": "魔晶", "d": "有", "why": "没再提到", "t": "哈斯卡可以消耗一定生命来主动开启狂战士之血，炙疗哈斯卡。进行驱散，然后在一定延迟后回复消耗的生命，并且每驱散一个负面状态，他就会额外回复生命。\n\n驱散类型：弱驱散\n哈斯卡的伤痛赐予他力量，根据他损失的生命值将获得攻击速度、魔法抗性和生命恢复加成。生命恢复为力量的一定百分比。\n加成效果为线性增加，满血时没有加成，%hp_threshold_max%%%生命时达到最大加成。", "b": 1}, {"id": "3f04a48a74a5b176f37b", "n": "剧毒术士·瘟疫守卫", "m": "debuff_immunity", "mz": "减益免疫/技能免疫", "c": "基础", "d": "有", "why": "旧记录", "t": "召唤一个瘟疫守卫来攻击敌方单位和建筑。守卫对魔法免疫。守卫拥有毒刺攻击，效果与毒刺技能的当前等级相同，造成50%的原技能伤害。", "b": 1}, {"id": "71c5ebd37c5944905b21", "n": "殁境神蚀者·神智之蚀", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "旧记录", "t": "释放出一道神智冲击波，伤害数值基于自身与目标的最大魔法值之差。神智之蚀可以作用于星体禁锢中的单位。", "b": 2}, {"id": "331eb59916655a3492d5", "n": "宙斯·神圣一跳", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "没有", "why": "旧记录", "t": "宙斯作出神圣一跳，向前跳跃并震击最近的可见敌人（以英雄优先），造成伤害，并减缓其移动速度、攻击速度。宙斯获得附近%vision_radius%范围的顺畅视野，持续3秒。", "b": 2}, {"id": "8ae253af4fc46e04dba3", "n": "琼英碧灵·越界", "m": "lifesteal", "mz": "吸血", "c": "基础", "d": "没有", "why": "旧记录", "t": "琼英碧灵变身，成为虚无状态，获得基础攻击力加成和相位移动状态。被动使总是可以攻击虚无状态下的目标，并且她在虚无状态下也能攻击。在她或目标处于虚无时，她的所有攻击伤害均为魔法伤害，她的物理吸血被视为技能吸血。驱散类型：弱驱散\n琼英碧灵在变身期间可以躲避弹道。\n琼英碧灵在变身后无法攻击建筑。", "b": 2}, {"id": "76258fed44dd87385dad", "n": "瘟疫法师·幽魂护罩", "m": "slow", "mz": "减速", "c": "基础", "d": "有", "why": "旧记录", "t": "瘟疫法师步入将生者与死者相隔的领域。散发出一片灵气，减缓周围敌人的移动速度。在这个形态下，瘟疫法师为虚无状态，无法攻击或被攻击，受到的魔法伤害增加，但是生命/魔法恢复效果加强。", "b": 2}, {"id": "86693527deacb8dbf6d2", "n": "裂魂人·威吓", "m": "self_mobility", "mz": "自身位移", "c": "基础", "d": "没有", "why": "旧记录", "t": "裂魂人获得移动速度和状态抗性加成，在敌人之间横冲直撞。可以在冲刺期间使用。", "b": 2}, {"id": "ef40753c99fc48615528", "n": "帕吉·肉钩", "m": "channel_interrupt", "mz": "打断持续施法", "c": "基础", "d": "有", "why": "旧记录", "t": "向一个单位或方向射出血腥的肉钩。勾住第一个遭遇的单位，并将它拖到帕吉身边，如果是非远古单位会被秒杀，其他敌方单位则是受到伤害。\n钩中敌人后将打断持续施法类技能。\n肉钩能击中隐身单位。\n肉钩可以穿过树木、地形、建筑、远古生物和肉山。\n肉钩可以拖拽友方单位，不过他们不会受到伤害。\n肉钩可以将神符拖拽至帕吉身旁，并返还肉钩的魔法消耗。", "b": 2}, {"id": "b60b2734f243bec17e90", "n": "狼人·饿狼撕咬", "m": "lifesteal", "mz": "吸血", "c": "A杖", "d": "有", "why": "旧记录", "t": "狼人撕咬友方英雄或类英雄单位，使其获得变身效果。自身和目标都获得%lifesteal_percent%%%吸血效果，并且双方距离只要不超过%lifesteal_range%就能共用吸血效果。\n饿狼撕咬的冷却时间与变身的当前等级相同。", "b": 2}, {"id": "8eeb285b63634691aa73", "n": "帕吉·肢解", "m": "stun", "mz": "眩晕", "c": "基础", "d": "有", "why": "新增", "t": "持续施法 - 帕吉撕咬一个敌方单位，使其失去行动能力并受到持续伤害。伤害量为基础伤害加上帕吉力量值的一定百分比，帕吉将回复与伤害量相等的生命。帕吉会将该单位以每秒%pull_units_per_second%的速度向自身牵引，最多牵引%pull_distance_limit%距离。\n即使肢解的目标在受到作用的过程中隐身，还是不会脱离肢解的作用。", "b": 1}, {"id": "9a53b4a2b8c83de80b2a", "n": "精之灵器", "m": "spell_reflect", "mz": "反弹指向技能", "c": "装备", "d": "没有", "why": "旧记录", "t": "主动：灵魂释放\n对友方单位施放时提供40点/秒生命恢复。\n\n可以对地面施放，使其潜伏最多15秒并附着在第一个进入450范围的敌人。对敌方单位施放时造成25点每秒伤害，并且提供敌人的真实视域，与佩戴者全队共享他们的视野。\n\n持续8秒。\n\n每次1500范围内有敌方英雄阵亡时获得能量。\n点数为0的灵器将获得2点能量。\n只有距离阵亡英雄最近的精之灵器才会获得一点能量。\n如果友方单位被敌方英雄或肉山攻击，效果将会消失。\n不会触发法术抵抗或法术反弹。\n潜伏时提供450范围的视野。附着后视野还会粘滞0.5秒。\n+1.5 魔法恢复\n+3 全属性\n+6 护甲\n+150 魔法值", "b": 1}, {"id": "63defe613403c8e51d4a", "n": "瘟疫法师·死神镰刀", "m": "stun", "mz": "眩晕", "c": "基础", "d": "有", "why": "旧记录", "t": "眩晕目标敌方英雄，然后造成基于他当前损失生命值的伤害。瘟疫法师击杀敌人后将永久获得生命和魔法恢复。如果目标在死神镰刀效果下死亡，击杀者为瘟疫法师。\n伤害在眩晕结束后结算。", "b": 2}, {"id": "b3005f2ae0c6c206f0d3", "n": "冥界亚龙·毒性攻击", "m": "magic_resist_reduction", "mz": "减魔抗/魔法易伤", "c": "基础", "d": "有", "why": "旧记录", "t": "蝮蛇的毒液得到强化，使他的普通攻击附带效果，可以降低目标的移动速度和魔法抗性，并持续造成伤害。效果可以叠加，最多叠加%max_stacks%次。", "b": 2}, {"id": "b4ec2293dbbf1cd692d6", "n": "亚巴顿·无光之盾", "m": "aoe_damage", "mz": "范围伤害", "c": "魔晶", "d": "有", "why": "没再提到", "t": "会对附近敌人造成吸收伤害的%absorb_to_damage%%%。\n召唤黑暗能量环绕友方单位，驱散他们并创造一个全伤害护盾，护盾在消失前能吸收一定量的伤害。护盾消失或被摧毁后将会爆炸，对附近区域的单位造成伤害，伤害值为护盾的最大吸收量。\n\n驱散类型：强驱散\n不论护盾因持续时间结束或吸收足够伤害后被摧毁都将造成最大伤害。\n爆炸将不会对战争迷雾内单位造成伤害。", "b": 1}, {"id": "d287073f662d4446969d", "n": "孽主·衰退光环", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "没有", "why": "旧记录", "t": "周围所有敌方单位遭到了削弱，损失部分基础攻击力。如果敌方英雄在光环范围内死亡，孽主将获得临时的额外攻击力加成。\n破坏会使攻击力降低光环失效，并且孽主无法获得新的额外攻击力。", "b": 2}, {"id": "219de89bd701222a1425", "n": "沙王·沙尘暴", "m": "reveal", "mz": "显形", "c": "基础", "d": "没有", "why": "旧记录", "t": "沙王制造一起可怕的沙尘暴，对敌方单位造成伤害，同时沙王身处其中时获得隐身效果。沙王离开该区域后效果结束。\n沙尘暴可以用来躲避攻击和技能弹道。\n沙王在沙尘暴中攻击或使用技能会暂时显形。%fade_delay%秒后将再次隐形。", "b": 2}, {"id": "fe3d859482000c1e8afe", "n": "魅惑魔女·魅惑", "m": "slow", "mz": "减速", "c": "基础", "d": "有", "why": "旧记录", "t": "魅惑魔女诱惑一个敌人。如果目标是英雄，将被驱散，其移动速度也会被减缓，持续%slow_duration%秒，而魅惑魔女和她的单位攻击目标时拥有额外攻击距离。\n\n如果目标是非英雄单位，魅惑魔女会将其控制，并获得%xp_gain_pct%%%相应的击杀经验。魅惑魔女控制的非英雄单位最多持续%dominate_duration%秒。\n\n驱散类型：弱驱散\n可以转化幻象。", "b": 2}, {"id": "cb9d1072da709b690dc1", "n": "闪烁匕首", "m": "self_mobility", "mz": "自身位移", "c": "装备", "d": "有", "why": "旧记录", "t": "主动：闪烁\n传送到最远1200距离的位置。\n\n受到来自敌方英雄或肉山的攻击时，闪烁匕首将在3秒内无法使用。\n快速点击两次会将自己往己方泉水方向传送。", "b": 2}, {"id": "5e8673dd60d2b8533e68", "n": "魅惑魔女·跃动", "m": "attack_modifier", "mz": "攻击特效", "c": "魔晶", "d": "有", "why": "新增", "t": "向后跳跃，躲避多种飞行过程中的攻击和技能弹道，并向魅惑魔女的攻击距离+%bonus_attack_range%范围内最远的%attack_targets%个敌方单位发动一次附有推进的攻击。", "b": 2}, {"id": "271d6509804040d3f507", "n": "冥界亚龙·腐蚀皮肤", "m": "aoe_damage", "mz": "范围伤害", "c": "A杖", "d": "没有", "why": "旧记录", "t": "腐蚀皮肤会对距离冥界亚龙%effect_multiplier_distance%范围内的敌人施加%effect_multiplier%倍攻击速度降低效果。当冥界亚龙处于幽冥剧毒中，腐蚀皮肤的魔法抗性和每秒伤害会逐渐提升，在%nethertoxin_bonus_pct_max_duration_tooltip%秒后，达到最高的%nethertoxin_bonus_pct%%%提升。\n蝮蛇分泌出感染性的毒素，%max_range%范围内任何伤害它的敌人都将受到伤害，同时攻击速度也被降低。这种酸性分泌物还能提高蝮蛇的魔法抗性。\n与其他提升魔法抗性的物品和技能叠加。\n破坏会使腐蚀皮肤不再施加效果。极恶俯冲还是会施加腐蚀皮肤。\n这个技能造成的伤害被视为反弹伤害。反弹伤害不提供任何吸血，而且无法反弹。", "b": 2}, {"id": "f6370798bc25fafaa55e", "n": "吸血面具", "m": "healing", "mz": "治疗/回复", "c": "装备", "d": "有", "why": "旧记录", "t": "被动：吸血\n攻击者每次攻击都将根据造成伤害的一定百分比回复生命值。\n+18% 吸血", "b": 2}, {"id": "12fc197412ac42cbd4b5", "n": "虚无之灵·残阴", "m": "aoe_damage", "mz": "范围伤害", "c": "魔晶", "d": "有", "why": "旧记录", "t": "额外产生一道观察路径，会围绕残阴旋转。残阴现在会提供真实视域，不再对非英雄单位触发，而是每秒在两道路径上造成%creep_damage_pct%%%伤害。不会使守卫显形。\n虚无之灵向目标地点派出一个残像。残像观察着一片区域，面朝矢量的方向。当有目标进入其视线，残像会拉扯，并造成伤害。", "b": 2}, {"id": "b885fa58f7f8c6d2de54", "n": "酒仙·元素分离", "m": "summons", "mz": "召唤物", "c": "基础", "d": "有", "why": "旧记录", "t": "酒仙分裂成元素，产生3个各有所长的战士，生存能力极强，每个都拥有独特技能。只要其中任何一个在召唤时间结束后存活下来，酒仙就能重生。每个战士都会获得对应的醉拳拳法。\n大地战士将继承酒仙的所有光环，以及真视宝石的真视效果。\n烈火战士拥有相位移动的能力。\n技能结束后，酒仙会根据大地→狂风→烈火的顺序选择未阵亡的元素重生。", "b": 2}, {"id": "c5f1ca07b7f79cd629c7", "n": "光之守卫·灵光", "m": "hypnotize", "mz": "蛊惑", "c": "A杖", "d": "有", "why": "改名", "t": "在目标区域召唤幻火。幻火交替闪亮和闪灭。闪亮时蛊惑敌人靠近，并造成伤害。\n幻火会对作用范围内所有敌人施加朝其牵引的效果，该牵引效果不会打断。", "b": 1}, {"id": "a91647e73c37767c1b29", "n": "龙骑士·火焰气息", "m": "spell_block", "mz": "格挡指向技能", "c": "基础", "d": "没有", "why": "旧记录", "t": "向龙骑士的前方喷射出一团火焰，烧灼碰到的敌人，并使其攻击力降低。\n不会触发法术抵抗或法术反弹。", "b": 2}, {"id": "8752c56f8b460a9c31ff", "n": "噬魂鬼·盛宴", "m": "attack_modifier", "mz": "攻击特效", "c": "基础", "d": "有", "why": "新增", "t": "噬魂鬼每次攻击时还会根据目标最大生命值的一定百分比造成伤害，同时获得治疗。每次击杀单位他都会获得永久生命上限。\n对友军和敌人有效。对肉山无效。\n回复量与造成伤害相互独立。\n破坏会使技能无法获得新的叠加效果。\n破坏不会使现有叠加效果提供的加成失效。", "b": 2}, {"id": "c9af25f571143a4863c8", "n": "灰烬之灵·献祭心", "m": "aura", "mz": "光环", "c": "魔晶", "d": "有", "why": "新增", "t": "使残焰获得献祭心，并且每秒伤害和作用范围提升。\n灰烬之灵持续燃烧，时刻对周围所有敌人造成每秒伤害。\n破坏不会使阿哈利姆魔晶升级的残焰继承的献祭心失效。", "b": 1}, {"id": "39fdc2d54291a1e3afff", "n": "自然先知·自然之怒", "m": "self_mobility", "mz": "自身位移", "c": "基础", "d": "没有", "why": "旧记录", "t": "伤害性的能量在全地图跳跃，打击视野中的敌人，会先从距目标点最近的敌人开始打击。每击中一个敌人伤害都会增加，击中%max_targets%个目标后达到最高伤害。\n自然的愤怒只能伤害视野内的单位。\n可以通过点击小地图施放；初始目标将选择施放地点最近的有效单位。", "b": 2}, {"id": "d9684e0833a2ab0c759d", "n": "自然先知·青森诅咒", "m": "aoe_damage", "mz": "范围伤害", "c": "魔晶", "d": "有", "why": "旧记录", "t": "对%range%范围内所有敌方英雄施加诅咒，使他们在迷雾中显形，根据%radius%范围内树木的数量对他们造成减速和持续伤害。在此情况下树人也被视为树木。", "b": 2}, {"id": "60fdfb46c2994a3b6648", "n": "凯·渡鸦之纱", "m": "invisibility", "mz": "隐身", "c": "基础", "d": "有", "why": "旧记录", "t": "凯释放出一阵迷烟，对附近敌方英雄施加标记，暂时削弱他们的视野。凯获得弱驱散效果、移动速度加成和隐身状态，直到他攻击或施法。", "b": 2}, {"id": "da686ce1015b0b340cd4", "n": "哈斯卡·心炎", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "旧记录", "t": "在炽烈的狂暴下将附近所有敌人击退至固定距离外，造成伤害和沉默。", "b": 2}, {"id": "8e21b2c3f6130ad9542a", "n": "全能骑士·洗礼", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "旧记录", "t": "立即治疗一个友方单位，并对周围的敌军造成伤害。", "b": 2}, {"id": "fd60349804f108149ef1", "n": "米拉娜·天界箭袋", "m": "magic_resist_reduction", "mz": "减魔抗/魔法易伤", "c": "基础", "d": "没有", "why": "旧记录", "t": "有可用能量时，米拉娜的下次攻击会造成额外魔法伤害。", "b": 2}, {"id": "f5edf319fd27e21a0888", "n": "朗戈·两栖狂想曲", "m": "disarm", "mz": "缴械", "c": "基础", "d": "没有", "why": "旧记录", "t": "朗戈准备好弹奏乐曲。他被缴械，而他的技能栏切换为3个乐曲技能，每个都有不同的效果。乐曲只有弹在节拍上才会生效。\n\n每次成功弹奏他都会获得一层律动的叠加效果。每层叠加效果都会对他提供额外护甲，并且降低每首乐曲的魔法消耗，但是他只要错过一次节拍就会失去一层叠加效果。叠加效果在朗戈的乐曲结束后还会粘滞一小段时间。\n这个模式下可以使用物品。", "b": 2}, {"id": "32a0afb995839d9e0420", "n": "沙王·地震", "m": "slow", "mz": "减速", "c": "基础", "d": "有", "why": "旧记录", "t": "经过%abilitycastpoint%秒施法前摇后，沙王向地中发送扰动，引起大地剧烈震动。所有范围内的敌人会受到伤害并被减速。每次后续震波都会提高伤害传播半径。\n地震波将以沙王为中心，而不是他施放技能的地点。", "b": 2}, {"id": "d645588e9e187245500e", "n": "天涯墨客·暗绘", "m": "debuff_immunity", "mz": "减益免疫/技能免疫", "c": "A杖", "d": "有", "why": "旧记录", "t": "制造目标敌方英雄的墨色幻象。幻象为减益免疫状态，拥有%immunity_resist%%%魔法抗性，移动速度和继承攻击力超过本体。", "b": 2}, {"id": "658a9736c7a69af95717", "n": "发条技师·能量齿轮", "m": "mana_burn", "mz": "烧蓝/法力削减", "c": "基础", "d": "有", "why": "旧记录", "t": "在发条技师周围形成一圈通电的齿轮，困住附近的单位。在外侧的敌人碰到齿轮会被电流震退，损失一定的生命和魔法。并且%mana_burn_as_damage_pct%%%损失魔法也会加入到伤害。一个齿轮发动过一次震击后就会报废。敌人攻击齿轮数次后可将其摧毁，而发条技师需要攻击一次会将齿轮推出%projectile_distance%距离。发条技师可以自由穿行齿轮，穿行时会使齿轮失效。\n齿轮可以震退隐身单位。", "b": 2}, {"id": "bd5c37ca823c2610e35a", "n": "撒旦之邪力", "m": "healing", "mz": "治疗/回复", "c": "装备", "d": "有", "why": "没再提到", "t": "主动：不洁狂热\n吸血效果提升至175%，持续6秒。\n\n驱散类型：弱驱散\n\n被动：吸血\n攻击者每次攻击都将根据造成伤害的一定百分比回复生命值。\n+25 力量\n+25 攻击力\n+25% 吸血", "b": 1}, {"id": "f7f02017e1ff224dba4f", "n": "拉席克·虚无主义", "m": "ethereal", "mz": "虚无", "c": "A杖", "d": "有", "why": "旧记录", "t": "使拉席克和范围内所有敌人变为虚无状态，他们无法攻击，并且承受的魔法伤害增加，移动速度被减缓。拉席克的移动速度得到提升，而不是减缓。拉席克受到的魔法伤害不会增加。", "b": 2}, {"id": "ac70bba9c3dbe585275a", "n": "斯拉克·海浪短刀", "m": "heal_reduction", "mz": "治疗削减", "c": "基础", "d": "有", "why": "新增", "t": "斯拉克用他的海浪短刀划开目标，窃取目标一部分的移动速度、生命恢复和生命回复。这个效果独立叠加。", "b": 2}, {"id": "b0a3c9f47819e00c6f46", "n": "裂魂人·巨力重击", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "没有", "why": "旧记录", "t": "攻击时有一定概率眩晕并击退敌方单位。重击的伤害值为移动速度的一定百分比。\n不与碎颅锤叠加。\n破坏会使攻击触发巨力重击失效。暗影冲刺或幽冥一击还是会施加巨力重击。", "b": 2}, {"id": "5bf1607d01c6301d23c5", "n": "斯温·巨力挥舞", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "旧记录", "t": "斯温以巨力攻击，并对所有附近的敌方单位造成分裂攻击伤害。", "b": 2}, {"id": "e6625132046a39a0a01e", "n": "天涯墨客·暗绘", "m": "illusions", "mz": "幻象", "c": "A杖", "d": "有", "why": "旧记录", "t": "制造目标敌方英雄的墨色幻象。幻象为减益免疫状态，拥有%immunity_resist%%%魔法抗性，移动速度和继承攻击力超过本体。", "b": 2}, {"id": "08412bee080d79ef71a1", "n": "祈求者·电磁脉冲", "m": "mana_gain", "mz": "自身回蓝/吸蓝", "c": "基础", "d": "有", "why": "旧记录", "t": "祈求者在指定位置召唤出一道强力的自爆电磁脉冲，%delay%秒后将自动爆炸。爆炸将覆盖一定区域，并根据雷元素的等级损毁敌方的魔法值。对敌方英雄造成损毁魔法值一定百分比的伤害。祈求者将获得%self_mana_restore_pct%%%损毁的魔法。\n对被吹起的单位（强袭飓风或Eul的神圣法杖）无效。", "b": 2}, {"id": "2cfbb859ab0eabaf7984", "n": "远古冰魄·冰霜漩涡", "m": "ground_zone", "mz": "场地魔法", "c": "基础", "d": "有", "why": "新增", "t": "创造一个寒冰能量的漩涡，对范围内敌人造成伤害和减速，并增加他们受到的魔法伤害。\n提供放置地点的小片视野。", "b": 2}, {"id": "93cc026675e4091853ed", "n": "艾欧·羁绊", "m": "aoe_damage", "mz": "范围伤害", "c": "魔晶", "d": "有", "why": "旧记录", "t": "羁绊会对触碰到的敌人造成伤害。艾欧会回复%damage_to_heal%%%造成伤害。\n将艾欧和一个友方单位连接在一起，提高双方的移动速度。当艾欧回复生命或魔法时，连在一起的友军将获得一部分回复效果。距离过远时连接将会断开，也可以主动断开连接。羁绊会减速触碰到的敌人。\n如果羁绊的目标距离艾欧700码以外，艾欧将链接目标并将自己向目标牵引（牵引后相距300码）。\n被羁绊连接的单位回复速度相比更快，艾欧满血时也能回复。\n艾欧的移动速度与羁绊目标一致。", "b": 2}, {"id": "3d606f5f527d709ca9e6", "n": "陈·神力恩泽", "m": "aura", "mz": "光环", "c": "基础", "d": "有", "why": "旧记录", "t": "被动提供光环，提供生命恢复加成。可以主动对友军施放，提供护甲加成，以及治疗和生命恢复增强。\n\n对陈施放后，陈控制的所有单位都会获得增益效果。", "b": 2}, {"id": "ffa4a3310432cda32bbc", "n": "琼英碧灵·幽魂子弹", "m": "magic_resist_reduction", "mz": "减魔抗/魔法易伤", "c": "魔晶", "d": "有", "why": "旧记录", "t": "琼英碧灵对一个敌人射出一颗幽灵子弹，造成伤害，将其击退并将其变为虚无状态，持续%duration%秒——使他们对物理伤害免疫，并且无法攻击。目标被减速，并且承受的魔法伤害增加%bonus_spell_damage_pct%%%。敌人不会被击出琼英碧灵的攻击距离。", "b": 2}, {"id": "f9b0d96337be23546692", "n": "冥魂大帝·绝冥再生", "m": "slow", "mz": "减速", "c": "基础", "d": "有", "why": "旧记录", "t": "冥魂大帝倒下后，他飞散的冥魂会重组，使他复活。死亡时附近%slow_radius%范围内的敌人会被减速，会产生骷髅兵攻击附近每个敌方英雄。可以对自身施放，使冥魂大帝立刻阵亡。\n如果魔法不足冥魂大帝将不会重生。\n如果冥魂大帝拥有不朽之守护，同时绝冥再生不处于冷却状态，死亡后将首先触发绝冥再生。\n重生后生命值和魔法值全满。", "b": 2}, {"id": "936d0280d2d7218ddd22", "n": "祸乱之源·虚弱", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "没有", "why": "旧记录", "t": "每秒造成伤害，并且降低敌人的总攻击力和施法距离。", "b": 2}, {"id": "28622a4d5ea4e02d5911", "n": "娜迦海妖·镜像", "m": "invulnerable_untargetable", "mz": "无敌/不可选取", "c": "基础", "d": "有", "why": "旧记录", "t": "制造多个受娜迦海妖控制的镜像。\n\n驱散类型：弱驱散\n娜迦海妖在施法时有%invuln_duration%秒的无敌时间，可以用来躲避眩晕和伤害。\n施放后，将会移除娜迦海妖身上大部分效果。\n施放时现有的镜像幻象将被摧毁。", "b": 2}, {"id": "d02c26eb01070d94192b", "n": "散华", "m": "slow_resistance", "mz": "减速抗性", "c": "装备", "d": "有", "why": "新增", "t": "+16 力量\n+25% 减速抗性\n+12% 恢复增强", "b": 1}, {"id": "1daf2cb4ebe48f6f3322", "n": "统御头盔", "m": "execute", "mz": "斩杀", "c": "装备", "d": "没有", "why": "旧记录", "t": "主动：支配\n控制一个中立单位，其移动速度变为380。被支配单位的最大生命值将不会少于1900点。另外还将使该单位+70点基础攻击力，+12点/秒生命恢复，+4点/秒魔法恢复，+7点护甲并且目标的部分技能等级提升1级。\n\n被支配单位的最大生命值大于1900点时将保留原来的最大生命值。施法者会获得被支配单位的原击杀金钱和经验。被支配单位的击杀奖励为固定250金，并且不会被秒杀非英雄单位的技能直接击杀。\n\n被支配单位受到来自敌方英雄或肉山的伤害后3秒内无法使用支配技能。\n也可以支配敌方线上小兵和召唤单位。\n出售会导致支配的单位死亡。\n+21 全属性\n+7 护甲\n+7 生命恢复", "b": 2}, {"id": "8d918edd44f9c25ed3a0", "n": "冥魂大帝·吸血灵魂", "m": "death_prevention", "mz": "免死", "c": "基础", "d": "有", "why": "新增", "t": "冥魂大帝获得吸血效果。被击杀时冥魂大帝变为移动无视地形的冥魂，拥有额外攻击和移动速度，持续较短时间，自身死亡延后。冥魂大帝变为冥魂后无法重生。\n对于死亡被延缓的友军，其成为冥魂前所受的最后一击来源即为击杀者。\n触发绝冥再生时没有效果。\n破坏只会使被动吸血失效。\n复活时间会根据冥魂持续时间而减少。", "b": 1}, {"id": "76142b1d48b0b499f39d", "n": "半人马战行者·马蹄践踏", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "有", "why": "旧记录", "t": "经过短暂的蓄力后，半人马战行者猛踏地面，眩晕并伤害身边的敌方单位。在延迟期间，他被缴械，但可以移动。", "b": 2}, {"id": "35e1deefe15286a30587", "n": "冥魂大帝·吸血灵魂", "m": "death_prevention", "mz": "免死", "c": "A杖", "d": "有", "why": "新增", "t": "吸血灵魂变为光环，使友方英雄被击杀时也能变为冥魂。延长冥魂的持续时间。\n冥魂大帝获得吸血效果。被击杀时冥魂大帝变为移动无视地形的冥魂，拥有额外攻击和移动速度，持续较短时间，自身死亡延后。冥魂大帝变为冥魂后无法重生。\n对于死亡被延缓的友军，其成为冥魂前所受的最后一击来源即为击杀者。\n触发绝冥再生时没有效果。\n破坏只会使被动吸血失效。\n复活时间会根据冥魂持续时间而减少。", "b": 2}, {"id": "abdde1941f59c691d0dc", "n": "露娜·月之祝福", "m": "aura", "mz": "光环", "c": "基础", "d": "有", "why": "旧记录", "t": "提升露娜和附近%radius%范围内友方英雄的攻击力，露娜获得双倍的攻击力加成。夜晚期间月之祝福为全地图生效，并且露娜受到福佑后夜间视野提升。", "b": 2}, {"id": "1d7c154430c226f767d0", "n": "玛尔斯·热血竞技场", "m": "healing", "mz": "治疗/回复", "c": "A杖", "d": "有", "why": "新增", "t": "冷却时间降低%bonus_AbilityCooldown%秒，持续时间提升。如果敌人在竞技场内阵亡，玛尔斯和竞技场内所有友军都会回复%arena_kill_buff_heal_pct%%%最大生命和魔法，并且获得%arena_kill_buff_damage_pct%%%攻击力加成，持续%arena_kill_buff_duration%秒。这个效果可以叠加。\n经过短暂的列队时间，玛尔斯召唤出环绕着战士的竞技场，战士们将阻挡敌人的攻击和动向。竞技场内的敌方英雄靠近边缘时将被战矛攻击，受到伤害并被击退。", "b": 1}, {"id": "2a0cd825aeb784535b1d", "n": "凯·利爪飞掷", "m": "silence", "mz": "沉默", "c": "基础", "d": "有", "why": "旧记录", "t": "凯向目标单位掷出一把钗，施加一次固定伤害的攻击，并造成沉默。\n固定伤害的攻击具有克敌机先效果。", "b": 2}, {"id": "e66cc1b5042e77dde627", "n": "百戏大王·尖刀戏", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "没有", "why": "旧记录", "t": "百戏大王向自己精心选择的地点扔出一把匕首。匕首击中敌人会造成即时伤害，短暂减速击中的单位，并且使他们流血。流血的英雄受到基于目标最大生命值一定百分比的每秒伤害，流血的非英雄单位受到每秒固定伤害。", "b": 2}, {"id": "b569b1a0a1e63496ea3b", "n": "巫医·死亡守卫", "m": "channel_interrupt", "mz": "打断持续施法", "c": "基础", "d": "没有", "why": "旧记录", "t": "持续施法 - 召唤一个死亡守卫，会优先攻击其攻击距离内的敌方英雄。最多持续%abilitychanneltime%秒。死亡守卫拥有%bonus_accuracy%%%额外必中率。\n死亡守卫是无敌的，只有在巫医被打断或持续时间结束后才会被摧毁。\n死亡守卫可以受到控制，选择攻击特定目标。\n死亡守卫每0.22秒攻击一次。", "b": 2}, {"id": "ecaa388def5f8fa31391", "n": "祈求者·急速冷却", "m": "aoe_damage", "mz": "范围伤害", "c": "基础", "d": "没有", "why": "旧记录", "t": "祈求者将敌人的热量抽空，将其降到绝对零度，持续时间取决于冰元素等级。敌人将受到伤害并被短暂冻结，后续攻击会使敌人再次冻结并造成额外伤害。被冻结的频率固定，但是冻结的冷却时间将会随着冰元素等级提高而缩短。\n只有%damage_trigger%点以上的实际伤害才能触发急速冷却。", "b": 2}, {"id": "6977190dd5db65dffb15", "n": "空明杖", "m": "mana_gain", "mz": "自身回蓝/吸蓝", "c": "装备", "d": "有", "why": "旧记录", "t": "+10 智力\n+35 攻击速度\n+1.25 魔法恢复", "b": 2}, {"id": "f1e4567178e1abfcc625", "n": "希瓦的守护", "m": "aoe_damage", "mz": "范围伤害", "c": "装备", "d": "有", "why": "旧记录", "t": "主动：极寒冲击\n发出一道寒冷的波动，对敌人造成225点魔法伤害并减速-40%，持续4秒。\n\n作用范围：825\n\n被动：霜冷光环\n降低所有敌人-40攻击速度。\n\n作用范围：1200\n极寒冲击的扩张速度为400，最大半径为825。\n极寒冲击将以施放者为中心。\n多个霜冷光环效果不会叠加。\n多个裂隙之石或升级物品的作用范围加成不会叠加。\n+17 护甲\n+75 作用范围", "b": 2}, {"id": "c9ccea22ea88c907d36c", "n": "赤红甲", "m": "healing", "mz": "治疗/回复", "c": "装备", "d": "有", "why": "新增", "t": "主动：坚盾\n使周围所有友方英雄和建筑每次受到物理攻击都有100%几率格挡伤害，数值为70 + 2%施法者最大生命值。持续7秒。\n\n作用范围：1200\n\n被动：伤害格挡\n近战英雄每次受到攻击都有60%几率格挡%block_damage_melee%点伤害，远程英雄则是格挡50点。\n多种伤害格挡效果不会叠加。\n坚盾的加成效果施加给远程英雄时，格挡的伤害减少25点。\n坚盾不会作用于赤红甲的冷却时间内已受过坚盾作用的单位。\n+250 生命值\n+12 生命恢复\n+6 护甲", "b": 2}, {"id": "b27d054d73917293dad6", "n": "狂战斧", "m": "mana_gain", "mz": "自身回蓝/吸蓝", "c": "装备", "d": "有", "why": "旧记录", "t": "主动：砍伐\n砍伐一根指定树木。\n\n被动：压制\n对非英雄单位进行物理攻击会造成额外伤害，近战英雄为10点，远程英雄为5点。\n\n被动：分裂\n普通攻击时对目标周围最远650距离的锥形区域内敌人造成60%物理伤害。对非英雄单位造成40%物理伤害。（仅近战有效）\n分裂伤害无视减益免疫。\n如果存在多个分裂效果，每个分裂的伤害都会单独计算。\n+50 攻击力\n+7.5 生命恢复\n+2.75 魔法恢复", "b": 2}, {"id": "53974a045601c57b0aa7", "n": "戴泽·虚无投影", "m": "invulnerable_untargetable", "mz": "无敌/不可选取", "c": "基础", "d": "有", "why": "旧记录", "t": "戴泽的灵魂离开身体，穿过虚无之境变成无敌的幽灵，可以施放技能、攻击和使用物品，他的身体还留在这个世界，和灵魂之间存在着可见的连接。在灵魂形态下，戴泽的基础技能都已强化：剧毒之触带有妖术效果；薄葬结束时会治疗；暗影波的冷却
