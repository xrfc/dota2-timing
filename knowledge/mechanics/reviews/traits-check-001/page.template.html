<title>英雄特性抽查</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a hero rail on wide screens, one column of hero sheets; each sheet is a trait ledger then a relations ledger. */
:root{
  --bg:#f6f7f4;--panel:#ffffff;--ink:#1d2320;--muted:#5d6a63;--line:#d9dfd9;
  --accent:#2f6b4f;--accent-soft:#e3efe8;--warn:#a5481f;--warn-soft:#f7e6dc;--unsure:#7a6a1c;--unsure-soft:#f3edd0;
  --display:"Noto Serif SC",Georgia,"Songti SC",serif;--body:"Noto Sans SC",system-ui,-apple-system,"PingFang SC",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141816;--panel:#1c211e;--ink:#e4e9e5;--muted:#9aa7a0;--line:#2f3732;
  --accent:#7cc39c;--accent-soft:#1f3329;--warn:#f0a07a;--warn-soft:#3a251b;--unsure:#e2cf72;--unsure-soft:#36311a;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141816;--panel:#1c211e;--ink:#e4e9e5;--muted:#9aa7a0;--line:#2f3732;
  --accent:#7cc39c;--accent-soft:#1f3329;--warn:#f0a07a;--warn-soft:#3a251b;--unsure:#e2cf72;--unsure-soft:#36311a;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px}
@media (max-width:820px){.wrap{grid-template-columns:minmax(0,1fr)}.rail{position:static!important;max-height:none!important}}
h1{font-family:var(--display);font-size:1.7rem;margin:0 0 4px;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 10px;max-width:68ch}
.status{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:.9rem;color:var(--muted);margin-bottom:18px}
.status b{color:var(--ink);font-variant-numeric:tabular-nums}
.rail{position:sticky;top:12px;align-self:start;max-height:calc(100vh - 24px);overflow:auto}
.rail h2{font-size:.75rem;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
.rail a{display:flex;justify-content:space-between;gap:8px;padding:5px 8px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:.9rem}
.rail a:hover,.rail a:focus-visible{background:var(--accent-soft);outline:none}
.rail .n{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.8rem}
.rail a.done .n{color:var(--accent)}
.hero{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 18px 8px;margin-bottom:22px;scroll-margin-top:12px}
.hero header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin-bottom:10px}
.hero h2{font-family:var(--display);font-size:1.3rem;margin:0}
.chip{font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.sec{font-size:.75rem;letter-spacing:.08em;color:var(--muted);margin:14px 0 6px;text-transform:uppercase}
.row{display:grid;grid-template-columns:120px 88px minmax(0,1fr);gap:4px 14px;padding:10px 0;border-top:1px solid var(--line)}
@media (max-width:560px){.row{grid-template-columns:1fr 80px}.row .body{grid-column:1/-1}}
.row[data-v="ok"]{background:linear-gradient(90deg,var(--accent-soft),transparent 60%)}
.row[data-v="wrong"]{background:linear-gradient(90deg,var(--warn-soft),transparent 60%)}
.row[data-v="unsure"]{background:linear-gradient(90deg,var(--unsure-soft),transparent 60%)}
.tname{font-weight:600}
.tsrc{display:block;font-size:.75rem;color:var(--muted);font-weight:400}
.count{font-variant-numeric:tabular-nums;font-size:1.05rem}
.count small{display:block;font-size:.72rem;color:var(--muted)}
.abil{display:flex;flex-wrap:wrap;gap:4px 6px;margin:0 0 6px;padding:0;list-style:none}
.abil li{font-size:.85rem;border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.abil li .cond{color:var(--warn);font-size:.75rem;margin-left:4px}
.abil li .q{color:var(--muted);font-size:.75rem;margin-left:4px}
.none{color:var(--muted);font-size:.85rem;margin:0 0 6px}
.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button.v{font:inherit;font-size:.85rem;padding:3px 12px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
button.v:hover{border-color:var(--accent)}
button.v:focus-visible,input.why:focus-visible,details summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.v[aria-pressed="true"][data-k="ok"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
button.v[aria-pressed="true"][data-k="wrong"]{background:var(--warn);border-color:var(--warn);color:var(--panel)}
button.v[aria-pressed="true"][data-k="unsure"]{background:var(--unsure);border-color:var(--unsure);color:var(--panel)}
input.why{font:inherit;font-size:.85rem;flex:1 1 200px;min-width:0;padding:3px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
details.zero{border-top:1px solid var(--line);padding:8px 0}
details.zero summary{cursor:pointer;color:var(--muted);font-size:.9rem}
.rel{padding:10px 0;border-top:1px solid var(--line)}
.rel ul{margin:0 0 8px;padding-left:18px}
.rel li{margin:2px 0;font-size:.9rem}
.rel .rule{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:4px}
.rel .tag{font-size:.72rem;color:var(--warn);margin-left:4px}
.help{font-size:.85rem;color:var(--muted);max-width:68ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div class="wrap">
  <nav class="rail" aria-label="英雄">
    <h2>英雄（已标/项数）</h2>
    <div id="nav"></div>
  </nav>
  <main>
    <h1>英雄特性抽查</h1>
    <p class="lede">从127个英雄里抽了32个（约1/4）。每个英雄看三部分：特性数量是否符合你的预期、每个技能记的机制有没有错或漏（如英雄特有的免死），以及“可能克制它的”候选关联是否合理。每项点“对 / 错 / 不确定”，错和不确定请写一句原因。没点的不算看过。</p>
    <p class="help">“基础”只算基础版和装备就有的技能；“含升级”再加上只有A杖或魔晶才有的技能。技能后面的橙字是生效条件，“未确认”表示这条事实目前只有AI一致。</p>
    <div class="status"><span>已标 <b id="done">0</b> / <b id="total">0</b></span><span>错 <b id="nwrong">0</b></span><span>不确定 <b id="nunsure">0</b></span><span id="save">正在连接保存服务…</span></div>
    <div id="list"></div>
  </main>
</div>
<script>
const DATA = __DATA__;
const $=id=>document.getElementById(id);
const verdicts=new Map();let db=null,pending=0,writing=Promise.resolve();
const items=[];
for(const h of DATA.rows){for(const t of h.traits)items.push({id:t.id,hero:h.hero_id});for(const a of h.abilities)items.push({id:a.id,hero:h.hero_id});items.push({id:h.rel_id,hero:h.hero_id})}
$("total").textContent=items.length;
function stats(){
  let done=0,w=0,u=0;
  for(const it of items){const v=verdicts.get(it.id);if(v){done++;if(v.verdict==="wrong")w++;if(v.verdict==="unsure")u++}}
  $("done").textContent=done;$("nwrong").textContent=w;$("nunsure").textContent=u;
  for(const h of DATA.rows){
    const own=items.filter(i=>i.hero===h.hero_id),n=own.filter(i=>verdicts.has(i.id)).length;
    const a=$("nav-"+h.hero_id);if(a){a.querySelector(".n").textContent=n+"/"+own.length;a.classList.toggle("done",n===own.length)}
  }
}
function save(id,verdict,note){
  verdicts.set(id,{verdict,note});stats();
  if(!db){$("save").textContent="未连接，这次没有保存";return}
  pending++;$("save").textContent="保存中…";
  writing=writing.then(()=>db.doc("verdicts/"+id).set({verdict,note:note||"",at:new Date().toISOString()}))
    .then(()=>{pending--;if(!pending)$("save").textContent="已保存"})
    .catch(()=>{pending--;$("save").textContent="保存失败，刷新后再点一次"});
}
function acts(id,row){
  const v=verdicts.get(id);if(v)row.dataset.v=v.verdict;
  const box=document.createElement("div");box.className="acts";
  const why=document.createElement("input");why.className="why";why.id="why-"+id;why.placeholder="为什么（选填）";why.setAttribute("aria-label","原因");why.value=v?v.note||"":"";why.hidden=!v||v.verdict==="ok";
  for(const [k,label] of [["ok","对"],["wrong","错"],["unsure","不确定"]]){
    const b=document.createElement("button");b.type="button";b.className="v";b.dataset.k=k;b.textContent=label;b.setAttribute("aria-pressed",v&&v.verdict===k?"true":"false");
    b.addEventListener("click",()=>{save(id,k,k==="ok"?"":why.value);row.dataset.v=k;box.querySelectorAll(".v").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));why.hidden=k==="ok";if(k!=="ok")why.focus()});
    box.appendChild(b);
  }
  why.addEventListener("change",()=>{const cur=verdicts.get(id);if(cur)save(id,cur.verdict,why.value)});
  box.appendChild(why);return box;
}
function srcText(s){return Array.isArray(s)?s.map(m=>DATA.mz[m]||m).join("、"):s}
function traitRow(t){
  const row=document.createElement("div");row.className="row";
  const name=document.createElement("div");name.className="tname";name.textContent=t.zh;
  const src=document.createElement("span");src.className="tsrc";src.textContent="按："+srcText(t.source);name.appendChild(src);
  const c=document.createElement("div");c.className="count";c.textContent=t.base+" / "+t.up;
  const sm=document.createElement("small");sm.textContent="基础 / 含升级";c.appendChild(sm);
  const body=document.createElement("div");body.className="body";
  if(t.abilities.length){
    const ul=document.createElement("ul");ul.className="abil";
    for(const a of t.abilities){
      const li=document.createElement("li");li.textContent=a.name;
      const q=document.createElement("span");q.className="q";q.textContent="("+a.via.map(m=>DATA.mz[m]||m).join("、")+(a.confirmed?"":"，未确认")+")";li.appendChild(q);
      if(a.condition){const s=document.createElement("span");s.className="cond";s.textContent=a.condition;li.appendChild(s)}
      ul.appendChild(li);
    }
    body.appendChild(ul);
  }else{const p=document.createElement("p");p.className="none";p.textContent=t.up?"按名单或规则计入，没有逐技能证据":"没有算进任何技能";body.appendChild(p)}
  body.appendChild(acts(t.id,row));
  row.append(name,c,body);return row;
}
function abilityRow(a){
  const row=document.createElement("div");row.className="row";
  const name=document.createElement("div");name.className="tname";name.textContent=a.name;
  const tags=[a.damage_type?a.damage_type+"伤害":"",a.dispellable||""].filter(Boolean);
  if(tags.length){const s=document.createElement("span");s.className="tsrc";s.textContent=tags.join("，");name.appendChild(s)}
  const c=document.createElement("div");c.className="count";c.textContent=a.mechanisms.length;
  const sm=document.createElement("small");sm.textContent="条机制";c.appendChild(sm);
  const body=document.createElement("div");body.className="body";
  if(a.mechanisms.length){
    const ul=document.createElement("ul");ul.className="abil";
    for(const m of a.mechanisms){
      const li=document.createElement("li");li.textContent=m.zh;
      if(!m.confirmed){const q=document.createElement("span");q.className="q";q.textContent="(未确认)";li.appendChild(q)}
      if(m.condition){const s=document.createElement("span");s.className="cond";s.textContent=m.condition;li.appendChild(s)}
      ul.appendChild(li);
    }
    body.appendChild(ul);
  }else{const p=document.createElement("p");p.className="none";p.textContent="没有记任何机制";body.appendChild(p)}
  body.appendChild(acts(a.id,row));
  row.append(name,c,body);return row;
}
function relBlock(h){
  const box=document.createElement("div");box.className="rel";
  const intro=document.createElement("p");intro.className="help";intro.textContent="下面是规则算出的候选：哪些装备或技能可能针对它的哪些技能（不是已验证的关联）。整体看是否合理。";box.appendChild(intro);
  const ul=document.createElement("ul");
  if(!h.targeted_by.length){const li=document.createElement("li");li.textContent="没有算出可能针对它的关联";ul.appendChild(li)}
  for(const e of h.targeted_by){
    const li=document.createElement("li");
    const r=document.createElement("span");r.className="rule";r.textContent=e.rule;li.appendChild(r);
    const items=e.items.length?"装备："+e.items.slice(0,8).join("、")+(e.items.length>8?"等"+e.items.length+"件":""):"无装备来源";
    li.append(e.zh+"｜涉及："+e.own.join("、")+"｜"+items+"｜技能来源"+e.ability_sources+"个");
    if(e.conditional){const t=document.createElement("span");t.className="tag";t.textContent="有条件";li.appendChild(t)}
    if(e.status==="pending"){const t=document.createElement("span");t.className="tag";t.textContent="待定";li.appendChild(t)}
    ul.appendChild(li);
  }
  box.appendChild(ul);
  box.appendChild(acts(h.rel_id,box));
  return box;
}
function render(){
  const nav=$("nav"),list=$("list");nav.replaceChildren();list.replaceChildren();
  for(const h of DATA.rows){
    const a=document.createElement("a");a.href="#h"+h.hero_id;a.id="nav-"+h.hero_id;
    const nm=document.createElement("span");nm.textContent=h.name;const n=document.createElement("span");n.className="n";
    a.append(nm,n);nav.appendChild(a);
    const sec=document.createElement("section");sec.className="hero";sec.id="h"+h.hero_id;
    const head=document.createElement("header");const h2=document.createElement("h2");h2.textContent=h.name;head.appendChild(h2);
    for(const w of h.why){const c=document.createElement("span");c.className="chip";c.textContent=w;head.appendChild(c)}
    sec.appendChild(head);
    const s1=document.createElement("div");s1.className="sec";s1.textContent="特性数量";sec.appendChild(s1);
    const zero=document.createElement("details");zero.className="zero";
    const sum=document.createElement("summary");zero.appendChild(sum);let nz=0;
    for(const t of h.traits){if(t.up>0)sec.appendChild(traitRow(t));else{zero.appendChild(traitRow(t));nz++}}
    sum.textContent="为0的特性 "+nz+" 项（展开看看有没有漏）";if(nz)sec.appendChild(zero);
    const s3=document.createElement("div");s3.className="sec";s3.textContent="全部技能机制（漏了什么请写在原因里）";sec.appendChild(s3);
    for(const a of h.abilities)sec.appendChild(abilityRow(a));
    const s2=document.createElement("div");s2.className="sec";s2.textContent="可能克制它的（候选关联）";sec.appendChild(s2);
    sec.appendChild(relBlock(h));
    list.appendChild(sec);
  }
  stats();
}
render();
(async()=>{
  const timer=setTimeout(()=>{if(!db)$("save").textContent="连不上保存服务，刷新试试"},10000);
  try{
    db=await claude.use("db");
    if(!db){clearTimeout(timer);$("save").textContent="这个视图不能保存，请登录后打开";return}
    let first=true;
    db.collection("verdicts").limit(1000).onSnapshot((snap)=>{
      clearTimeout(timer);
      snap.docs.forEach(d=>{const x=d.data();verdicts.set(d.id,{verdict:x.verdict,note:x.note||""})});
      if(!pending)$("save").textContent="已连接，自动保存";
      if(first){first=false;render()}else stats();
    },()=>{$("save").textContent="同步中断，刷新后继续"});
  }catch(e){clearTimeout(timer);$("save").textContent="连不上保存服务，刷新试试"}
})();
</script>
