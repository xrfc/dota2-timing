[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dota2-item-timing"
version = "0.4.0"
description = "Reproducible Dota 2 replay datasets and coaching model workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
replay = ["gem-dota==0.10.0"]
data = ["pandas>=2.2,<3", "scikit-learn>=1.5,<2"]

[project.scripts]
dota-items = "dota_items.cli:main"
dota-coach = "dota_items.workflow.cli:main"
dota-recommend = "dota_items.recommendation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
