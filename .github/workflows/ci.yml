name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,replay,data]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python scripts/check.py
      - if: matrix.python == '3.12'
        run: python -m pip install "playwright>=1.50,<2"
      - if: matrix.python == '3.12'
        run: python -m playwright install --with-deps chromium
      - if: matrix.python == '3.12'
        run: python learning/tests/browser_check.py
      - if: matrix.python == '3.12' && always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-preview
          path: learning/output/screenshots/
          if-no-files-found: ignore
      - run: dota-items report examples/match.synthetic.json --player-slot 0 --output reports/smoke
      - run: python coach.py --workspace coach-workspace/ci demo
      - run: python coach.py --workspace coach-workspace/ci doctor
  portable-workflow:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,data]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: >-
          python -m pytest tests/test_coach_workflow.py tests/test_data_preparation.py
          tests/test_adapter_processes.py tests/test_report_evidence.py
          tests/test_task_contracts.py tests/test_cohort_split_feasibility.py -q
      - run: python scripts/check.py --scope learning
      - run: python coach.py --workspace coach-workspace/ci demo
